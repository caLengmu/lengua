<!DOCTYPE html>
<html lang="zh-Hant" data-theme="sepia">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LexiStory Lab｜單字語境與故事互動學習系統</title>
  <!-- 載入 Google Fonts: Inter 與 Noto Sans TC 提升中英混排閱讀體驗 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & THEME SYSTEM (方便未來一鍵擴充或更換整體配色)
       ========================================================================== */
    :root {
      /* 基礎字級比例：手機版預設稍大(17.5px)，桌機版(16.5px)，並受 --font-scale 控制 */
      --base-font-size: 17.5px;
      --font-scale: 1;

      /* 預設主題：護眼暖白 (Sepia / Warm Paper) */
      --bg-app: #f7f5f0;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f0ece1;
      --bg-highlight: #fef3c7;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --text-muted: #64748b;

      --brand-primary: #0f766e;       /* 沉穩青綠 */
      --brand-primary-hover: #115e59;
      --brand-primary-soft: #ccfbf1;
      --brand-accent: #d97706;        /* 暖琥珀強調色 */
      --brand-accent-soft: #fef3c7;

      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;

      --status-success: #15803d;
      --status-success-bg: #dcfce7;
      --status-error: #b91c1c;
      --status-error-bg: #fee2e2;

      /* 圓角與陰影系統 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-pill: 9999px;

      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.12);

      --transition-fast: 160ms ease;
      --transition-normal: 250ms ease;
    }

    /* 主題二：清爽學院藍 (Ocean Breeze) */
    [data-theme="ocean"] {
      --bg-app: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-surface-alt: #e2e8f0;
      --bg-highlight: #dbeafe;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;

      --brand-primary: #2563eb;
      --brand-primary-hover: #1d4ed8;
      --brand-primary-soft: #dbeafe;
      --brand-accent: #0284c7;
      --brand-accent-soft: #e0f2fe;

      --border-color: #cbd5e1;
      --border-strong: #94a3b8;
    }

    /* 主題三：夜間護眼深色 (Midnight Slate) */
    [data-theme="dark"] {
      --bg-app: #0f172a;
      --bg-surface: #1e293b;
      --bg-surface-alt: #334155;
      --bg-highlight: #3b2f1e;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;

      --brand-primary: #2dd4bf;
      --brand-primary-hover: #14b8a6;
      --brand-primary-soft: #134e4a;
      --brand-accent: #fbbf24;
      --brand-accent-soft: #451a03;

      --border-color: #334155;
      --border-strong: #475569;

      --status-success: #4ade80;
      --status-success-bg: #14532d;
      --status-error: #f87171;
      --status-error-bg: #7f1d1d;
    }

    @media (min-width: 768px) {
      :root {
        --base-font-size: 16.5px;
      }
    }

    /* ==========================================================================
       2. BASE & RESET STYLES
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: calc(var(--base-font-size) * var(--font-scale));
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.65;
      min-height: 100vh;
      padding-bottom: 5rem;
      transition: background-color var(--transition-normal), color var(--transition-normal);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 1rem;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      touch-action: manipulation;
    }

    /* ==========================================================================
       3. LAYOUT & HEADER CONTROLS
       ========================================================================== */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 0.75rem 1rem;
    }

    .header-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--brand-primary);
    }

    .brand-badge {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: var(--radius-pill);
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
      font-weight: 600;
    }

    .toolbar-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    /* 字體調整器 & 主題切換器 */
    .control-pill-group {
      display: inline-flex;
      align-items: center;
      background: var(--bg-surface-alt);
      padding: 0.2rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-color);
    }

    .pill-btn {
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
      min-width: 2.1rem;
      min-height: 2.1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .pill-btn.active {
      background: var(--brand-primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    [data-theme="dark"] .pill-btn.active {
      color: #0f172a;
    }

    /* 語速控制列 (常駐於頂部下方) */
    .tts-bar {
      background: var(--bg-surface-alt);
      border-bottom: 1px solid var(--border-color);
      padding: 0.55rem 1rem;
    }

    .tts-bar-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.9rem;
    }

    .tts-speed-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .tts-slider {
      width: 110px;
      accent-color: var(--brand-primary);
      cursor: pointer;
    }

    /* 主導覽分頁 (Tabs) */
    .main-container {
      max-width: 1120px;
      margin: 1rem auto;
      padding: 0 1rem;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      background: var(--bg-surface);
      padding: 0.4rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
    }

    .nav-tab {
      padding: 0.65rem 0.5rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      transition: all var(--transition-fast);
      text-align: center;
    }

    @media (min-width: 640px) {
      .nav-tab {
        flex-direction: row;
        gap: 0.45rem;
        font-size: 0.98rem;
      }
    }

    .nav-tab:hover {
      background: var(--bg-surface-alt);
    }

    .nav-tab.active {
      background: var(--brand-primary);
      color: #ffffff;
    }

    [data-theme="dark"] .nav-tab.active {
      color: #0f172a;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================================
       4. CARDS, FORMS & BUTTONS
       ========================================================================== */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      margin-bottom: 1.25rem;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.65rem 1.1rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      transition: all var(--transition-fast);
      min-height: 44px; /* 符合行動端觸控友善高度 */
    }

    .btn-primary {
      background: var(--brand-primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--brand-primary-hover);
    }
    [data-theme="dark"] .btn-primary {
      color: #0f172a;
    }

    .btn-secondary {
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }
    .btn-secondary:hover {
      border-color: var(--brand-primary);
    }

    .btn-accent {
      background: var(--brand-accent);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--status-error-bg);
      color: var(--status-error);
    }

    .btn-sm {
      padding: 0.38rem 0.75rem;
      font-size: 0.88rem;
      min-height: 36px;
      border-radius: var(--radius-sm);
    }

    /* 發音小按鈕 */
    .speak-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-pill);
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 36px;
      min-width: 36px;
      transition: transform 0.1s ease, background var(--transition-fast);
      flex-shrink: 0;
    }

    .speak-btn:hover {
      filter: brightness(0.95);
    }

    .speak-btn:active {
      transform: scale(0.95);
    }

    .speak-btn.speaking {
      background: var(--brand-accent);
      color: #ffffff;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .form-grid-2 {
        grid-template-columns: 1fr 1fr;
      }
      .form-grid-3 {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
      color: var(--text-secondary);
    }

    .form-control {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      transition: border-color var(--transition-fast);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px var(--brand-primary-soft);
    }

    /* ==========================================================================
       5. GROUP SELECTOR & STUDY CARDS
       ========================================================================== */
    .group-pills-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      scrollbar-width: thin;
    }

    .group-pill {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      font-weight: 600;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .group-pill.active {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: var(--brand-primary);
    }

    [data-theme="dark"] .group-pill.active {
      color: #0f172a;
    }

    /* 故事閱讀區塊 */
    .story-box {
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-surface-alt) 100%);
      border: 2px solid var(--brand-primary-soft);
      border-radius: var(--radius-lg);
      padding: 1.35rem;
      margin-bottom: 1.5rem;
    }

    .story-text {
      font-size: 1.08rem;
      line-height: 1.85;
      margin-top: 0.75rem;
    }

    .story-sentence {
      padding: 0.15rem 0.25rem;
      border-radius: 6px;
      transition: background-color 0.2s ease;
      cursor: pointer;
    }

    .story-sentence:hover {
      background-color: var(--brand-primary-soft);
    }

    .story-sentence.active-reading {
      background-color: var(--bg-highlight);
      box-shadow: 0 0 0 2px var(--brand-accent);
    }

    .story-text strong.target-word {
      color: var(--brand-primary);
      background: var(--brand-primary-soft);
      padding: 0.05rem 0.35rem;
      border-radius: 6px;
      font-weight: 700;
    }

    /* 單字學習卡片 */
    .vocab-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 900px) {
      .vocab-list {
        grid-template-columns: 1fr 1fr;
      }
    }

    .vocab-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 1.15rem;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.85rem;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }

    .vocab-card:hover {
      box-shadow: var(--shadow-md);
    }

    .vocab-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 0.6rem;
    }

    .vocab-word {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--brand-primary);
    }

    .vocab-pos {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--text-muted);
      margin-left: 0.35rem;
    }

    .vocab-zh {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .sentence-block {
      background: var(--bg-surface-alt);
      padding: 0.75rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.65rem;
    }

    .sentence-label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 0.1rem 0.45rem;
      border-radius: 4px;
      margin-bottom: 0.25rem;
    }

    .label-illus {
      background: var(--brand-primary-soft);
      color: var(--brand-primary);
    }

    .label-colloc {
      background: var(--brand-accent-soft);
      color: var(--brand-accent);
    }

    /* ==========================================================================
       6. QUIZ ENGINE STYLES
       ========================================================================== */
    .quiz-option {
      width: 100%;
      text-align: left;
      padding: 0.9rem 1.1rem;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background: var(--bg-surface);
      font-weight: 600;
      margin-bottom: 0.65rem;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .quiz-option:hover:not(:disabled) {
      border-color: var(--brand-primary);
      background: var(--bg-surface-alt);
    }

    .quiz-option.correct {
      border-color: var(--status-success);
      background: var(--status-success-bg);
      color: var(--status-success);
    }

    .quiz-option.wrong {
      border-color: var(--status-error);
      background: var(--status-error-bg);
      color: var(--status-error);
    }

    /* ==========================================================================
       7. TOAST NOTIFICATION & MODAL
       ========================================================================== */
    .toast-container {
      position: fixed;
      bottom: 1.25rem;
      right: 1.25rem;
      left: 1.25rem;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      gap: 0.5rem;
    }

    .toast {
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-pill);
      box-shadow: var(--shadow-lg);
      font-weight: 600;
      font-size: 0.92rem;
      pointer-events: auto;
      animation: slideUp 0.25s ease;
      max-width: 90vw;
      text-align: center;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loader-spinner {
      width: 1.1rem;
      height: 1.1rem;
      border: 2.5px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽與無障礙字級/主題控制列 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-title">
        <span>📖 LexiStory Lab</span>
        <span class="brand-badge">B2 語境學習</span>
      </div>

      <div class="toolbar-controls">
        <!-- 四段式字級調整器 -->
        <div class="control-pill-group" role="group" aria-label="字體大小調整">
          <button class="pill-btn" data-scale="0.9" title="縮小字體">A-</button>
          <button class="pill-btn active" data-scale="1" title="標準字體">A</button>
          <button class="pill-btn" data-scale="1.15" title="放大字體">A+</button>
          <button class="pill-btn" data-scale="1.3" title="特大字體">A++</button>
        </div>

        <!-- 三種護眼主題切換 -->
        <div class="control-pill-group" role="group" aria-label="色彩主題切換">
          <button class="pill-btn active" data-theme-btn="sepia" title="暖白護眼">☀️ 暖白</button>
          <button class="pill-btn" data-theme-btn="ocean" title="清爽藍">🌊 清爽</button>
          <button class="pill-btn" data-theme-btn="dark" title="夜間深色">🌙 夜間</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 全域語音語速控制列 -->
  <div class="tts-bar">
    <div class="tts-bar-inner">
      <div class="tts-speed-group">
        <strong>🔊 朗讀語速：</strong>
        <button class="pill-btn speed-preset" data-rate="0.6">0.6x 慢速</button>
        <button class="pill-btn speed-preset" data-rate="0.8">0.8x 適中</button>
        <button class="pill-btn speed-preset active" data-rate="1.0">1.0x 正常</button>
        <button class="pill-btn speed-preset" data-rate="1.2">1.2x 進階</button>
        <input type="range" id="rateSlider" class="tts-slider" min="0.5" max="1.5" step="0.05" value="1.0" aria-label="微調語速" />
        <span id="rateValueLabel" style="font-weight:700; min-width:3.2rem;">1.00x</span>
      </div>

      <div style="display:flex; gap:0.4rem; align-items:center;">
        <select id="voiceSelect" class="form-control" style="padding:0.25rem 0.5rem; font-size:0.85rem; max-width:190px;" aria-label="選擇英語發音聲線">
          <option value="">自動選擇自然英語發音</option>
        </select>
        <button id="stopSpeechBtn" class="btn btn-secondary btn-sm">⏹ 停止朗讀</button>
      </div>
    </div>
  </div>

  <!-- 主內容區 -->
  <main class="main-container">
    <!-- 四大功能分頁 -->
    <nav class="nav-tabs" role="tablist">
      <button class="nav-tab active" data-tab="setupTab">
        <span>⚙️</span><span>1. 單字與分組</span>
      </button>
      <button class="nav-tab" data-tab="studyTab">
        <span>📚</span><span>2. 故事與例句學習</span>
      </button>
      <button class="nav-tab" data-tab="quizTab">
        <span>🎯</span><span>3. 三合一互動測驗</span>
      </button>
      <button class="nav-tab" data-tab="historyTab">

    /**

      masterWords: JSON.parse(JSON.stringify(DEFAULT_B2_WORDS)),
      groups: [], // 格式: [{ groupIndex: 0, title: "第 1 組", words: [...], story: "...", storyZh: "..." }]

    /**
     * ============================================================================
     * MODULE 3: UTILITY & TOAST NOTIFICATIONS
     * ============================================================================
     */
    function showToast(message, duration = 3000) {
      const container = document.getElementById("toastContainer");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(10px)";
        toast.style.transition = "all 0.25s ease";
        setTimeout(() => toast.remove(), 260);
      }, duration);
    }

    function escapeHTML(str) {
      if (!str) return "";
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /**
     * 將故事或例句中的目標單字（含常見詞形變化）加上粗體標記
     */
    function highlightTargetWords(text, wordList) {
      if (!text) return "";
      let safeText = escapeHTML(text);
      // 依單字長度由長到短排序，避免短字干擾長字
      const sortedWords = [...wordList]
        .map(w => w.word.trim())
        .filter(Boolean)
        .sort((a, b) => b.length - a.length);

      sortedWords.forEach(word => {
        const escapedWord = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
        // 允許常見詞尾變化 (s, es, ed, d, ing, ly)
        const regex = new RegExp(`\\b(${escapedWord}(?:s|es|ed|d|ing|ly)?)\\b`, "gi");
        safeText = safeText.replace(regex, '<strong class="target-word">$1</strong>');
      });
      return safeText;
    }

    /**
     * ============================================================================
     * MODULE 4: SPEECH CONTROLLER (Web Speech API 語音朗讀與語速控制)
     * ============================================================================
     */
    const SpeechController = {
      synth: window.speechSynthesis,
      voices: [],
      isReadingStory: false,

      init() {
        const loadVoices = () => {
          this.voices = this.synth.getVoices();
          const select = document.getElementById("voiceSelect");
          if (!select) return;

          const enVoices = this.voices.filter(v => v.lang.toLowerCase().startsWith("en"));
          select.innerHTML = '<option value="">自動選擇自然英語發音</option>';
          enVoices.forEach(v => {
            const opt = document.createElement("option");
            opt.value = v.voiceURI;
            opt.textContent = `${v.name} (${v.lang})`;
            select.appendChild(opt);
          });
        };

        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
          speechSynthesis.onvoiceschanged = loadVoices;
        }
      },

      getPreferredVoice() {
        if (AppState.selectedVoiceURI) {
          const found = this.voices.find(v => v.voiceURI === AppState.selectedVoiceURI);
          if (found) return found;
        }
        // 優先挑選美式或英式自然發音
        return (
          this.voices.find(v => v.lang === "en-US" && (v.name.includes("Google") || v.name.includes("Natural") || v.name.includes("Samantha"))) ||
          this.voices.find(v => v.lang.startsWith("en-US")) ||
          this.voices.find(v => v.lang.startsWith("en")) ||
          null
        );
      },

      stop() {
        this.isReadingStory = false;
        if (this.synth.speaking || this.synth.pending) {
          this.synth.cancel();
        }
        document.querySelectorAll(".speak-btn.speaking").forEach(btn => btn.classList.remove("speaking"));
        document.querySelectorAll(".story-sentence.active-reading").forEach(el => el.classList.remove("active-reading"));
      },

      speak(text, triggerBtn = null, onEndCallback = null) {
        if (!("speechSynthesis" in window)) {
          showToast("⚠️ 您的瀏覽器不支援語音朗讀功能");
          return;
        }

        this.stop();

        const cleanText = text.replace(/<[^>]*>/g, "").trim();
        if (!cleanText) return;

        const utterance = new SpeechSynthesisUtterance(cleanText);
        const voice = this.getPreferredVoice();
        if (voice) utterance.voice = voice;
        utterance.lang = voice ? voice.lang : "en-US";
        utterance.rate = AppState.speechRate;
        utterance.pitch = 1.0;

        if (triggerBtn) triggerBtn.classList.add("speaking");

        utterance.onend = () => {
          if (triggerBtn) triggerBtn.classList.remove("speaking");
          if (onEndCallback) onEndCallback();
        };

        utterance.onerror = () => {
          if (triggerBtn) triggerBtn.classList.remove("speaking");
        };

        this.synth.speak(utterance);
      },

      /**
       * 逐句朗讀整篇故事並同步高亮當前句子
       */
      speakStorySentences(sentenceElements, fullStoryBtn) {
        if (!sentenceElements || sentenceElements.length === 0) return;
        this.stop();
        this.isReadingStory = true;
        if (fullStoryBtn) fullStoryBtn.classList.add("speaking");

        let idx = 0;
        const readNext = () => {
          if (!this.isReadingStory || idx >= sentenceElements.length) {
            this.stop();
            return;
          }

          document.querySelectorAll(".story-sentence.active-reading").forEach(el => el.classList.remove("active-reading"));
          const currentEl = sentenceElements[idx];
          currentEl.classList.add("active-reading");

          const utterance = new SpeechSynthesisUtterance(currentEl.textContent.trim());
          const voice = this.getPreferredVoice();
          if (voice) utterance.voice = voice;
          utterance.lang = voice ? voice.lang : "en-US";
          utterance.rate = AppState.speechRate;

          utterance.onend = () => {
            idx++;
            readNext();
          };
          utterance.onerror = () => {
            this.stop();
          };

          this.synth.speak(utterance);
        };

        readNext();
      }
    };

    /**
     * ============================================================================
     * MODULE 5: AI SERVICE (串接 Gemini API 生成雙軌例句與連貫短篇故事)
     * ============================================================================
     */
    const AIService = {
      apiKey: "", // 執行環境會自動注入 API Key
      model: "gemini-3-flash-preview",

      async fetchWithBackoff(url, payload, maxRetries = 3) {
        let delay = 1000;
        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
          } catch (err) {
            if (attempt === maxRetries) throw err;
            await new Promise(res => setTimeout(res, delay));
            delay *= 2;
          }
        }
      },

      /**
       * 為單一組別生成：
       * 1. 缺少例句或釋義的單字補全（簡化示範句 + 10字內高頻搭配詞）
       * 2. 該組單字的連貫短篇故事 (120-180 字) + 中文大意
       */
      async enrichGroupWithAI(groupWords) {
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${this.model}:generateContent?key=${this.apiKey}`;

        const prompt = `你是一位專業的英語教學專家。請根據以下單字或片語清單，回傳 JSON 結構資料：
1. 針對每個單字：
   - 若原本已有 zh（繁中釋義）、illustrative（簡化版語境示範句）、collocation（10字內高頻搭配詞短句），請保留或微調使其更自然；若缺少，請自動補全！
   - illustrative 必須使用簡單基礎的英文單字（A1-B1程度），但包含明顯的上下文線索，讓學生不用查字典也能從句意猜出目標單字的意思。
   - collocation 必須是 10 個英文單字以內的超短自然例句，展現該字最常考的高頻搭配詞。
2. 撰寫一篇包含這組「所有」目標單字的連貫短篇故事（story），長度約 120-170 個英文字，情節生動有趣且適合高中至大學生閱讀，並提供繁體中文故事翻譯（storyZh）。

單字清單：
${JSON.stringify(groupWords.map(w => ({ word: w.word, pos: w.pos || "", zh: w.zh || "", illustrative: w.illustrative || "", collocation: w.collocation || "" })))}`;

        const payload = {
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                words: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      word: { type: "STRING" },
                      pos: { type: "STRING" },
                      zh: { type: "STRING" },
                      illustrative: { type: "STRING" },
                      collocation: { type: "STRING" }
                    },
                    required: ["word", "pos", "zh", "illustrative", "collocation"]
                  }
                },
                story: { type: "STRING" },
                storyZh: { type: "STRING" }
              },
              required: ["words", "story", "storyZh"]
            }
          }
        };

        const result = await this.fetchWithBackoff(apiUrl, payload);
        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("Empty AI response");
        return JSON.parse(text);
      },

      /**
       * 離線備援故事生成器（無網路或選擇離線模式時使用）
       */
      generateFallbackStory(groupWords) {
        const wordList = groupWords.map(w => w.word);
        const joined = wordList.join(", ");
        const story = `During our weekly study workshop, our group focused on mastering ${wordList.length} key vocabulary items: ${joined}. Every student tried to ${wordList[0] || "practice"} their understanding by creating real-life examples. Even when the grammar seemed tricky at first, we refused to give up and worked together to connect each word into a meaningful context. By reviewing both the illustrative clues and short collocations, we made steady progress and felt much more confident using these expressions in daily conversation.`;
        const storyZh = `在每週的學習工作坊中，我們小組專注於掌握這 ${wordList.length} 個核心詞彙（${joined}）。每位同學都試著透過造出貼近生活的例句來加深理解。即使一開始覺得用法有些挑戰，我們依然互相合作，將每個單字串連進有意義的語境中。透過同時複習語境示範句與高頻搭配短句，我們穩步進步，在日常對話中運用這些字彙也變得更有信心。`;
        return { story, storyZh };
      }
    };

    /**
     * ============================================================================
     * MODULE 6: GROUPING & WORD PARSER ENGINE (分組演算法與文字匯入解析)
     * ============================================================================
     */
    const WordProcessor = {
      /**
       * 解析使用者貼上的自訂單字/片語清單
       */
      parseCustomInput(rawText) {
        const lines = rawText
          .split(/\r?\n/)
          .map(line => line.trim())
          .filter(Boolean);

        return lines.map((line, index) => {
          // 支援用 | 或 Tab 或 ： 分隔
          const parts = line.split(/\s*\|\s*|\t+/).map(p => p.trim());
          return {
            id: Date.now() + index,
            word: parts[0] || "",
            pos: parts[1] || "",
            zh: parts[2] || "",
            illustrative: parts[3] || "",
            collocation: parts[4] || ""
          };
        }).filter(item => item.word.length > 0);
      },

      /**
       * 依選擇的排序方式與每組數量進行切分（最後餘數自動成一組）
       */
      chunkWords(words, orderMode = "sequential", groupSize = 10) {
        const pool = [...words];
        if (orderMode === "random") {
          for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
          }
        }

        const size = Math.max(1, parseInt(groupSize, 10) || 10);
        const chunks = [];
        for (let i = 0; i < pool.length; i += size) {
          chunks.push(pool.slice(i, i + size));
        }
        return chunks;
      }
    };

    /**
     * ============================================================================
     * MODULE 7: STORAGE MANAGER (LocalStorage 日期存檔與 JSON 備份匯出/匯入)
     * ============================================================================
     */
    const StorageManager = {
      STORAGE_KEY: "lexistory_saved_sessions_v1",

      getAllSessions() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      },

      saveSession(customTitle) {
        if (!AppState.groups || AppState.groups.length === 0) {
          showToast("⚠️ 目前沒有可儲存的學習內容，請先產生分組！");
          return;
        }

        const today = new Date().toISOString().split("T")[0]; // YYYY-MM-DD
        const totalWords = AppState.groups.reduce((acc, g) => acc + g.words.length, 0);
        const title = customTitle.trim() || `單字與故事學習 (${AppState.groups.length}組 / 共${totalWords}字)`;

        const newRecord = {
          id: "rec_" + Date.now(),
          date: today,
          timestamp: new Date().toLocaleString("zh-TW", { hour12: false }),
          title: title,
          totalWords: totalWords,
          groups: AppState.groups
        };

        const sessions = this.getAllSessions();
        sessions.unshift(newRecord);
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(sessions));
        showToast(`✅ 已成功存檔：「${today} - ${title}」`);
        UIRenderer.renderHistoryList();
      },

      deleteSession(id) {
        const sessions = this.getAllSessions().filter(s => s.id !== id);
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(sessions));
        showToast("🗑️ 已刪除該筆學習紀錄");
        UIRenderer.renderHistoryList();
      },

      loadSession(id) {
        const session = this.getAllSessions().find(s => s.id === id);
        if (!session) return;

        AppState.groups = session.groups;
        AppState.activeGroupIndex = 0;
        AppState.masterWords = session.groups.flatMap(g => g.words);

        UIRenderer.updateWordCountBadge();
        UIRenderer.renderStudyView();
        UIRenderer.switchTab("studyTab");
        showToast(`📖 已載入「${session.date} - ${session.title}」`);
      },

      exportJSON() {
        const sessions = this.getAllSessions();
        if (sessions.length === 0) {
          showToast("⚠️ 目前沒有任何存檔可供匯出");
          return;
        }
        const blob = new Blob([JSON.stringify(sessions, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const today = new Date().toISOString().split("T")[0];
        a.href = url;
        a.download = `LexiStory_Backup_${today}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast("📤 已匯出 JSON 備份檔！");
      },

      importJSON(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (!Array.isArray(imported)) throw new Error("Invalid format");
            const current = this.getAllSessions();
            const merged = [...imported, ...current];
            // 依據 id 去重
            const unique = Array.from(new Map(merged.map(item => [item.id, item])).values());
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(unique));
            UIRenderer.renderHistoryList();
            showToast(`📥 成功匯入 ${imported.length} 筆學習紀錄！`);
          } catch (err) {
            showToast("❌ 匯入失敗：檔案格式不正確");
          }
        };
        reader.readAsText(file);
      }
    };

    /**
     * ============================================================================
     * MODULE 8: QUIZ ENGINE (三種互動測驗模式：語境克漏字、搭配詞挑戰、聽力辨識)
     * ============================================================================
     */
    const QuizEngine = {
      start(scope = "currentGroup", mode = "contextCloze", customWordPool = null) {
        let pool = [];
        if (customWordPool && customWordPool.length > 0) {
          pool = customWordPool;
        } else if (scope === "allCurrent") {
          pool = AppState.groups.flatMap(g => g.words);
        } else {
          const activeGroup = AppState.groups[AppState.activeGroupIndex];
          pool = activeGroup ? activeGroup.words : AppState.masterWords.slice(0, 10);
        }

        if (pool.length < 2) {
          showToast("⚠️ 測驗單字數量太少，請至少選擇 2 個以上的單字！");
          return;
        }

        // 打散出題順序
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        const allPossibleDistractors = AppState.masterWords.length >= 4 ? AppState.masterWords : pool;

        const questions = shuffled.map(target => {
          // 產生 3 個干擾選項
          const distractors = allPossibleDistractors
            .filter(w => w.word.toLowerCase() !== target.word.toLowerCase())
            .sort(() => Math.random() - 0.5)
            .slice(0, 3);

          const options = [target, ...distractors].sort(() => Math.random() - 0.5);

          // 製作克漏字題幹（挖空目標單字）
          const escaped = target.word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const regex = new RegExp(`\\b${escaped}(?:s|es|ed|d|ing|ly)?\\b`, "gi");
          const maskedIllustrative = (target.illustrative || "").replace(regex, "________");
          const maskedCollocation = (target.collocation || "").replace(regex, "________");

          return {
            target,
            options,
            maskedIllustrative: maskedIllustrative.includes("____") ? maskedIllustrative : `(${target.zh}) ________`,
            maskedCollocation: maskedCollocation.includes("____") ? maskedCollocation : `(${target.zh}) ________`
          };
        });

        AppState.quiz = {
          questions,
          currentIndex: 0,
          score: 0,
          wrongItems: [],
          mode
        };

        const arena = document.getElementById("quizArena");
        arena.classList.remove("hidden");
        this.renderQuestion();
      },

      renderQuestion() {
        const arena = document.getElementById("quizArena");
        const { questions, currentIndex, mode } = AppState.quiz;

        if (currentIndex >= questions.length) {
          this.renderSummary();
          return;
        }

        const q = questions[currentIndex];
        const progressText = `第 ${currentIndex + 1} / ${questions.length} 題`;

        let promptHTML = "";
        if (mode === "contextCloze") {
          promptHTML = `
            <div style="font-size:0.88rem; color:var(--brand-primary); font-weight:700; margin-bottom:0.4rem;">
              【語境推斷克漏字】請根據上下文線索選出最適合填入空格的單字：
            </div>
            <div style="font-size:1.18rem; font-weight:600; background:var(--bg-surface-alt); padding:1rem; border-radius:var(--radius-md); margin-bottom:0.5rem;">
              ${escapeHTML(q.maskedIllustrative)}
            </div>
            <div style="font-size:0.92rem; color:var(--text-secondary);">
              💡 中文提示：${escapeHTML(q.target.zh)} (${escapeHTML(q.target.pos)})
            </div>
          `;
        } else if (mode === "collocationMatch") {
          promptHTML = `
            <div style="font-size:0.88rem; color:var(--brand-accent); font-weight:700; margin-bottom:0.4rem;">
              【高頻搭配詞挑戰】請選出能與下列短句自然搭配的單字（或直接輸入拼寫）：
            </div>
            <div style="font-size:1.2rem; font-weight:700; background:var(--bg-surface-alt); padding:1rem; border-radius:var(--radius-md); margin-bottom:0.75rem;">
              ${escapeHTML(q.maskedCollocation)}
            </div>
            <div style="font-size:0.95rem; margin-bottom:0.85rem;">
              中文釋義：<strong>${escapeHTML(q.target.zh)}</strong> <span style="color:var(--text-muted);">(${escapeHTML(q.target.pos)})</span>
            </div>
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
              <input type="text" id="spellingInput" class="form-control" placeholder="進階挑戰：直接輸入英文單字拼寫..." autocomplete="off" />
              <button id="submitSpellingBtn" class="btn btn-accent">送出拼寫</button>
            </div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.4rem;">或從下方四個選項中點選：</div>
          `;
        } else if (mode === "listening") {
          promptHTML = `
            <div style="font-size:0.88rem; color:var(--brand-primary); font-weight:700; margin-bottom:0.5rem;">
              【聽力辨識測驗】點擊播放語音，選出你聽到的單字與釋義：
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:0.65rem; background:var(--bg-surface-alt); padding:1rem; border-radius:var(--radius-md); margin-bottom:0.75rem;">
              <button id="playQuizWordBtn" class="btn btn-primary">🔊 聽單字發音</button>
              <button id="playQuizCollocBtn" class="btn btn-secondary">🔊 聽搭配詞短句</button>
            </div>
          `;
        }

        const optionsHTML = q.options.map((opt, idx) => {
          const label = mode === "listening"
            ? `${escapeHTML(opt.word)} — ${escapeHTML(opt.zh)}`
            : `${escapeHTML(opt.word)} (${escapeHTML(opt.pos)})`;
          return `
            <button class="quiz-option" data-word="${escapeHTML(opt.word)}">
              <span style="display:inline-flex; align-items:center; justify-content:center; width:1.75rem; height:1.75rem; border-radius:50%; background:var(--bg-surface-alt); font-size:0.85rem;">
                ${String.fromCharCode(65 + idx)}
              </span>
              <span>${label}</span>
            </button>
          `;
        }).join("");

        arena.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.85rem;">
            <span class="brand-badge">${progressText}</span>
            <span style="font-weight:700; color:var(--brand-primary);">目前得分：${AppState.quiz.score}</span>
          </div>
          ${promptHTML}
          <div id="quizOptionsBox" style="margin-top:0.75rem;">
            ${optionsHTML}
          </div>
          <div id="quizFeedbackBox" class="hidden" style="margin-top:1rem; padding:1rem; border-radius:var(--radius-md); background:var(--bg-surface-alt);"></div>
        `;

        // 若為聽力模式，自動播放一次單字並綁定按鈕
        if (mode === "listening") {
          setTimeout(() => SpeechController.speak(q.target.word), 200);
          document.getElementById("playQuizWordBtn").addEventListener("click", (e) => {
            SpeechController.speak(q.target.word, e.currentTarget);
          });
          document.getElementById("playQuizCollocBtn").addEventListener("click", (e) => {
            SpeechController.speak(q.target.collocation, e.currentTarget);
          });
        }

        // 綁定拼寫送出事件
        const spellingBtn = document.getElementById("submitSpellingBtn");
        const spellingInput = document.getElementById("spellingInput");
        if (spellingBtn && spellingInput) {
          const checkSpelling = () => {
            const val = spellingInput.value.trim();
            if (!val) return;
            this.handleAnswer(val);
          };
          spellingBtn.addEventListener("click", checkSpelling);
          spellingInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") checkSpelling();
          });
        }

        // 綁定選擇題按鈕事件
        arena.querySelectorAll(".quiz-option").forEach(btn => {
          btn.addEventListener("click", () => {
            this.handleAnswer(btn.dataset.word);
          });
        });
      },

      handleAnswer(submittedWord) {
        const q = AppState.quiz.questions[AppState.quiz.currentIndex];
        const isCorrect = submittedWord.trim().toLowerCase() === q.target.word.trim().toLowerCase();

        if (isCorrect) {
          AppState.quiz.score += 1;
        } else {
          AppState.quiz.wrongItems.push(q.target);
        }

        // 標示選項對錯狀態
        document.querySelectorAll(".quiz-option").forEach(btn => {
          btn.disabled = true;
          const btnWord = btn.dataset.word.toLowerCase();
          if (btnWord === q.target.word.toLowerCase()) {
            btn.classList.add("correct");
          } else if (btnWord === submittedWord.trim().toLowerCase() && !isCorrect) {
            btn.classList.add("wrong");
          }
        });

        const spInput = document.getElementById("spellingInput");
        const spBtn = document.getElementById("submitSpellingBtn");
        if (spInput) spInput.disabled = true;
        if (spBtn) spBtn.disabled = true;

        // 播放正確單字發音加強記憶
        SpeechController.speak(q.target.word);

        const feedbackBox = document.getElementById("quizFeedbackBox");
        feedbackBox.classList.remove("hidden");
        feedbackBox.innerHTML = `
          <div style="font-weight:700; font-size:1.05rem; color:${isCorrect ? "var(--status-success)" : "var(--status-error)"}; margin-bottom:0.4rem;">
            ${isCorrect ? "✅ 答對了！太棒了！" : `❌ 答錯囉！正確答案是：${escapeHTML(q.target.word)}`}
          </div>
          <div style="font-size:0.95rem; margin-bottom:0.35rem;">
            <strong>${escapeHTML(q.target.word)}</strong> (${escapeHTML(q.target.pos)}) — ${escapeHTML(q.target.zh)}
          </div>
          <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.25rem;">
            • <strong>語境示範句：</strong>${escapeHTML(q.target.illustrative)}
          </div>
          <div style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:0.85rem;">
            • <strong>高頻搭配詞：</strong>${escapeHTML(q.target.collocation)}
          </div>
          <button id="nextQuestionBtn" class="btn btn-primary">
            ${AppState.quiz.currentIndex + 1 < AppState.quiz.questions.length ? "下一題 ➡️" : "查看測驗成績 📊"}
          </button>
        `;

        document.getElementById("nextQuestionBtn").addEventListener("click", () => {
          AppState.quiz.currentIndex += 1;
          this.renderQuestion();
        });
      },

      renderSummary() {
        const arena = document.getElementById("quizArena");
        const { questions, score, wrongItems, mode } = AppState.quiz;
        const accuracy = Math.round((score / questions.length) * 100);

        const wrongListHTML = wrongItems.length === 0
          ? `<p style="color:var(--status-success); font-weight:700;">🎉 完美全對！沒有任何錯題！</p>`
          : `
            <div style="margin-top:0.75rem;">
              <h4 style="margin-bottom:0.5rem;">📌 需要加強複習的錯題 (${wrongItems.length} 字)：</h4>
              <ul style="list-style:none; display:flex; flex-direction:column; gap:0.5rem;">
                ${wrongItems.map(item => `
                  <li style="background:var(--bg-surface-alt); padding:0.65rem 0.85rem; border-radius:var(--radius-md); display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
                    <div>
                      <strong>${escapeHTML(item.word)}</strong> (${escapeHTML(item.pos)}) — ${escapeHTML(item.zh)}
                      <div style="font-size:0.85rem; color:var(--text-secondary);">${escapeHTML(item.collocation)}</div>
                    </div>
                    <button class="speak-btn" onclick="SpeechController.speak('${escapeHTML(item.word).replace(/'/g, "\\'")}', this)">🔊</button>
                  </li>
                `).join("")}
              </ul>
            </div>
          `;

        arena.innerHTML = `
          <div style="text-align:center; padding:1rem 0;">
            <div style="font-size:2.5rem; margin-bottom:0.25rem;">🏆</div>
            <h3 style="font-size:1.4rem; margin-bottom:0.35rem;">測驗完成！</h3>
            <p style="font-size:1.15rem; font-weight:700; color:var(--brand-primary);">
              答對題數：${score} / ${questions.length}（正確率 ${accuracy}%）
            </p>
          </div>
          ${wrongListHTML}
          <div style="display:flex; flex-wrap:wrap; gap:0.65rem; margin-top:1.25rem;">
            ${wrongItems.length > 0 ? `<button id="retryWrongBtn" class="btn btn-accent">🔁 只針對這 ${wrongItems.length} 個錯題重測</button>` : ""}
            <button id="restartQuizBtn" class="btn btn-primary">🔄 重新測驗本組全部單字</button>
          </div>
        `;

        if (wrongItems.length > 0) {
          document.getElementById("retryWrongBtn").addEventListener("click", () => {
            this.start("custom", mode, wrongItems);
          });
        }
        document.getElementById("restartQuizBtn").addEventListener("click", () => {
          this.start(document.getElementById("quizScopeSelect").value, mode);
        });
      }
    };

    /**
     * ============================================================================
     * MODULE 9: UI RENDERER (畫面渲染與互動事件綁定)
     * ============================================================================
     */
    const UIRenderer = {
      switchTab(tabId) {
        SpeechController.stop();
        document.querySelectorAll(".nav-tab").forEach(btn => {
          btn.classList.toggle("active", btn.dataset.tab === tabId);
        });
        document.querySelectorAll(".tab-panel").forEach(panel => {
          panel.classList.toggle("active", panel.id === tabId);
        });
      },

      updateWordCountBadge() {
        const badge = document.getElementById("totalWordCountBadge");
        if (badge) {
          badge.textContent = `目前單字庫：${AppState.masterWords.length} 字`;
        }
      },

      renderStudyView() {
        const pillsBox = document.getElementById("groupPillsContainer");
        const contentBox = document.getElementById("studyContentContainer");

        if (!AppState.groups || AppState.groups.length === 0) {
          pillsBox.innerHTML = "";
          contentBox.innerHTML = `
            <div class="card" style="text-align:center; padding:2.5rem 1rem;">
              <p style="font-size:1.1rem; margin-bottom:1rem;">尚未產生單字分組，請先在「單字與分組」頁面設定並產生學習內容！</p>
              <button class="btn btn-primary" onclick="UIRenderer.switchTab('setupTab')">前往設定分組</button>
            </div>
          `;
          return;
        }

        // 渲染組別切換膠囊按鈕
        pillsBox.innerHTML = AppState.groups.map((grp, idx) => `
          <button class="group-pill ${idx === AppState.activeGroupIndex ? "active" : ""}" data-group-idx="${idx}">
            第 ${idx + 1} 組 (${grp.words.length}字)
          </button>
        `).join("");

        pillsBox.querySelectorAll(".group-pill").forEach(btn => {
          btn.addEventListener("click", () => {
            SpeechController.stop();
            AppState.activeGroupIndex = parseInt(btn.dataset.groupIdx, 10);
            this.renderStudyView();
          });
        });

        const currentGroup = AppState.groups[AppState.activeGroupIndex];

        // 將故事切分成句子，方便逐句點擊與高亮朗讀
        const rawSentences = currentGroup.story
          .match(/[^.!?]+[.!?]+(?:\s|$)|[^.!?]+$/g) || [currentGroup.story];

        const formattedSentencesHTML = rawSentences.map(sentence => {
          const highlighted = highlightTargetWords(sentence.trim(), currentGroup.words);
          return `<span class="story-sentence" title="點擊朗讀此句">${highlighted}</span> `;
        }).join("");

        // 渲染故事區塊 + 單字雙軌例句卡片
        contentBox.innerHTML = `
          <!-- 連貫情境短篇故事區 -->
          <div class="story-box">
            <div style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.5rem;">
              <div>
                <span class="brand-badge">情境連貫故事</span>
                <h3 style="font-size:1.18rem; margin-top:0.25rem;">第 ${AppState.activeGroupIndex + 1} 組短篇故事（點擊單句可單獨發音）</h3>
              </div>
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button id="readFullStoryBtn" class="speak-btn">🔊 整篇故事逐句朗讀</button>
                <button id="toggleStoryZhBtn" class="btn btn-secondary btn-sm">👁️ 顯示/隱藏中文大意</button>
              </div>
            </div>

            <div id="storyTextContainer" class="story-text">
              ${formattedSentencesHTML}
            </div>

            <div id="storyZhContainer" class="hidden" style="margin-top:0.85rem; padding-top:0.75rem; border-top:1px dashed var(--border-strong); color:var(--text-secondary); font-size:0.95rem;">
              <strong>📖 中文翻譯：</strong>${escapeHTML(currentGroup.storyZh || "（無中文翻譯）")}
            </div>
          </div>

          <!-- 單字與雙軌例句卡片列表 -->
          <div class="vocab-list">
            ${currentGroup.words.map((item, wIdx) => `
              <article class="vocab-card">
                <div>
                  <div class="vocab-header">
                    <div>
                      <span style="font-size:0.82rem; color:var(--text-muted); margin-right:0.35rem;">#${wIdx + 1}</span>
                      <span class="vocab-word">${escapeHTML(item.word)}</span>
                      <span class="vocab-pos">${escapeHTML(item.pos)}</span>
                    </div>
                    <button class="speak-btn" data-speak="${escapeHTML(item.word)}">🔊 單字</button>
                  </div>
                  <div class="vocab-zh" style="margin-top:0.45rem;">${escapeHTML(item.zh)}</div>
                </div>

                <div style="display:flex; flex-direction:column; gap:0.6rem;">
                  <!-- 1. 簡化版語境示範句 -->
                  <div class="sentence-block">
                    <div>
                      <span class="sentence-label label-illus">1. 語境示範句 (Illustrative)</span>
                      <div style="font-size:0.98rem;">${highlightTargetWords(item.illustrative, [item])}</div>
                    </div>
                    <button class="speak-btn" data-speak="${escapeHTML(item.illustrative)}">🔊</button>
                  </div>

                  <!-- 2. 10字內高頻搭配詞短句 -->
                  <div class="sentence-block">
                    <div>
                      <span class="sentence-label label-colloc">2. 高頻搭配詞短句 (Collocation)</span>
                      <div style="font-size:0.98rem;">${highlightTargetWords(item.collocation, [item])}</div>
                    </div>
                    <button class="speak-btn" data-speak="${escapeHTML(item.collocation)}">🔊</button>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>
        `;

        // 綁定所有卡片內的發音按鈕
        contentBox.querySelectorAll(".speak-btn[data-speak]").forEach(btn => {
          btn.addEventListener("click", () => {
            SpeechController.speak(btn.dataset.speak, btn);
          });
        });

        // 綁定整篇故事逐句朗讀
        const readFullStoryBtn = document.getElementById("readFullStoryBtn");
        const sentenceEls = Array.from(contentBox.querySelectorAll(".story-sentence"));
        readFullStoryBtn.addEventListener("click", () => {
          SpeechController.speakStorySentences(sentenceEls, readFullStoryBtn);
        });

        // 綁定故事單句點擊發音
        sentenceEls.forEach(el => {
          el.addEventListener("click", () => {
            document.querySelectorAll(".story-sentence.active-reading").forEach(s => s.classList.remove("active-reading"));
            el.classList.add("active-reading");
            SpeechController.speak(el.textContent, null, () => el.classList.remove("active-reading"));
          });
        });

        // 綁定中文翻譯顯示切換
        document.getElementById("toggleStoryZhBtn").addEventListener("click", () => {
          document.getElementById("storyZhContainer").classList.toggle("hidden");
        });
      },

      renderHistoryList() {
        const container = document.getElementById("historyListContainer");
        const sessions = StorageManager.getAllSessions();

        if (sessions.length === 0) {
          container.innerHTML = `
            <div style="text-align:center; padding:2rem; color:var(--text-muted); background:var(--bg-surface-alt); border-radius:var(--radius-md);">
              尚無任何儲存紀錄。在「故事與例句學習」頁面點擊「💾 儲存本次學習紀錄」，即可按日期保存進度！
            </div>
          `;
          return;
        }

        container.innerHTML = `
          <div style="display:flex; flex-direction:column; gap:0.75rem;">
            ${sessions.map(sec => `
              <div style="border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.75rem; background:var(--bg-surface);">
                <div>
                  <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                    <span class="brand-badge">📅 ${escapeHTML(sec.date)}</span>
                    <strong style="font-size:1.05rem;">${escapeHTML(sec.title)}</strong>
                  </div>
                  <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">
                    建立時間：${escapeHTML(sec.timestamp)} ｜ 共 ${sec.groups.length} 組（${sec.totalWords} 個單字）
                  </div>
                </div>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                  <button class="btn btn-primary btn-sm" onclick="StorageManager.loadSession('${sec.id}')">📖 載入複習</button>
                  <button class="btn btn-accent btn-sm" onclick="StorageManager.loadSession('${sec.id}'); UIRenderer.switchTab('quizTab');">🎯 開始測驗</button>
                  <button class="btn btn-danger btn-sm" onclick="StorageManager.deleteSession('${sec.id}')">🗑️ 刪除</button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }
    };

    /**
     * ============================================================================
     * MODULE 10: APPLICATION CONTROLLER & INITIALIZATION
     * ============================================================================
     */
    async function executeGroupingAndGenerate() {
      const btn = document.getElementById("generateGroupsBtn");
      const orderMode = document.getElementById("orderMode").value;
      const groupSize = parseInt(document.getElementById("groupSizeInput").value, 10) || 10;
      const genMode = document.getElementById("generationMode").value;

      if (AppState.masterWords.length === 0) {
        showToast("⚠️ 目前單字庫是空的，請先輸入單字或還原預設字庫！");
        return;
      }

      const chunks = WordProcessor.chunkWords(AppState.masterWords, orderMode, groupSize);
      btn.disabled = true;
      const originalBtnHTML = btn.innerHTML;

      try {
        const generatedGroups = [];

        for (let i = 0; i < chunks.length; i++) {
          const chunk = chunks[i];
          btn.innerHTML = `<span class="loader-spinner"></span> 正在處理第 ${i + 1} / ${chunks.length} 組...`;

          const needsEnrichment = chunk.some(w => !w.illustrative || !w.collocation || !w.zh);

          if (genMode === "smart" || needsEnrichment) {
            try {
              const aiData = await AIService.enrichGroupWithAI(chunk);
              generatedGroups.push({
                groupIndex: i,
                title: `第 ${i + 1} 組`,
                words: aiData.words,
                story: aiData.story,
                storyZh: aiData.storyZh
              });
            } catch (aiErr) {
              // 若無網路或 API 暫時無法連線，自動無縫切換至離線備援故事，確保體驗不中斷
              const fallback = AIService.generateFallbackStory(chunk);
              generatedGroups.push({
                groupIndex: i,
                title: `第 ${i + 1} 組`,
                words: chunk.map(w => ({
                  word: w.word,
                  pos: w.pos || "vocab.",
                  zh: w.zh || "（請補充釋義）",
                  illustrative: w.illustrative || `We learned how to use the word "${w.word}" in a clear sentence today.`,
                  collocation: w.collocation || `Practice using "${w.word}" every day.`
                })),
                story: fallback.story,
                storyZh: fallback.storyZh
              });
            }
          } else {
            const fallback = AIService.generateFallbackStory(chunk);
            generatedGroups.push({
              groupIndex: i,
              title: `第 ${i + 1} 組`,
              words: chunk,
              story: fallback.story,
              storyZh: fallback.storyZh
            });
          }
        }

        AppState.groups = generatedGroups;
        AppState.activeGroupIndex = 0;

        UIRenderer.renderStudyView();
        UIRenderer.switchTab("studyTab");
        showToast(`✨ 已完成分組！共分為 ${generatedGroups.length} 組`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalBtnHTML;
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      SpeechController.init();

      // 1. 字級四段式調整
      document.querySelectorAll("[data-scale]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-scale]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.documentElement.style.setProperty("--font-scale", btn.dataset.scale);
        });
      });

      // 2. 三種護眼主題切換
      document.querySelectorAll("[data-theme-btn]").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll("[data-theme-btn]").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          document.documentElement.setAttribute("data-theme", btn.dataset.themeBtn);
        });
      });

      // 3. 語速控制滑桿與快捷按鈕
      const rateSlider = document.getElementById("rateSlider");
      const rateLabel = document.getElementById("rateValueLabel");
      const updateRate = (newRate) => {
        const val = Math.min(1.5, Math.max(0.5, parseFloat(newRate)));
        AppState.speechRate = val;
        rateSlider.value = val;
        rateLabel.textContent = `${val.toFixed(2)}x`;
        document.querySelectorAll(".speed-preset").forEach(btn => {
          btn.classList.toggle("active", Math.abs(parseFloat(btn.dataset.rate) - val) < 0.03);
        });
      };

      rateSlider.addEventListener("input", (e) => updateRate(e.target.value));
      document.querySelectorAll(".speed-preset").forEach(btn => {
        btn.addEventListener("click", () => updateRate(btn.dataset.rate));
      });

      document.getElementById("voiceSelect").addEventListener("change", (e) => {
        AppState.selectedVoiceURI = e.target.value;
      });

      document.getElementById("stopSpeechBtn").addEventListener("click", () => {
        SpeechController.stop();
      });

      // 4. 分頁切換
      document.querySelectorAll(".nav-tab").forEach(tab => {
        tab.addEventListener("click", () => {
          UIRenderer.switchTab(tab.dataset.tab);
          if (tab.dataset.tab === "historyTab") {
            UIRenderer.renderHistoryList();
          }
        });
      });

      // 5. 分組與生成按鈕
      document.getElementById("generateGroupsBtn").addEventListener("click", executeGroupingAndGenerate);

      document.getElementById("resetDefaultWordsBtn").addEventListener("click", () => {
        AppState.masterWords = JSON.parse(JSON.stringify(DEFAULT_B2_WORDS));
        UIRenderer.updateWordCountBadge();
        showToast("🔄 已還原內建 50 個 B2 單字庫！");
      });

      // 6. 自訂單字匯入按鈕
      document.getElementById("replaceWithCustomBtn").addEventListener("click", () => {
        const raw = document.getElementById("customWordsInput").value;
        const parsed = WordProcessor.parseCustomInput(raw);
        if (parsed.length === 0) {
          showToast("⚠️ 請先在輸入框中貼上單字或片語！");
          return;
        }
        AppState.masterWords = parsed;
        UIRenderer.updateWordCountBadge();
        executeGroupingAndGenerate();
      });

      document.getElementById("appendCustomBtn").addEventListener("click", () => {
        const raw = document.getElementById("customWordsInput").value;
        const parsed = WordProcessor.parseCustomInput(raw);
        if (parsed.length === 0) {
          showToast("⚠️ 請先在輸入框中貼上單字或片語！");
          return;
        }
        AppState.masterWords = [...AppState.masterWords, ...parsed];
        UIRenderer.updateWordCountBadge();
        document.getElementById("customWordsInput").value = "";
        showToast(`➕ 已將 ${parsed.length} 個新單字加入字庫（目前共 ${AppState.masterWords.length} 字）`);
      });

      // 7. 存檔與歷史紀錄按鈕
      document.getElementById("saveSessionBtn").addEventListener("click", () => {
        const title = document.getElementById("saveTitleInput").value;
        StorageManager.saveSession(title);
      });

      document.getElementById("exportBackupBtn").addEventListener("click", () => {
        StorageManager.exportJSON();
      });

      document.getElementById("importBackupInput").addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          StorageManager.importJSON(e.target.files[0]);
          e.target.value = "";
        }
      });

      // 8. 測驗啟動按鈕
      document.getElementById("goQuizFromStudyBtn").addEventListener("click", () => {
        UIRenderer.switchTab("quizTab");
        document.getElementById("quizScopeSelect").value = "currentGroup";
        QuizEngine.start("currentGroup", document.getElementById("quizTypeSelect").value);
      });

      document.getElementById("startQuizBtn").addEventListener("click", () => {
        const scope = document.getElementById("quizScopeSelect").value;
        const mode = document.getElementById("quizTypeSelect").value;
        QuizEngine.start(scope, mode);
      });

      // 初始預載：自動將 50 個單字依預設（10字一組）分好組別，方便一打開就能直接預覽或重新生成
      const initialChunks = WordProcessor.chunkWords(AppState.masterWords, "sequential", 10);
      AppState.groups = initialChunks.map((chunk, idx) => {
        const fallback = AIService.generateFallbackStory(chunk);
        return {
          groupIndex: idx,
          title: `第 ${idx + 1} 組`,
          words: chunk,
          story: fallback.story,
          storyZh: fallback.storyZh
        };
      });
      UIRenderer.updateWordCountBadge();
      UIRenderer.renderStudyView();
      UIRenderer.renderHistoryList();
    });
  </script>
</body>
</html>
