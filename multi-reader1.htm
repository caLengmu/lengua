<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Multilingual Text Reader & Recorder</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f1f8fc;
    color: #444;
    margin: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
    padding: 28px 24px;
    text-align: center;
  }

  /* ---------- view switching ---------- */
  .view { display: none; }
  .view.active { display: block; }

  h1 {
    color: #2a628f;
    margin: 0 0 6px;
    font-size: 1.6rem;
    line-height: 1.3;
  }

  h2 {
    color: #2a628f;
    margin: 0 0 16px;
    font-size: 1.2rem;
  }

  .flags { margin-bottom: 18px; }
  .flags img { width: 34px; max-width: 16vw; margin: 0 4px; }

  textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    outline: none;
    font-family: inherit;
    text-align: left;
    resize: vertical;
    background: #fbfdff;
  }

  #home-textarea {
    height: 130px;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(15, 76, 129, 0.06);
  }
  #home-textarea:focus { border-color: #6fb3e0; }

  #reader-textarea { height: 110px; }

  .btn-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .btn-row + .btn-row { margin-top: 12px; }

  select, button {
    font-size: 15px;
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    background-color: #0f4c81;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease;
    flex: 1 1 auto;
    min-width: 100px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  select:hover, button:hover { background-color: #083a63; }
  button:active { background-color: #062c4c; }
  button:disabled { background-color: #c5dfee; cursor: not-allowed; }

  button.secondary {
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  button.secondary:hover { background-color: #dcebf5; }

  select { padding: 11px 12px; }

  /* ---------- playback screen ---------- */
  .playback-display {
    text-align: left;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    padding: 20px;
    margin: 4px 0 6px;
    min-height: 140px;
    background: #fbfdff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .playback-display .line {
    font-size: 21px;
    line-height: 1.8;
    word-break: break-word;
  }

  .playback-display .line.next-line {
    opacity: 0.4;
    font-size: 19px;
  }

  .playback-display .word {
    border-radius: 4px;
    padding: 1px 2px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .playback-display .word.active-word {
    background: #ffd166;
    color: #222;
  }

  .nav-row, .record-row { display: none; }
  .nav-row.visible, .record-row.visible { display: flex; }

  .record-row { margin-top: 12px; }

  /* Anki-style record button: red pulse while capturing audio */
  #btn-record-toggle.recording {
    background-color: #d64545;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(214, 69, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0); }
  }

  .record-status {
    font-size: 13px;
    color: #d64545;
    margin: 6px 0 0;
    min-height: 16px;
    font-weight: 600;
  }

  .hint {
    font-size: 12px;
    color: #9db6c6;
    margin-top: 8px;
  }

  @media (max-width: 400px) {
    body { padding: 8px; }
    .app { padding: 18px 14px; border-radius: 12px; }
    h1 { font-size: 1.3rem; }
    .flags img { width: 28px; }
    select, button { font-size: 14px; padding: 10px; min-width: 84px; }
    .playback-display .line { font-size: 18px; }
    .playback-display .line.next-line { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div id="home-view" class="view active">
    <h1>Multilingual Text Reader & Recorder</h1>
    <div class="flags">
      <img src="https://flagcdn.com/w320/jp.png" alt="Japan Flag">
      <img src="https://flagcdn.com/w320/kr.png" alt="Korea Flag">
      <img src="https://flagcdn.com/w320/es.png" alt="Spain Flag">
      <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
    </div>
    <textarea id="home-textarea" placeholder="Type or paste text here..."></textarea>
    <div class="btn-row">
      <button id="btn-paste" class="secondary">Paste Text</button>
      <button id="btn-clear" class="secondary">Clear Text</button>
      <button id="btn-activate-reader">Activate Reader</button>
      <button id="btn-activate-recorder">Activate Recorder</button>
    </div>
  </div>

  <!-- ============ READER SETUP ============ -->
  <div id="reader-setup-view" class="view">
    <h2>Reader Setup</h2>
    <textarea id="reader-textarea" placeholder="Text to be read aloud..."></textarea>
    <div class="btn-row">
      <select id="reader-language">
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
        <option value="en-US">English</option>
      </select>
      <select id="reader-speed">
        <option value="1">1x</option>
        <option value="0.85">0.85x</option>
        <option value="0.7">0.7x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
    <div class="btn-row">
      <button id="btn-read-aloud">Read Aloud</button>
      <button id="btn-reader-close" class="secondary">Close</button>
    </div>
  </div>

  <!-- ============ PLAYBACK ============ -->
  <div id="playback-view" class="view">
    <h2>Now Reading</h2>
    <div id="playback-display" class="playback-display"></div>

    <div class="btn-row">
      <button id="btn-pause-resume">Pause</button>
      <button id="btn-stop" class="secondary">Stop</button>
      <button id="btn-playback-close" class="secondary">Close</button>
    </div>

    <div id="nav-row" class="btn-row nav-row">
      <button id="btn-prev" class="secondary">Previous</button>
      <button id="btn-next" class="secondary">Next</button>
    </div>

    <!-- Real audio recording (MediaRecorder), Anki-card style: record your own
         voice reading the current sentence, then play it back or re-record. -->
    <div id="record-row" class="btn-row record-row">
      <button id="btn-record-toggle">🎙 Record</button>
      <button id="btn-play-my-recording" class="secondary" disabled>▶ Play Mine</button>
      <button id="btn-delete-recording" class="secondary" disabled>🗑 Delete</button>
    </div>
    <div id="volume-row" class="btn-row record-row">
      <select id="playback-gain" title="Boost how loud your recording plays back">
        <option value="1">🔊 1x</option>
        <option value="2" selected>🔊 2x</option>
        <option value="3">🔊 3x</option>
        <option value="4">🔊 4x</option>
      </select>
    </div>
    <div id="record-status" class="record-status"></div>

    <div class="hint">Previous / Next / Record appear while paused or stopped</div>
    <audio id="my-recording-audio" style="display:none"></audio>
  </div>

  <!-- ============ RECORDER ============ -->
  <div id="recorder-view" class="view">
    <h2>Recorder</h2>
    <div class="btn-row">
      <select id="recorder-language">
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <textarea id="recognized-text" placeholder="Recognized speech will appear here..." readonly style="height:80px;"></textarea>
    <div class="btn-row">
      <button id="btn-record">Record</button>
      <button id="btn-play-recording" disabled>Play Recording</button>
    </div>
    <div class="btn-row">
      <button id="btn-recorder-close" class="secondary">Close</button>
    </div>
  </div>

</div>

<script>
  // ---------------------------------------------------------------
  // View switching
  // ---------------------------------------------------------------
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------------------------------------------------------------
  // Element references
  // ---------------------------------------------------------------
  const homeTextarea = document.getElementById('home-textarea');
  const btnPaste = document.getElementById('btn-paste');
  const btnClear = document.getElementById('btn-clear');
  const btnActivateReader = document.getElementById('btn-activate-reader');
  const btnActivateRecorder = document.getElementById('btn-activate-recorder');

  const readerTextarea = document.getElementById('reader-textarea');
  const readerLanguage = document.getElementById('reader-language');
  const readerSpeed = document.getElementById('reader-speed');
  const btnReadAloud = document.getElementById('btn-read-aloud');
  const btnReaderClose = document.getElementById('btn-reader-close');

  const playbackDisplay = document.getElementById('playback-display');
  const btnPauseResume = document.getElementById('btn-pause-resume');
  const btnStop = document.getElementById('btn-stop');
  const btnPlaybackClose = document.getElementById('btn-playback-close');
  const navRow = document.getElementById('nav-row');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  const recordRow = document.getElementById('record-row');
  const btnRecordToggle = document.getElementById('btn-record-toggle');
  const btnPlayMyRecording = document.getElementById('btn-play-my-recording');
  const btnDeleteRecording = document.getElementById('btn-delete-recording');
  const recordStatus = document.getElementById('record-status');
  const myRecordingAudio = document.getElementById('my-recording-audio');
  const volumeRow = document.getElementById('volume-row');
  const playbackGainSelect = document.getElementById('playback-gain');

  const recorderLanguage = document.getElementById('recorder-language');
  const recognizedText = document.getElementById('recognized-text');
  const btnRecord = document.getElementById('btn-record');
  const btnPlayRecording = document.getElementById('btn-play-recording');
  const btnRecorderClose = document.getElementById('btn-recorder-close');

  const synth = window.speechSynthesis;
  let utterance;
  let recognition;
  let recordedAudio = null;

  // ---------------------------------------------------------------
  // Home screen: paste / clear / navigate
  // ---------------------------------------------------------------
  function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? textarea.value.length;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    const pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
  }

  btnPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) insertAtCursor(homeTextarea, text);
    } catch (err) {
      alert('Could not read the clipboard automatically. Please paste manually (Ctrl/Cmd+V), or long-press the text box and choose Paste.');
    }
  });

  btnClear.addEventListener('click', () => {
    homeTextarea.value = '';
    homeTextarea.focus();
  });

  btnActivateReader.addEventListener('click', () => {
    const text = homeTextarea.value.trim();
    if (!text) { alert('Please enter or paste some text first!'); return; }
    readerTextarea.value = homeTextarea.value;
    showView('reader-setup-view');
  });

  btnActivateRecorder.addEventListener('click', () => {
    recognizedText.value = '';
    recordedAudio = null;
    btnPlayRecording.disabled = true;
    showView('recorder-view');
  });

  btnReaderClose.addEventListener('click', () => showView('home-view'));
  btnRecorderClose.addEventListener('click', () => showView('home-view'));

  // ---------------------------------------------------------------
  // Sentence / word segmentation (locale-aware; Intl.Segmenter
  // handles Japanese/Korean correctly, where words aren't
  // separated by spaces)
  // ---------------------------------------------------------------
  function segmentSentences(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'sentence' });
        return Array.from(seg.segment(text), s => s.segment).filter(s => s.trim().length);
      } catch (e) { /* fall through */ }
    }
    return text.split(/(?<=[.!?。！？\n])\s*/).filter(s => s.trim().length);
  }

  function segmentWords(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'word' });
        let offset = 0;
        return Array.from(seg.segment(text), s => {
          const item = { text: s.segment, isWordLike: s.isWordLike, start: offset };
          offset += s.segment.length;
          return item;
        });
      } catch (e) { /* fall through */ }
    }
    let offset = 0;
    return text.split(/(\s+)/).filter(Boolean).map(s => {
      const item = { text: s, isWordLike: !/^\s+$/.test(s), start: offset };
      offset += s.length;
      return item;
    });
  }

  // ---------------------------------------------------------------
  // Playback: one sentence at a time as a queue, so Pause remembers
  // exactly where we were (sentence + char offset, refined to the
  // word where onboundary fires) and Resume picks up right there
  // instead of restarting. The display window always shows the
  // sentence currently being spoken plus the next one coming up.
  // ---------------------------------------------------------------

  let sentences = [];
  let currentSentenceIndex = 0;
  let currentOffsetInSentence = 0;
  let isPlaying = false;

  function renderPlaybackWindow() {
    playbackDisplay.innerHTML = '';
    const idxs = [currentSentenceIndex];
    if (currentSentenceIndex + 1 < sentences.length) idxs.push(currentSentenceIndex + 1);

    idxs.forEach((idx, i) => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line ' + (i === 0 ? 'current-line' : 'next-line');

      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence';
      sentenceSpan.dataset.idx = idx;

      segmentWords(sentences[idx], readerLanguage.value).forEach(w => {
        if (w.isWordLike) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.dataset.start = w.start;
          wordSpan.textContent = w.text;
          sentenceSpan.appendChild(wordSpan);
        } else {
          sentenceSpan.appendChild(document.createTextNode(w.text));
        }
      });

      lineDiv.appendChild(sentenceSpan);
      playbackDisplay.appendChild(lineDiv);
    });
  }

  function highlightWord(sentenceIdx, charIndex) {
    const sentenceEl = playbackDisplay.querySelector(`.sentence[data-idx="${sentenceIdx}"]`);
    if (!sentenceEl) return;
    playbackDisplay.querySelectorAll('.word.active-word').forEach(el => el.classList.remove('active-word'));

    let target = null;
    sentenceEl.querySelectorAll('.word').forEach(w => {
      if (parseInt(w.dataset.start, 10) <= charIndex) target = w;
    });
    if (target) {
      target.classList.add('active-word');
      target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function updatePlaybackButtons() {
    btnPauseResume.textContent = isPlaying ? 'Pause' : 'Resume';
    const paused = !isPlaying;
    navRow.classList.toggle('visible', paused);
    recordRow.classList.toggle('visible', paused);
    volumeRow.classList.toggle('visible', paused);
    btnPrev.disabled = currentSentenceIndex <= 0;
    btnNext.disabled = currentSentenceIndex >= sentences.length - 1;
    if (paused) {
      updateRecordButtons();
    } else {
      recordStatus.textContent = '';
    }
  }

  function playFromSentence(sentenceIndex, charOffset = 0) {
    if (sentenceIndex >= sentences.length) {
      isPlaying = false;
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      renderPlaybackWindow();
      updatePlaybackButtons();
      return;
    }

    currentSentenceIndex = sentenceIndex;
    renderPlaybackWindow();

    const sentenceText = sentences[sentenceIndex];
    const rawRemaining = sentenceText.slice(charOffset);
    const remaining = rawRemaining.trimStart();
    const baseOffset = charOffset + (rawRemaining.length - remaining.length);

    if (!remaining) {
      playFromSentence(sentenceIndex + 1, 0);
      return;
    }

    utterance = new SpeechSynthesisUtterance(remaining);
    utterance.lang = readerLanguage.value;
    utterance.rate = parseFloat(readerSpeed.value);

    utterance.onboundary = (event) => {
      if (event.charIndex === undefined) return;
      currentOffsetInSentence = baseOffset + event.charIndex;
      highlightWord(sentenceIndex, currentOffsetInSentence);
    };

    utterance.onend = () => {
      if (isPlaying) playFromSentence(sentenceIndex + 1, 0);
    };

    utterance.onerror = () => {
      if (isPlaying) { isPlaying = false; updatePlaybackButtons(); }
    };

    currentOffsetInSentence = baseOffset;
    isPlaying = true;
    synth.speak(utterance);
    updatePlaybackButtons();
  }

  btnReadAloud.addEventListener('click', () => {
    const text = readerTextarea.value.trim();
    if (!text) { alert('Please enter some text!'); return; }

    sentences = segmentSentences(text, readerLanguage.value);
    if (sentences.length === 0) { alert('No readable text found.'); return; }

    resetAllRecordings();
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    showView('playback-view');
    playFromSentence(0, 0);
  });

  btnPauseResume.addEventListener('click', () => {
    if (isPlaying) {
      isPlaying = false;
      synth.cancel();
      updatePlaybackButtons();
    } else {
      if (isRecording) return; // don't resume mid-recording
      playFromSentence(currentSentenceIndex, currentOffsetInSentence);
    }
  });

  btnStop.addEventListener('click', () => {
    if (isRecording) return;
    synth.cancel();
    isPlaying = false;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  btnPlaybackClose.addEventListener('click', () => {
    if (isRecording) return;
    synth.cancel();
    isPlaying = false;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    showView('reader-setup-view');
  });

  btnPrev.addEventListener('click', () => {
    if (isPlaying || isRecording) return;
    currentSentenceIndex = Math.max(0, currentSentenceIndex - 1);
    currentOffsetInSentence = 0;
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  btnNext.addEventListener('click', () => {
    if (isPlaying || isRecording) return;
    currentSentenceIndex = Math.min(sentences.length - 1, currentSentenceIndex + 1);
    currentOffsetInSentence = 0;
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  // ---------------------------------------------------------------
  // Real audio recording (MediaRecorder), Anki-card style.
  // Shows up under Previous/Next whenever playback is paused or
  // stopped, tied to whichever sentence is currently on screen.
  // Each sentence keeps its own recording so you can move around
  // and re-take individual lines.
  // ---------------------------------------------------------------

  let mediaRecorder = null;
  let mediaStream = null;
  let isRecording = false;
  let recordingChunks = [];
  let recordStartTime = 0;
  let recordTimerInterval = null;
  const sentenceRecordings = {}; // sentenceIndex -> { blob, url }

  function resetAllRecordings() {
    Object.values(sentenceRecordings).forEach(r => URL.revokeObjectURL(r.url));
    for (const k in sentenceRecordings) delete sentenceRecordings[k];
  }

  function updateRecordButtons() {
    const hasRecording = !!sentenceRecordings[currentSentenceIndex];
    btnRecordToggle.textContent = hasRecording ? '🎙 Re-record' : '🎙 Record';
    btnRecordToggle.classList.remove('recording');
    btnPlayMyRecording.disabled = !hasRecording;
    btnDeleteRecording.disabled = !hasRecording;
    recordStatus.textContent = '';
  }

  function setControlsDisabledForRecording(disabled) {
    btnPauseResume.disabled = disabled;
    btnStop.disabled = disabled;
    btnPlaybackClose.disabled = disabled;
    btnPrev.disabled = disabled || currentSentenceIndex <= 0;
    btnNext.disabled = disabled || currentSentenceIndex >= sentences.length - 1;
    btnPlayMyRecording.disabled = disabled || !sentenceRecordings[currentSentenceIndex];
    btnDeleteRecording.disabled = disabled || !sentenceRecordings[currentSentenceIndex];
  }

  async function startRecording() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true // asks the mic driver to boost quiet input at capture time
        }
      });
    } catch (err) {
      alert('Microphone access is needed to record. Please allow microphone permission and try again.');
      return;
    }

    mediaStream = stream;
    recordingChunks = [];
    const recordedForSentence = currentSentenceIndex;

    try {
      mediaRecorder = new MediaRecorder(mediaStream);
    } catch (err) {
      alert('Recording is not supported in this browser.');
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordingChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);
      if (sentenceRecordings[recordedForSentence]) {
        URL.revokeObjectURL(sentenceRecordings[recordedForSentence].url);
      }
      sentenceRecordings[recordedForSentence] = { blob, url };

      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      isRecording = false;
      clearInterval(recordTimerInterval);
      recordTimerInterval = null;
      setControlsDisabledForRecording(false);
      updateRecordButtons();
    };

    mediaRecorder.start();
    isRecording = true;
    recordStartTime = Date.now();
    setControlsDisabledForRecording(true);
    btnRecordToggle.disabled = false; // recording toggle itself stays active (to stop)
    btnRecordToggle.textContent = '⏹ Stop';
    btnRecordToggle.classList.add('recording');

    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordStartTime) / 1000);
      recordStatus.textContent = `● Recording… ${secs}s`;
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
    }
  }

  btnRecordToggle.addEventListener('click', () => {
    if (isRecording) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  // A plain <audio> element can't play louder than the phone's normal
  // media volume — its .volume property only ever scales *down* from
  // whatever the system volume is, never up. Since mic recordings are
  // often captured quietly (small phone mic, conservative default gain),
  // played-back volume can end up much softer than expected even at
  // 100% system volume. Routing playback through the Web Audio API and
  // applying a GainNode above 1.0 amplifies the actual signal, which
  // does let it play back louder than the un-boosted recording — this
  // is the fix, not just a volume-slider cosmetic change.
  let audioCtx = null;

  async function playRecordingBoosted(blob) {
    const gainValue = parseFloat(playbackGainSelect.value) || 1;

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      const arrayBuffer = await blob.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;

      const gainNode = audioCtx.createGain();
      gainNode.gain.value = gainValue;

      source.connect(gainNode).connect(audioCtx.destination);
      source.start(0);
    } catch (err) {
      // Fallback for browsers where Web Audio decoding fails: at least
      // play it back normally rather than doing nothing.
      myRecordingAudio.src = URL.createObjectURL(blob);
      myRecordingAudio.play();
    }
  }

  btnPlayMyRecording.addEventListener('click', () => {
    const rec = sentenceRecordings[currentSentenceIndex];
    if (!rec) return;
    playRecordingBoosted(rec.blob);
  });

  btnDeleteRecording.addEventListener('click', () => {
    const rec = sentenceRecordings[currentSentenceIndex];
    if (!rec) return;
    URL.revokeObjectURL(rec.url);
    delete sentenceRecordings[currentSentenceIndex];
    updateRecordButtons();
  });

  // ---------------------------------------------------------------
  // Recorder screen (separate: speech-to-text via Web Speech API)
  // ---------------------------------------------------------------
  btnRecord.addEventListener('click', () => {
    if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
      alert('Speech recognition not supported in this browser.');
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = recorderLanguage.value;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      recognizedText.value = transcript;
      recordedAudio = transcript;
      btnPlayRecording.disabled = false;
    };

    recognition.start();
  });

  btnPlayRecording.addEventListener('click', () => {
    if (recordedAudio) {
      const playbackUtterance = new SpeechSynthesisUtterance(recordedAudio);
      playbackUtterance.lang = recorderLanguage.value;
      synth.speak(playbackUtterance);
    }
  });
</script>
</body>
</html>
