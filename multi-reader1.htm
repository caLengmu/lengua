<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Multilingual Text Reader & Recorder</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f1f8fc;
    color: #444;
    margin: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
    padding: 28px 24px;
    text-align: center;
    position: relative;
  }

  .view { display: none; }
  .view.active { display: block; }

  h1 { color: #2a628f; margin: 0 0 6px; font-size: 1.6rem; line-height: 1.3; }
  h2 { color: #2a628f; margin: 0 0 16px; font-size: 1.2rem; }

  .flags { margin-bottom: 18px; }
  .flags img { width: 34px; max-width: 16vw; margin: 0 4px; }

  textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    outline: none;
    font-family: inherit;
    text-align: left;
    resize: vertical;
    background: #fbfdff;
  }

  #home-textarea {
    height: 130px;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(15, 76, 129, 0.06);
  }
  #home-textarea:focus { border-color: #6fb3e0; }

  .btn-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn-row + .btn-row { margin-top: 12px; }

  select, button {
    font-size: 15px;
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    background-color: #0f4c81;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease;
    flex: 1 1 auto;
    min-width: 100px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  select:hover, button:hover { background-color: #083a63; }
  button:active { background-color: #062c4c; }
  button:disabled { background-color: #c5dfee; cursor: not-allowed; }

  button.secondary {
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  button.secondary:hover { background-color: #dcebf5; }

  select { padding: 11px 12px; }

  /* ---------- home screen: paired columns ---------- */
  .home-grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .home-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #btn-start { background-color: #1c7a4d; }
  #btn-start:hover { background-color: #145f3b; }

  /* ---------- Now Reading header ---------- */
  .playback-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  #playback-speed { flex: 0 1 130px; min-width: 90px; }
  .sentence-counter {
    display: inline-block;
    background: #ff9f1c;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 4px rgba(255, 159, 28, 0.4);
  }
  .icon-btn {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    min-width: 42px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  .icon-btn:hover { background-color: #dcebf5; }

  /* ---------- playback screen ---------- */
  .playback-display {
    text-align: left;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    padding: 20px;
    margin: 4px 0 6px;
    min-height: 140px;
    background: #fbfdff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .playback-display .line { font-size: 21px; line-height: 1.8; word-break: break-word; }
  .playback-display .line.next-line { opacity: 0.4; font-size: 19px; }

  .playback-display .word {
    border-radius: 4px;
    padding: 1px 2px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .playback-display .word.active-word { background: #ffd166; color: #222; }

  .nav-row { display: none; margin-top: 12px; }
  .nav-row.visible { display: flex; }

  /* ---------- recording panel: visually boxed off ---------- */
  #record-panel {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border: 2px dashed #f3b23c;
    background: #fff8ec;
    border-radius: 14px;
  }
  #record-panel.visible { display: block; }

  .record-panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #b3701a;
    text-align: left;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .record-panel-title-text { flex: 1 1 auto; }
  .save-btn {
    flex: 0 0 auto;
    min-width: auto;
    padding: 6px 12px;
    font-size: 13px;
    background-color: #fff;
    color: #b3701a;
    border: 2px solid #f3b23c;
  }
  .save-btn:hover { background-color: #fff2da; }

  /* Enable/disable switch for the recording area. Placed at the left
     of the title row, mirroring the common pattern of a section-level
     on/off control leading the section it governs, with actions (Save)
     kept on the trailing/right side. */
  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cfcfcf;
    transition: background-color 0.2s ease;
    border-radius: 24px;
  }
  .toggle-slider::before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    transition: transform 0.2s ease;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle-switch input:checked + .toggle-slider { background-color: #1c7a4d; }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

  #record-controls-wrapper {
    overflow: hidden;
    max-height: 600px;
    opacity: 1;
    margin-top: 12px;
    transition: max-height 0.25s ease, opacity 0.2s ease, margin-top 0.25s ease;
  }

  /* Dark/disabled state: title row stays visible (so it can be turned
     back on), everything below it collapses away entirely rather than
     just being dimmed, since it's not usable while off. */
  #record-panel.panel-disabled {
    background: #383838;
    border-color: #5a5a5a;
  }
  #record-panel.panel-disabled .record-panel-title-text { color: #cfcfcf; }
  #record-panel.panel-disabled #record-controls-wrapper {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    pointer-events: none;
  }

  /* ---------- Load Text / Save-To views ---------- */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #2a628f;
    text-align: left;
    margin-top: 18px;
    margin-bottom: 8px;
  }
  .project-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .project-row {
    display: flex;
    gap: 8px;
  }
  .project-btn { flex: 1 1 auto; text-align: left; }
  .delete-btn { flex: 0 0 auto; min-width: 50px; }

  .slot-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .slot-btn {
    background-color: #ffffff;
    color: #b3701a;
    border: 2px solid #f3b23c;
    flex: 1 1 auto;
    min-width: 90px;
    font-size: 14px;
    padding: 9px 10px;
  }
  .slot-btn:hover { background-color: #fff2da; }
  .slot-btn.active-slot {
    background-color: #f3b23c;
    color: #fff;
  }

  #btn-record-toggle.recording {
    background-color: #d64545;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(214, 69, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0); }
  }

  .record-status {
    font-size: 13px;
    color: #d64545;
    margin: 8px 0 0;
    min-height: 16px;
    font-weight: 600;
  }

  #volume-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    margin-top: 14px;
    text-align: left;
  }
  #volume-row label { font-size: 13px; color: #b3701a; font-weight: 600; }
  #volume-row input[type="range"] { width: 100%; accent-color: #f3b23c; padding: 0; background: transparent; }
  .gain-feedback { font-size: 11.5px; color: #a98750; min-height: 14px; }

  .hint { font-size: 12px; color: #9db6c6; margin-top: 10px; }

  @media (max-width: 400px) {
    body { padding: 8px; }
    .app { padding: 18px 14px; border-radius: 12px; }
    h1 { font-size: 1.3rem; }
    .flags img { width: 28px; }
    select, button { font-size: 14px; padding: 10px; min-width: 84px; }
    .playback-display .line { font-size: 18px; }
    .playback-display .line.next-line { font-size: 16px; }
    .home-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div id="home-view" class="view active">
    <h1>Multilingual Text Reader & Recorder</h1>
    <div class="flags">
      <img src="https://flagcdn.com/w320/jp.png" alt="Japan Flag">
      <img src="https://flagcdn.com/w320/kr.png" alt="Korea Flag">
      <img src="https://flagcdn.com/w320/es.png" alt="Spain Flag">
      <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
    </div>
    <textarea id="home-textarea" placeholder="Type or paste text here..."></textarea>

    <div class="home-grid">
      <div class="home-col">
        <button id="btn-paste" class="secondary">📋 Paste Text</button>
        <select id="home-language">
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
          <option value="es-ES">español</option>
          <option value="en-US">English</option>
        </select>
      </div>
      <div class="home-col">
        <button id="btn-clear" class="secondary">🗑️ Clear Text</button>
        <button id="btn-start">▶️ Start</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-activate-recorder">🎤 Activate Recorder</button>
    </div>
    <div class="btn-row">
      <button id="btn-load-text" class="secondary">📂 Load Text</button>
    </div>
  </div>

  <!-- ============ PLAYBACK ("Now Reading") ============ -->
  <div id="playback-view" class="view">
    <div class="playback-header">
      <select id="playback-speed">
        <option value="1">1x</option>
        <option value="0.85">0.85x</option>
        <option value="0.7">0.7x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
      <h2 style="margin:0; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;">
        📖 Now Reading <span id="sentence-counter" class="sentence-counter">1 of 1</span>
      </h2>
      <button id="btn-playback-close" class="icon-btn" title="Close">✕</button>
    </div>

    <div id="playback-display" class="playback-display"></div>

    <div class="btn-row">
      <button id="btn-pause-resume">⏸️ Pause</button>
      <button id="btn-stop" class="secondary">🔄 Start Over</button>
    </div>

    <div id="nav-row" class="btn-row nav-row">
      <button id="btn-prev" class="secondary">⏮️ Previous</button>
      <button id="btn-next" class="secondary">⏭️ Next</button>
    </div>

    <!-- Real audio recording (MediaRecorder), Anki-card style: record your
         own voice reading the current sentence, with 3 comparable takes. -->
    <div id="record-panel">
      <div class="record-panel-title">
        <label class="toggle-switch" title="Enable practice recording">
          <input type="checkbox" id="record-enable-toggle">
          <span class="toggle-slider"></span>
        </label>
        <span class="record-panel-title-text">🎙️ PRACTICE RECORDING</span>
        <button id="btn-save-recording" class="secondary save-btn">💾 Save</button>
      </div>

      <div id="record-controls-wrapper">
        <div class="slot-row">
          <button id="btn-rec-slot-1" class="slot-btn active-slot">🎤 Rec #1</button>
          <button id="btn-rec-slot-2" class="slot-btn">🎤 Rec #2</button>
          <button id="btn-rec-slot-3" class="slot-btn">🎤 Rec #3</button>
        </div>

        <div id="record-row" class="btn-row" style="margin-top:0;">
          <button id="btn-record-toggle">🎙️ Record</button>
          <button id="btn-play-pause" class="secondary" disabled>▶️ Play</button>
          <button id="btn-delete-recording" class="secondary" disabled>🗑️ Delete</button>
        </div>

        <div id="volume-row">
          <label for="playback-gain">🔊 Extra Volume: <span id="gain-label">1.5x</span></label>
          <input type="range" id="playback-gain" min="1" max="10" step="0.5" value="1.5">
          <div id="gain-feedback" class="gain-feedback"></div>
        </div>

        <div id="record-status" class="record-status"></div>
      </div>
    </div>

    <div class="hint">Previous / Next / Recording appear while paused or stopped</div>
    <audio id="my-recording-audio" style="display:none"></audio>
  </div>

  <!-- ============ LOAD TEXT ============ -->
  <div id="load-text-view" class="view">
    <div class="playback-header">
      <h2 style="margin:0;">📂 Load Text</h2>
      <button id="btn-loadtext-close" class="icon-btn" title="Close">✕</button>
    </div>

    <div class="section-title">📚 Samples</div>
    <div class="btn-row">
      <button id="btn-sample-1" class="secondary">📄 Sample #1</button>
      <button id="btn-sample-2" class="secondary">📄 Sample #2</button>
      <button id="btn-sample-3" class="secondary">📄 Sample #3</button>
      <button id="btn-sample-4" class="secondary">📄 Sample #4</button>
    </div>

    <div class="section-title" style="margin-top:24px;">💼 Saved Projects</div>
    <div class="project-list">
      <div class="project-row">
        <button id="btn-project-1" class="secondary project-btn">⚪ Project #1</button>
        <button id="btn-delete-project-1" class="secondary delete-btn">🗑️</button>
      </div>
      <div class="project-row">
        <button id="btn-project-2" class="secondary project-btn">⚪ Project #2</button>
        <button id="btn-delete-project-2" class="secondary delete-btn">🗑️</button>
      </div>
      <div class="project-row">
        <button id="btn-project-3" class="secondary project-btn">⚪ Project #3</button>
        <button id="btn-delete-project-3" class="secondary delete-btn">🗑️</button>
      </div>
      <div class="project-row">
        <button id="btn-project-4" class="secondary project-btn">⚪ Project #4</button>
        <button id="btn-delete-project-4" class="secondary delete-btn">🗑️</button>
      </div>
      <div class="project-row">
        <button id="btn-project-5" class="secondary project-btn">⚪ Project #5</button>
        <button id="btn-delete-project-5" class="secondary delete-btn">🗑️</button>
      </div>
    </div>
  </div>

  <!-- ============ SAVE TO PROJECT ============ -->
  <div id="save-view" class="view">
    <div class="playback-header">
      <h2 style="margin:0;">💾 Save To…</h2>
      <button id="btn-save-close" class="icon-btn" title="Close">✕</button>
    </div>
    <div class="project-list">
      <button id="btn-save-slot-1" class="secondary project-btn">⚪ Project #1</button>
      <button id="btn-save-slot-2" class="secondary project-btn">⚪ Project #2</button>
      <button id="btn-save-slot-3" class="secondary project-btn">⚪ Project #3</button>
      <button id="btn-save-slot-4" class="secondary project-btn">⚪ Project #4</button>
      <button id="btn-save-slot-5" class="secondary project-btn">⚪ Project #5</button>
    </div>
  </div>

  <!-- ============ OVERWRITE CONFIRMATION ============ -->
  <div id="save-confirm-view" class="view">
    <h2>⚠️ Overwrite Project?</h2>
    <p id="save-confirm-text" style="color:#777; text-align:left;"></p>
    <div class="btn-row">
      <button id="btn-save-confirm-yes">✅ Overwrite</button>
      <button id="btn-save-confirm-cancel" class="secondary">✕ Cancel</button>
    </div>
  </div>

  <!-- ============ RECORDER (speech-to-text demo) ============ -->
  <div id="recorder-view" class="view">
    <h2>🎤 Recorder</h2>
    <div class="btn-row">
      <select id="recorder-language">
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <textarea id="recognized-text" placeholder="Recognized speech will appear here..." readonly style="height:80px;"></textarea>
    <div class="btn-row">
      <button id="btn-record">🎙️ Record</button>
      <button id="btn-play-recording" disabled>▶️ Play Recording</button>
    </div>
    <div class="btn-row">
      <button id="btn-recorder-close" class="secondary">✕ Close</button>
    </div>
  </div>

</div>

<script>
  // ---------------------------------------------------------------
  // View switching
  // ---------------------------------------------------------------
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------------------------------------------------------------
  // Element references
  // ---------------------------------------------------------------
  const homeTextarea = document.getElementById('home-textarea');
  const homeLanguage = document.getElementById('home-language');
  const btnPaste = document.getElementById('btn-paste');
  const btnClear = document.getElementById('btn-clear');
  const btnStart = document.getElementById('btn-start');
  const btnActivateRecorder = document.getElementById('btn-activate-recorder');
  const btnLoadText = document.getElementById('btn-load-text');

  const playbackSpeed = document.getElementById('playback-speed');
  const btnPlaybackClose = document.getElementById('btn-playback-close');
  const playbackDisplay = document.getElementById('playback-display');
  const btnPauseResume = document.getElementById('btn-pause-resume');
  const btnStop = document.getElementById('btn-stop');
  const navRow = document.getElementById('nav-row');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  const recordPanel = document.getElementById('record-panel');
  const recordEnableToggle = document.getElementById('record-enable-toggle');
  const btnSaveRecording = document.getElementById('btn-save-recording');
  const btnRecSlot1 = document.getElementById('btn-rec-slot-1');
  const btnRecSlot2 = document.getElementById('btn-rec-slot-2');
  const btnRecSlot3 = document.getElementById('btn-rec-slot-3');
  const btnRecordToggle = document.getElementById('btn-record-toggle');
  const btnPlayPause = document.getElementById('btn-play-pause');
  const btnDeleteRecording = document.getElementById('btn-delete-recording');
  const recordStatus = document.getElementById('record-status');
  const myRecordingAudio = document.getElementById('my-recording-audio');
  const gainSlider = document.getElementById('playback-gain');
  const gainLabel = document.getElementById('gain-label');
  const gainFeedback = document.getElementById('gain-feedback');

  const recorderLanguage = document.getElementById('recorder-language');
  const recognizedText = document.getElementById('recognized-text');
  const btnRecord = document.getElementById('btn-record');
  const btnPlayRecording = document.getElementById('btn-play-recording');
  const btnRecorderClose = document.getElementById('btn-recorder-close');

  const btnLoadTextClose = document.getElementById('btn-loadtext-close');
  const btnSample1 = document.getElementById('btn-sample-1');
  const btnSample2 = document.getElementById('btn-sample-2');
  const btnSample3 = document.getElementById('btn-sample-3');
  const btnSample4 = document.getElementById('btn-sample-4');
  const btnProject1 = document.getElementById('btn-project-1');
  const btnProject2 = document.getElementById('btn-project-2');
  const btnProject3 = document.getElementById('btn-project-3');
  const btnProject4 = document.getElementById('btn-project-4');
  const btnProject5 = document.getElementById('btn-project-5');
  const btnDeleteProject1 = document.getElementById('btn-delete-project-1');
  const btnDeleteProject2 = document.getElementById('btn-delete-project-2');
  const btnDeleteProject3 = document.getElementById('btn-delete-project-3');
  const btnDeleteProject4 = document.getElementById('btn-delete-project-4');
  const btnDeleteProject5 = document.getElementById('btn-delete-project-5');

  const btnSaveClose = document.getElementById('btn-save-close');
  const btnSaveSlot1 = document.getElementById('btn-save-slot-1');
  const btnSaveSlot2 = document.getElementById('btn-save-slot-2');
  const btnSaveSlot3 = document.getElementById('btn-save-slot-3');
  const btnSaveSlot4 = document.getElementById('btn-save-slot-4');
  const btnSaveSlot5 = document.getElementById('btn-save-slot-5');

  const PROJECT_IDS = [1, 2, 3, 4, 5];

  const saveConfirmText = document.getElementById('save-confirm-text');
  const btnSaveConfirmYes = document.getElementById('btn-save-confirm-yes');
  const btnSaveConfirmCancel = document.getElementById('btn-save-confirm-cancel');

  const synth = window.speechSynthesis;
  let utterance;
  let recognition;
  let recordedAudio = null;

  // ---------------------------------------------------------------
  // Platform auto-detection (no manual switch — the browser already
  // tells us what we need). Used to apply iOS-only TTS workarounds
  // without affecting Android/desktop behavior.
  // ---------------------------------------------------------------
  function detectIsIOS() {
    const ua = navigator.userAgent || navigator.vendor || '';
    if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return true;
    // iPadOS 13+ Safari reports itself as "Mac" but is touch-based
    if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) return true;
    return false;
  }
  const IS_IOS = detectIsIOS();

  // iOS/Safari sometimes returns an empty voice list on first load;
  // the real list only becomes available after 'voiceschanged' fires.
  let cachedVoices = [];
  function refreshVoiceList() { cachedVoices = synth.getVoices() || []; }
  refreshVoiceList();
  if ('onvoiceschanged' in synth) {
    synth.onvoiceschanged = refreshVoiceList;
  }
  function pickVoiceForLang(lang) {
    if (!cachedVoices.length) return null;
    return cachedVoices.find(v => v.lang === lang)
        || cachedVoices.find(v => v.lang && v.lang.startsWith(lang.split('-')[0]))
        || null;
  }

  // iOS has a known bug where speech synthesis silently stalls on
  // utterances longer than ~15 seconds. A pause()/resume() nudge
  // partway through resets its internal timer and keeps it going.
  // This only runs on iOS; Android/desktop are unaffected.
  let iosKeepAliveTimer = null;
  function startIOSKeepAlive() {
    if (!IS_IOS) return;
    stopIOSKeepAlive();
    iosKeepAliveTimer = setInterval(() => {
      if (synth.speaking && !synth.paused) {
        synth.pause();
        synth.resume();
      }
    }, 9000);
  }
  function stopIOSKeepAlive() {
    if (iosKeepAliveTimer) {
      clearInterval(iosKeepAliveTimer);
      iosKeepAliveTimer = null;
    }
  }

  // Best-effort: ask the browser not to evict our IndexedDB data under
  // storage pressure. Not guaranteed, safe to ignore if unsupported.
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }

  // ---------------------------------------------------------------
  // Sample texts — EDIT HERE to add your own built-in samples.
  //
  // Each entry needs a `language` (one of 'ja-JP' | 'ko-KR' | 'es-ES' |
  // 'en-US') and the `text` itself. Leave `text` empty to keep a slot
  // disabled (tapping it will just show a reminder to fill it in).
  //
  // `text` uses backticks (`), not quotes, so you can paste text with
  // real line breaks / multiple paragraphs directly — you do NOT need
  // to keep everything on one line or add manual line-break characters.
  // The number of sentences is detected automatically from punctuation
  // (Intl.Segmenter), regardless of how the text is broken into lines.
  //
  // Example:
  //   1: { language: 'ja-JP', text: `今日はいい天気ですね。
  //   散歩に行きましょう。
  //   公園でお弁当を食べます。` },
  // ---------------------------------------------------------------
  const SAMPLE_TEXTS = {
    1: { language: 'en-US', text: `` },
    2: { language: 'en-US', text: `` },
    3: { language: 'en-US', text: `` },
    4: { language: 'en-US', text: `` },
  };

  // ---------------------------------------------------------------
  // IndexedDB persistence: each "project" stores the original text,
  // its language, and every practice recording (as real Blobs, not
  // base64) keyed by sentence index and take number (1/2/3).
  // ---------------------------------------------------------------
  const DB_NAME = 'MultilingualReaderDB';
  const DB_VERSION = 1;
  const STORE_PROJECTS = 'projects';

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
          db.createObjectStore(STORE_PROJECTS, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetProject(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readonly');
      const req = tx.objectStore(STORE_PROJECTS).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPutProject(project) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readwrite');
      tx.objectStore(STORE_PROJECTS).put(project);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDeleteProject(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readwrite');
      tx.objectStore(STORE_PROJECTS).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function getProjectStatuses() {
    const ids = PROJECT_IDS;
    const results = await Promise.all(ids.map(id => dbGetProject(id).catch(() => null)));
    const statusMap = {};
    ids.forEach((id, i) => { statusMap[id] = !!results[i]; });
    return statusMap;
  }

  gainSlider.addEventListener('input', () => {
    gainLabel.textContent = parseFloat(gainSlider.value).toFixed(1) + 'x';
    gainFeedback.textContent = '';
  });

  // ---------------------------------------------------------------
  // Home screen: paste / clear / navigate
  // ---------------------------------------------------------------
  function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? textarea.value.length;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    const pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
  }

  btnPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) insertAtCursor(homeTextarea, text);
    } catch (err) {
      alert('Could not read the clipboard automatically. Please paste manually (Ctrl/Cmd+V), or long-press the text box and choose Paste.');
    }
  });

  btnClear.addEventListener('click', () => {
    homeTextarea.value = '';
    homeTextarea.focus();
  });

  btnActivateRecorder.addEventListener('click', () => {
    recognizedText.value = '';

    btnPlayRecording.disabled = true;
    showView('recorder-view');

  btnRecorderClose.addEventListener('click', () => showView('home-view'));

  // ---------------------------------------------------------------
  // Sentence / word segmentation (locale-aware; Intl.Segmenter
  // handles Japanese/Korean correctly, where words aren't
  // separated by spaces)
  // ---------------------------------------------------------------
  function segmentSentences(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'sentence' });
        return Array.from(seg.segment(text), s => s.segment).filter(s => s.trim().length);
      } catch (e) { /* fall through */ }
    }
    return text.split(/(?<=[.!?。！？\n])\s*/).filter(s => s.trim().length);
  }

  function segmentWords(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'word' });
        let offset = 0;
        return Array.from(seg.segment(text), s => {
          const item = { text: s.segment, isWordLike: s.isWordLike, start: offset };
          offset += s.segment.length;
          return item;
        });
      } catch (e) { /* fall through */ }
    }
    let offset = 0;
    return text.split(/(\s+)/).filter(Boolean).map(s => {
      const item = { text: s, isWordLike: !/^\s+$/.test(s), start: offset };
      offset += s.length;
      return item;
    });
  }

  // ---------------------------------------------------------------
  // Playback: one sentence at a time as a queue, so Pause remembers
  // exactly where we were and Read Aloud (resume) picks up right
  // there. The display window always shows the sentence currently
  // being spoken plus the next one coming up.
  // ---------------------------------------------------------------

  let sentences = [];
  let currentSentenceIndex = 0;
  let currentOffsetInSentence = 0;
  let isPlaying = false;
  let activeLanguage = 'en-US';
  let activeFullText = '';

  function renderPlaybackWindow() {
    playbackDisplay.innerHTML = '';
    const idxs = [currentSentenceIndex];
    // In practice-recording mode, only the sentence being read is shown —
    // the next-sentence preview is dropped to save page space, since the
    // learner is focused on repeating just this one line.
    if (!recordingModeEnabled && currentSentenceIndex + 1 < sentences.length) {
      idxs.push(currentSentenceIndex + 1);
    }

    idxs.forEach((idx, i) => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line ' + (i === 0 ? 'current-line' : 'next-line');

      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence';
      sentenceSpan.dataset.idx = idx;

      segmentWords(sentences[idx], activeLanguage).forEach(w => {
        if (w.isWordLike) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.dataset.start = w.start;
          wordSpan.textContent = w.text;
          sentenceSpan.appendChild(wordSpan);
        } else {
          sentenceSpan.appendChild(document.createTextNode(w.text));
        }
      });

      lineDiv.appendChild(sentenceSpan);
      playbackDisplay.appendChild(lineDiv);
    });

    updateSentenceCounter();
  }

  function updateSentenceCounter() {
    const el = document.getElementById('sentence-counter');
    if (el) el.textContent = `${currentSentenceIndex + 1} of ${sentences.length}`;
  }

  function highlightWord(sentenceIdx, charIndex) {
    const sentenceEl = playbackDisplay.querySelector(`.sentence[data-idx="${sentenceIdx}"]`);
    if (!sentenceEl) return;
    playbackDisplay.querySelectorAll('.word.active-word').forEach(el => el.classList.remove('active-word'));

    let target = null;
    sentenceEl.querySelectorAll('.word').forEach(w => {
      if (parseInt(w.dataset.start, 10) <= charIndex) target = w;
    });
    if (target) {
      target.classList.add('active-word');
      target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function updatePlaybackButtons() {
    btnPauseResume.textContent = isPlaying ? '⏸️ Pause' : '▶️ Read Aloud';
    const paused = !isPlaying;
    navRow.classList.toggle('visible', paused);
    recordPanel.classList.toggle('visible', paused);
    btnPrev.disabled = currentSentenceIndex <= 0;
    btnNext.disabled = currentSentenceIndex >= sentences.length - 1;
    if (paused) {
      updateRecordButtons();
    } else {
      recordStatus.textContent = '';
    }
  }

  function playFromSentence(sentenceIndex, charOffset = 0) {
    if (sentenceIndex >= sentences.length) {
      isPlaying = false;
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      renderPlaybackWindow();
      updatePlaybackButtons();
      return;
    }

    currentSentenceIndex = sentenceIndex;
    renderPlaybackWindow();

    const sentenceText = sentences[sentenceIndex];
    const rawRemaining = sentenceText.slice(charOffset);
    const remaining = rawRemaining.trimStart();
    const baseOffset = charOffset + (rawRemaining.length - remaining.length);

    if (!remaining) {
      playFromSentence(sentenceIndex + 1, 0);
      return;
    }

    utterance = new SpeechSynthesisUtterance(remaining);
    utterance.lang = activeLanguage;
    utterance.rate = parseFloat(playbackSpeed.value);
    const preferredVoice = pickVoiceForLang(activeLanguage);
    if (preferredVoice) utterance.voice = preferredVoice;

    utterance.onboundary = (event) => {
      if (event.charIndex === undefined) return;
      currentOffsetInSentence = baseOffset + event.charIndex;
      highlightWord(sentenceIndex, currentOffsetInSentence);
    };

    utterance.onend = () => {
      stopIOSKeepAlive();
      if (!isPlaying) return;
      if (recordingModeEnabled) {
        // Practice mode: stop right after this sentence so the learner
        // can record themselves immediately, instead of TTS racing
        // ahead to the next line.
        isPlaying = false;
        updatePlaybackButtons();
      } else {
        playFromSentence(sentenceIndex + 1, 0);
      }
    };

    utterance.onerror = () => {
      stopIOSKeepAlive();
      if (isPlaying) { isPlaying = false; updatePlaybackButtons(); }
    };

    currentOffsetInSentence = baseOffset;
    isPlaying = true;
    synth.speak(utterance);
    startIOSKeepAlive();
    updatePlaybackButtons();
  }

  function enterReaderWithText(text, language) {
    const trimmed = (text || '').trim();
    if (!trimmed) { alert('There is no text to load.'); return false; }

    activeLanguage = language || 'en-US';
    activeFullText = trimmed;
    sentences = segmentSentences(trimmed, activeLanguage);
    if (sentences.length === 0) { alert('No readable text found.'); return false; }

    resetAllRecordings();
    currentRecSlot = 1;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    isPlaying = false;
    showView('playback-view');
    renderPlaybackWindow();   // show the first sentence, but don't speak yet
    updatePlaybackButtons();  // "Read Aloud" waits for the user to tap it
    return true;
  }

  function restoreRecordingsFromProject(recordings) {

  // ---------------------------------------------------------------
  // Real audio recording (MediaRecorder), Anki-card style.
  // Shows up under Previous/Next whenever playback is paused or
  // stopped. Each sentence keeps up to THREE separate takes
  // (Rec #1/#2/#3) so you can compare progress across attempts.
  //
  // Gated behind a dedicated on/off switch (default OFF): when off,
  // the recording area is dark/inert and Read Aloud behaves normally
  // (auto-advances through sentences). Switching it on dims nothing,
  // enables the recording controls, and changes Read Aloud to stop
  // after each sentence so the learner can immediately record their
  // own attempt at that same line.
  // ---------------------------------------------------------------

  let recordingModeEnabled = false;

  function applyRecordingModeUI() {
    recordPanel.classList.toggle('panel-disabled', !recordingModeEnabled);
  }
  applyRecordingModeUI();

  recordEnableToggle.addEventListener('change', () => {
    recordingModeEnabled = recordEnableToggle.checked;
    applyRecordingModeUI();
    if (sentences.length > 0) renderPlaybackWindow();
  });

  let mediaRecorder = null;
  let mediaStream = null;
  let isRecording = false;
  let recordingChunks = [];
  let recordStartTime = 0;
  let recordTimerInterval = null;
  let currentRecSlot = 1;
  const sentenceRecordings = {}; // sentenceIndex -> { 1: {blob,url}, 2: {...}, 3: {...} }

  // Playback of the user's own recording, with real pause/resume
  let audioCtx = null;
  let playbackAudioBuffer = null;
  let playbackKey = null; // "sentenceIdx:slot" the loaded buffer belongs to
  let playbackSource = null;
  let playbackOffset = 0; // seconds into the buffer to resume from
  let playbackStartCtxTime = 0;
  let isRecPlaying = false;

  function getCurrentSlotRecording() {
    const forSentence = sentenceRecordings[currentSentenceIndex];
    return forSentence ? forSentence[currentRecSlot] : undefined;
  }

  function resetAllRecordings() {
    Object.values(sentenceRecordings).forEach(slots => {
      Object.values(slots).forEach(r => URL.revokeObjectURL(r.url));
    });
    for (const k in sentenceRecordings) delete sentenceRecordings[k];
    resetPlaybackState();
  }

  function resetPlaybackState() {
    if (playbackSource) {
      playbackSource.onended = null;
      try { playbackSource.stop(); } catch (e) { /* already stopped */ }
      playbackSource = null;
    }
    isRecPlaying = false;
    playbackOffset = 0;
    playbackAudioBuffer = null;
    playbackKey = null;
    gainFeedback.textContent = '';
    updatePlayPauseLabel();
  }

  function updatePlayPauseLabel() {
    btnPlayPause.textContent = isRecPlaying ? '⏸️ Pause' : '▶️ Play';
  }

  function refreshSlotButtons() {
    const forSentence = sentenceRecordings[currentSentenceIndex] || {};
    [btnRecSlot1, btnRecSlot2, btnRecSlot3].forEach((btn, i) => {
      const slot = i + 1;
      const has = !!forSentence[slot];
      btn.textContent = `${has ? '🎤' : '⚪'} Rec #${slot}`;
      btn.classList.toggle('active-slot', slot === currentRecSlot);
    });
  }

  function updateRecordButtons() {
    const hasRecording = !!getCurrentSlotRecording();
    btnRecordToggle.textContent = hasRecording ? '🎙️ Re-record' : '🎙️ Record';
    btnRecordToggle.classList.remove('recording');
    btnPlayPause.disabled = !hasRecording;
    btnDeleteRecording.disabled = !hasRecording;
    recordStatus.textContent = '';
    updatePlayPauseLabel();
    refreshSlotButtons();
  }

  function setControlsDisabledForRecording(disabled) {
    btnPauseResume.disabled = disabled;
    btnStop.disabled = disabled;
    btnPlaybackClose.disabled = disabled;
    btnPrev.disabled = disabled || currentSentenceIndex <= 0;
    btnNext.disabled = disabled || currentSentenceIndex >= sentences.length - 1;
    btnRecSlot1.disabled = disabled;
    btnRecSlot2.disabled = disabled;
    btnRecSlot3.disabled = disabled;
    btnPlayPause.disabled = disabled || !getCurrentSlotRecording();
    btnDeleteRecording.disabled = disabled || !getCurrentSlotRecording();
  }

  function selectRecSlot(slot) {
    if (!recordingModeEnabled || isRecording) return;
    resetPlaybackState();
    currentRecSlot = slot;
    updateRecordButtons();
  }

  btnRecSlot1.addEventListener('click', () => selectRecSlot(1));
  btnRecSlot2.addEventListener('click', () => selectRecSlot(2));
  btnRecSlot3.addEventListener('click', () => selectRecSlot(3));

  // Android Chrome and iOS Safari support different recording
  // containers (Android: webm/opus; iOS Safari: mp4/aac — it doesn't
  // support webm at all). Asking the browser what it actually supports,
  // rather than leaving MediaRecorder to guess, cuts down on decode
  // failures later when we try to play the recording back boosted.
  function pickSupportedMimeType() {
    const candidates = [
      'audio/mp4',               // iOS Safari
      'audio/webm;codecs=opus',  // Chrome / Android / desktop
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
  }

  async function startRecording() {
    if (!recordingModeEnabled) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
    } catch (err) {
      alert('Microphone access is needed to record. Please allow microphone permission and try again.');
      return;
    }

    resetPlaybackState();
    mediaStream = stream;
    recordingChunks = [];
    const recordedForSentence = currentSentenceIndex;
    const recordedForSlot = currentRecSlot;

    try {
      const mimeType = pickSupportedMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
    } catch (err) {
      alert('Recording is not supported in this browser.');
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordingChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);

      if (!sentenceRecordings[recordedForSentence]) sentenceRecordings[recordedForSentence] = {};
      if (sentenceRecordings[recordedForSentence][recordedForSlot]) {
        URL.revokeObjectURL(sentenceRecordings[recordedForSentence][recordedForSlot].url);
      }
      sentenceRecordings[recordedForSentence][recordedForSlot] = { blob, url };

      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      isRecording = false;
      clearInterval(recordTimerInterval);
      recordTimerInterval = null;
      setControlsDisabledForRecording(false);
      updateRecordButtons();
    };

    mediaRecorder.start();
    isRecording = true;
    recordStartTime = Date.now();
    setControlsDisabledForRecording(true);
    btnRecordToggle.disabled = false; // stays clickable so it can be stopped
    btnRecordToggle.textContent = '⏹️ Stop';
    btnRecordToggle.classList.add('recording');

    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordStartTime) / 1000);
      recordStatus.textContent = `● Recording… ${secs}s`;
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) mediaRecorder.stop();
  }

  btnRecordToggle.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  // A plain <audio> element can't play louder than the phone's normal
  // media volume, and mobile mic capture is usually much quieter to
  // begin with (auto-gain targets phone-call loudness, not full-scale).
  // This is speech, not music, so the processing here is tuned for
  // pronunciation practice specifically:
  //   1. RMS (loudness) normalization, not peak — a single click/pop
  //      in the recording won't throw off the whole calibration the
  //      way a peak-based measurement would.
  //   2. A gentle "speech leveler" (mild 3:1 compression, soft knee)
  //      evens out loudness while preserving consonants and other
  //      articulation detail — a hard limiter would flatten exactly
  //      the detail a learner needs to hear to self-correct.
  //   3. A safety brickwall limiter near true peak, only to stop rare
  //      transients from digitally clipping — it doesn't touch normal
  //      speech, it's just a backstop.
  const TARGET_RMS = 0.1; // ~-20 dBFS, a typical conversational speech level

  function getRMSAmplitude(audioBuffer) {
    let sumSquares = 0;
    let count = 0;
    for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
      const data = audioBuffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) {
        sumSquares += data[i] * data[i];
        count++;
      }
    }
    return count > 0 ? Math.sqrt(sumSquares / count) : 0;
  }

  function buildPlaybackChain(buffer, offsetSeconds) {
    const userGain = parseFloat(gainSlider.value) || 1;
    const rms = getRMSAmplitude(buffer);
    const normalizeGain = rms > 0.0001 ? Math.min(TARGET_RMS / rms, 20) : 1;
    const totalGain = normalizeGain * userGain;

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;

    const gainNode = audioCtx.createGain();
    gainNode.gain.value = totalGain;

    // Gentle speech leveler: catches loudness swings without crushing
    // consonant detail.
    const leveler = audioCtx.createDynamicsCompressor();
    leveler.threshold.value = -20;
    leveler.knee.value = 6;
    leveler.ratio.value = 3;
    leveler.attack.value = 0.01;
    leveler.release.value = 0.15;

    // Safety brickwall: only engages on rare peaks close to full
    // scale, purely to prevent digital clipping distortion.
    const safetyLimiter = audioCtx.createDynamicsCompressor();
    safetyLimiter.threshold.value = -1;
    safetyLimiter.knee.value = 0;
    safetyLimiter.ratio.value = 20;
    safetyLimiter.attack.value = 0.002;
    safetyLimiter.release.value = 0.1;

    source.connect(gainNode).connect(leveler).connect(safetyLimiter).connect(audioCtx.destination);

    source.onended = () => {
      if (isRecPlaying) {
        isRecPlaying = false;
        playbackOffset = 0;
        updatePlayPauseLabel();
      }
    };

    playbackSource = source;
    playbackStartCtxTime = audioCtx.currentTime;
    isRecPlaying = true;
    source.start(0, offsetSeconds);
    updatePlayPauseLabel();

    const totalGainDb = 20 * Math.log10(totalGain);
    gainFeedback.textContent = `🎚️ Applied gain: +${totalGainDb.toFixed(1)} dB (normalize + boost)`;
  }

  btnPlayPause.addEventListener('click', async () => {
    if (!recordingModeEnabled) return;
    const rec = getCurrentSlotRecording();
    if (!rec) return;

    if (isRecPlaying) {
      // Pause: remember exactly how far we'd gotten
      const elapsed = audioCtx.currentTime - playbackStartCtxTime;
      playbackOffset += elapsed;
      if (playbackSource) {
        playbackSource.onended = null;
        try { playbackSource.stop(); } catch (e) { /* already stopped */ }
        playbackSource = null;
      }
      isRecPlaying = false;
      updatePlayPauseLabel();
      return;
    }

    const key = `${currentSentenceIndex}:${currentRecSlot}`;

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (playbackKey !== key || !playbackAudioBuffer) {
        const arrayBuffer = await rec.blob.arrayBuffer();
        playbackAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        playbackKey = key;
        playbackOffset = 0;
      }
      if (playbackOffset >= playbackAudioBuffer.duration) playbackOffset = 0;

      buildPlaybackChain(playbackAudioBuffer, playbackOffset);
    } catch (err) {
      // Don't fail silently — some browsers can't decode certain
      // recording formats, which would otherwise look like "the boost
      // slider just doesn't do anything."
      gainFeedback.textContent = '⚠️ Volume boost not supported for this recording on this browser — playing at original volume.';
      myRecordingAudio.src = URL.createObjectURL(rec.blob);
      myRecordingAudio.play();
    }
  });

  btnDeleteRecording.addEventListener('click', () => {
    if (!recordingModeEnabled) return;
    const rec = getCurrentSlotRecording();
    if (!rec) return;
    URL.revokeObjectURL(rec.url);
    delete sentenceRecordings[currentSentenceIndex][currentRecSlot];
    resetPlaybackState();
    updateRecordButtons();
  });

  // ---------------------------------------------------------------
  // Recorder screen (separate: speech-to-text via Web Speech API)
  // ---------------------------------------------------------------
  btnRecord.addEventListener('click', () => {
    if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
      alert('Speech recognition not supported in this browser.');
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = recorderLanguage.value;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      recognizedText.value = transcript;
      recordedAudio = transcript;
      btnPlayRecording.disabled = false;
    };

    recognition.start();
  });

  btnPlayRecording.addEventListener('click', () => {
    if (recordedAudio) {
      const playbackUtterance = new SpeechSynthesisUtterance(recordedAudio);
      playbackUtterance.lang = recorderLanguage.value;
      synth.speak(playbackUtterance);
    }
  });
</script>
</body>
</html>
