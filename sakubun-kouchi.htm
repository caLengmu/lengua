<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搶救中式英文大作戰：互動自學手冊</title>
  <style>
    /* ==========================================================================
       1. 主題與排版變數設定區（未來調整配色、字體、圓角與間距，只需修改此處）
       ========================================================================== */
    :root {
      /* 主色調（沉靜學術青綠） */
      --color-primary: #0F766E;
      --color-primary-hover: #115E59;
      --color-primary-soft: #F0FDFA;
      --color-primary-border: #99F6E4;

      /* 背景與卡片色彩 */
      --color-bg: #F8FAFC;
      --color-surface: #FFFFFF;
      --color-surface-muted: #F1F5F9;
      --color-border: #E2E8F0;
      --color-border-strong: #CBD5E1;

      /* 文字色彩 */
      --color-text: #1E293B;
      --color-text-secondary: #475569;
      --color-text-muted: #64748B;

      /* 語意色彩：中式錯誤（柔玫瑰紅）、道地正確（祖母綠）、提示（暖琥珀） */
      --color-error: #BE123C;
      --color-error-bg: #FFF1F2;
      --color-error-border: #FECDD3;

      --color-success: #047857;
      --color-success-bg: #ECFDF5;
      --color-success-border: #A7F3D0;

      --color-warning: #B45309;
      --color-warning-bg: #FFFBEB;
      --color-warning-border: #FDE68A;

      /* 字體與基礎字級（會隨頁首 A- / A / A+ 動態切換） */
      --font-sans: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", Roboto, sans-serif;
      --font-en: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-size-base: 16px;
      --line-height-base: 1.7;

      /* 圓角、陰影與間距 */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 9999px;
      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
      --max-width: 960px;
    }

    /* ==========================================================================
       2. 基礎重置與全域樣式
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      font-size: var(--font-size-base);
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      line-height: var(--line-height-base);
      overflow-x: hidden;
    }

    h1, h2, h3, h4, p {
      margin-top: 0;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
    }

    .en-text {
      font-family: var(--font-en);
      letter-spacing: 0.01em;
    }

    /* ==========================================================================
       3. 頂部固定導覽列與進度條
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.75rem 1rem 0.5rem;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--color-primary);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
      line-height: 1.25;
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--color-text-muted);
      display: block;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* 字級切換器 A- / A / A+ */
    .font-switcher {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--color-surface);
    }

    .font-btn {
      border: none;
      background: transparent;
      color: var(--color-text-secondary);
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 34px;
      transition: background 0.15s, color 0.15s;
    }

    .font-btn + .font-btn {
      border-left: 1px solid var(--color-border);
    }

    .font-btn:hover {
      background: var(--color-surface-muted);
    }

    .font-btn.active {
      background: var(--color-primary);
      color: #fff;
    }

    /* 進度區塊 */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: var(--color-text-muted);
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background: var(--color-surface-muted);
      border-radius: var(--radius-pill);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--color-primary), #14B8A6);
      border-radius: var(--radius-pill);
      transition: width 0.35s ease;
    }

    .progress-label {
      font-weight: 600;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    /* 頁籤導覽列（手機橫向滑動，電腦平鋪） */
    .tab-nav-wrapper {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.45rem 1rem 0.65rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .tab-nav-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-nav {
      display: flex;
      gap: 0.45rem;
      min-width: max-content;
    }

    .tab-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.48rem 0.88rem;
      min-height: 40px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-text-secondary);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s ease;
    }

    .tab-pill:hover {
      border-color: var(--color-primary-border);
      background: var(--color-primary-soft);
      color: var(--color-primary);
    }

    .tab-pill.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
      box-shadow: 0 2px 6px rgba(15, 118, 110, 0.22);
    }

    .tab-badge {
      font-size: 0.72rem;
      padding: 0.08rem 0.4rem;
      border-radius: var(--radius-pill);
      background: rgba(15, 23, 42, 0.08);
      color: inherit;
    }

    .tab-pill.active .tab-badge {
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
    }

    .tab-pill.completed .tab-badge {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .tab-pill.active.completed .tab-badge {
      background: rgba(255, 255, 255, 0.28);
      color: #fff;
    }

    /* ==========================================================================
       4. 主內容容器與共用元件
       ========================================================================== */
    .main-container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.35rem;
      margin-bottom: 1.25rem;
      box-shadow: var(--shadow-sm);
    }

    .hero-card {
      background: linear-gradient(135deg, #FFFFFF 0%, var(--color-primary-soft) 100%);
      border: 1px solid var(--color-primary-border);
    }

    .hero-eyebrow {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--color-primary);
      background: #FFFFFF;
      border: 1px solid var(--color-primary-border);
      padding: 0.2rem 0.65rem;
      border-radius: var(--radius-pill);
      margin-bottom: 0.65rem;
    }

    .hero-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--color-text);
      margin-bottom: 0.5rem;
      line-height: 1.35;
    }

    .hero-desc {
      color: var(--color-text-secondary);
      margin-bottom: 0;
      font-size: 0.96rem;
    }

    .section-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin: 1.75rem 0 0.9rem;
    }

    .section-title {
      font-size: 1.18rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: "";
      display: inline-block;
      width: 5px;
      height: 1.15em;
      background: var(--color-primary);
      border-radius: var(--radius-pill);
    }

    /* 按鈕樣式 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.52rem 1rem;
      min-height: 42px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.16s ease;
      text-decoration: none;
    }

    .btn-sm {
      padding: 0.36rem 0.75rem;
      min-height: 36px;
      font-size: 0.84rem;
    }

    .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--color-primary-hover);
    }

    .btn-outline {
      background: var(--color-surface);
      border-color: var(--color-border-strong);
      color: var(--color-text-secondary);
    }

    .btn-outline:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .btn-ghost {
      background: transparent;
      color: var(--color-text-muted);
      border-color: transparent;
    }

    .btn-ghost:hover {
      background: var(--color-surface-muted);
      color: var(--color-text);
    }

    .btn-danger-ghost {
      background: transparent;
      color: var(--color-error);
      border: 1px solid var(--color-error-border);
    }

    .btn-danger-ghost:hover {
      background: var(--color-error-bg);
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    /* ==========================================================================
       5. 原文診斷室專屬樣式
       ========================================================================== */
    .essay-box {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.25rem;
      font-family: var(--font-en);
      font-size: 1rem;
      line-height: 1.85;
      color: var(--color-text);
    }

    .essay-box p {
      text-indent: 2em;
      margin-bottom: 0.9rem;
    }

    .essay-box p:last-child {
      margin-bottom: 0;
    }

    .essay-compare-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .essay-compare-grid.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    .essay-label {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-pill);
      margin-bottom: 0.6rem;
    }

    .label-orig {
      background: var(--color-error-bg);
      color: var(--color-error);
      border: 1px solid var(--color-error-border);
    }

    .label-good {
      background: var(--color-success-bg);
      color: var(--color-success);
      border: 1px solid var(--color-success-border);
    }

    .hl-key {
      background: var(--color-primary-soft);
      color: var(--color-primary-hover);
      font-weight: 700;
      padding: 0.05rem 0.28rem;
      border-radius: 4px;
      border-bottom: 2px solid var(--color-primary-border);
    }

    .hl-err {
      background: var(--color-error-bg);
      color: var(--color-error);
      font-weight: 600;
      padding: 0.05rem 0.28rem;
      border-radius: 4px;
      text-decoration: underline wavy var(--color-error);
      text-underline-offset: 3px;
    }

    .paragraph-divider {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--color-primary);
      background: var(--color-primary-soft);
      border: 1px solid var(--color-primary-border);
      padding: 0.45rem 0.9rem;
      border-radius: var(--radius-sm);
      margin: 1.2rem 0 0.85rem;
      display: inline-block;
    }

    /* 逐句診斷卡片 */
    .diag-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.1rem 1.2rem;
      margin-bottom: 0.85rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .diag-card.is-open {
      border-color: var(--color-primary-border);
      box-shadow: var(--shadow-md);
    }

    .diag-top {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
    }

    .diag-num {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--color-surface-muted);
      color: var(--color-text-secondary);
      font-weight: 700;
      font-size: 0.86rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.1rem;
    }

    .diag-card.is-reviewed .diag-num {
      background: var(--color-primary-soft);
      color: var(--color-primary);
      border: 1px solid var(--color-primary-border);
    }

    .diag-body {
      flex: 1;
      min-width: 0;
    }

    .diag-original {
      font-family: var(--font-en);
      font-size: 1.04rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 0.55rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .diag-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
    }

    .hint-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: var(--color-warning);
      background: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      padding: 0.22rem 0.6rem;
      border-radius: var(--radius-pill);
    }

    .diag-panel {
      display: none;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px dashed var(--color-border-strong);
      animation: fadeSlide 0.22s ease;
    }

    .diag-card.is-open .diag-panel {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .diag-fix-box {
      background: var(--color-success-bg);
      border: 1px solid var(--color-success-border);
      border-left: 4px solid var(--color-success);
      border-radius: var(--radius-sm);
      padding: 0.8rem 1rem;
      margin-bottom: 0.85rem;
    }

    .diag-fix-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--color-success);
      margin-bottom: 0.25rem;
      display: block;
    }

    .diag-fix-text {
      font-family: var(--font-en);
      font-size: 1.02rem;
      font-weight: 600;
      color: #064E3B;
      margin: 0;
    }

    .diag-sub-heading {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--color-text);
      margin: 0.65rem 0 0.35rem;
    }

    .diag-reasons {
      margin: 0 0 0.75rem 0;
      padding-left: 1.25rem;
      color: var(--color-text-secondary);
      font-size: 0.92rem;
    }

    .diag-reasons li {
      margin-bottom: 0.3rem;
    }

    .diag-flow-box {
      background: var(--color-primary-soft);
      border: 1px solid var(--color-primary-border);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.95rem;
      font-size: 0.9rem;
      color: var(--color-text);
    }

    .diag-flow-box strong {
      color: var(--color-primary-hover);
    }

    /* ==========================================================================
       6. 六週教材：病灶心法卡片與對照表格
       ========================================================================== */
    .callout-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    @media (min-width: 720px) {
      .callout-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .callout {
      border-radius: var(--radius-md);
      padding: 1.1rem 1.2rem;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
    }

    .callout-diagnosis {
      border-top: 4px solid var(--color-error);
    }

    .callout-tip {
      border-top: 4px solid var(--color-primary);
    }

    .callout h3 {
      font-size: 1rem;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .callout ul {
      margin: 0;
      padding-left: 1.2rem;
      font-size: 0.92rem;
      color: var(--color-text-secondary);
    }

    .callout li {
      margin-bottom: 0.45rem;
    }

    .callout li:last-child {
      margin-bottom: 0;
    }

    /* 響應式對照表 */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-surface);
      margin-bottom: 1.25rem;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.93rem;
      text-align: left;
    }

    .compare-table th {
      background: var(--color-surface-muted);
      color: var(--color-text);
      font-weight: 700;
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }

    .compare-table td {
      padding: 0.75rem 0.9rem;
      border-bottom: 1px solid var(--color-border);
      vertical-align: top;
    }

    .compare-table tr:last-child td {
      border-bottom: none;
    }

    .td-type {
      font-weight: 600;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }

    .td-wrong {
      color: var(--color-error);
      background: rgba(255, 241, 242, 0.55);
      font-family: var(--font-en);
    }

    .td-right {
      color: var(--color-success);
      background: rgba(236, 253, 245, 0.55);
      font-family: var(--font-en);
    }

    /* 第五週遮罩自測模式 */
    .collocation-masked .td-right-mask {
      cursor: pointer;
      user-select: none;
    }

    .collocation-masked .td-right-mask:not(.revealed) .mask-content {
      filter: blur(6px);
      opacity: 0.35;
      transition: all 0.2s;
    }

    .mask-hint {
      display: none;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--color-primary);
      font-weight: 600;
      margin-left: 0.4rem;
    }

    .collocation-masked .td-right-mask:not(.revealed) .mask-hint {
      display: inline;
    }

    /* 手機窄螢幕自動轉成堆疊卡片式表格，杜絕擠壓 */
    @media (max-width: 640px) {
      .compare-table thead {
        display: none;
      }
      .compare-table, .compare-table tbody, .compare-table tr, .compare-table td {
        display: block;
        width: 100%;
      }
      .compare-table tr {
        border-bottom: 2px solid var(--color-border);
        padding: 0.55rem 0.75rem;
      }
      .compare-table tr:last-child {
        border-bottom: none;
      }
      .compare-table td {
        border: none;
        padding: 0.38rem 0.5rem;
        border-radius: 6px;
        margin-bottom: 0.3rem;
        white-space: normal;
      }
      .compare-table td::before {
        content: attr(data-label);
        display: block;
        font-family: var(--font-sans);
        font-size: 0.74rem;
        font-weight: 700;
        color: var(--color-text-muted);
        margin-bottom: 0.15rem;
      }
      .compare-table td.td-wrong::before { color: var(--color-error); }
      .compare-table td.td-right::before { color: var(--color-success); }
    }

    /* ==========================================================================
       7. 互動練習題元件樣式
       ========================================================================== */
    .exercise-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    .exercise-card.state-correct {
      border-color: var(--color-success-border);
      background: linear-gradient(180deg, #FFFFFF 0%, #FAFFFD 100%);
    }

    .exercise-card.state-wrong {
      border-color: var(--color-warning-border);
    }

    .ex-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }

    .ex-num {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--color-primary);
      background: var(--color-primary-soft);
      padding: 0.18rem 0.6rem;
      border-radius: var(--radius-pill);
    }

    .ex-status {
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-pill);
      padding: 0.15rem 0.6rem;
    }

    .ex-status.done {
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .ex-prompt {
      font-size: 1rem;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 0.75rem;
      line-height: 1.6;
    }

    .ex-prompt .orig-pill {
      display: block;
      margin-top: 0.35rem;
      padding: 0.6rem 0.85rem;
      background: var(--color-error-bg);
      border: 1px solid var(--color-error-border);
      border-radius: var(--radius-sm);
      color: var(--color-error);
      font-family: var(--font-en);
      font-weight: 600;
    }

    .ex-input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1.5px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-en);
      font-size: 0.98rem;
      color: var(--color-text);
      background: #FFFFFF;
      transition: border-color 0.16s, box-shadow 0.16s;
    }

    .ex-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
    }

    .ex-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    /* 選擇題按鈕 */
    .choice-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin: 0.65rem 0;
    }

    .choice-btn {
      flex: 1;
      min-width: 130px;
      padding: 0.65rem 1rem;
      min-height: 44px;
      border: 1.5px solid var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      font-family: var(--font-en);
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      transition: all 0.16s;
    }

    .choice-btn:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }

    .choice-btn.selected-correct {
      border-color: var(--color-success);
      background: var(--color-success-bg);
      color: var(--color-success);
    }

    .choice-btn.selected-wrong {
      border-color: var(--color-error);
      background: var(--color-error-bg);
      color: var(--color-error);
    }

    /* 句型重組詞塊（第三週 Q1） */
    .tile-dropzone {
      min-height: 56px;
      padding: 0.65rem;
      border: 2px dashed var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .tile-dropzone.empty::after {
      content: "點擊下方詞塊，依序排成正確的英文句子…";
      color: var(--color-text-muted);
      font-size: 0.88rem;
    }

    .tile-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .word-tile {
      padding: 0.45rem 0.85rem;
      min-height: 40px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--color-primary-border);
      background: var(--color-surface);
      color: var(--color-text);
      font-family: var(--font-en);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .word-tile:hover {
      background: var(--color-primary-soft);
      border-color: var(--color-primary);
      transform: translateY(-1px);
    }

    .word-tile.in-answer {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .word-tile.used {
      opacity: 0.35;
      pointer-events: none;
    }

    /* 句中填空與雙選下拉 */
    .inline-sentence {
      font-family: var(--font-en);
      font-size: 1.02rem;
      line-height: 2.2;
      color: var(--color-text);
      margin-bottom: 0.5rem;
    }

    .inline-blank {
      display: inline-block;
      width: 135px;
      max-width: 46vw;
      padding: 0.25rem 0.55rem;
      margin: 0 0.25rem;
      border: none;
      border-bottom: 2px solid var(--color-primary);
      background: var(--color-primary-soft);
      border-radius: 4px 4px 0 0;
      font-family: var(--font-en);
      font-weight: 600;
      color: var(--color-text);
      text-align: center;
    }

    .inline-blank:focus {
      outline: none;
      background: #fff;
      box-shadow: 0 2px 0 var(--color-primary);
    }

    .inline-select {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      margin: 0 0.25rem;
      border: 1.5px solid var(--color-primary);
      border-radius: var(--radius-sm);
      background: var(--color-primary-soft);
      font-family: var(--font-en);
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
    }

    .zh-cue {
      font-family: var(--font-sans);
      font-size: 0.84rem;
      color: var(--color-text-muted);
      margin-left: 0.3rem;
    }

    /* 回饋與解析框 */
    .feedback-box {
      margin-top: 0.8rem;
      padding: 0.85rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.92rem;
      display: none;
      animation: fadeSlide 0.2s ease;
    }

    .feedback-box.show {
      display: block;
    }

    .feedback-box.is-correct {
      background: var(--color-success-bg);
      border: 1px solid var(--color-success-border);
      color: #064E3B;
    }

    .feedback-box.is-retry {
      background: var(--color-warning-bg);
      border: 1px solid var(--color-warning-border);
      color: #78350F;
    }

    .feedback-box.is-reveal {
      background: var(--color-surface-muted);
      border: 1px solid var(--color-border-strong);
      color: var(--color-text);
    }

    .feedback-title {
      font-weight: 700;
      margin-bottom: 0.3rem;
      display: block;
    }

    .model-answer {
      font-family: var(--font-en);
      font-weight: 700;
      color: var(--color-success);
      background: #FFFFFF;
      padding: 0.45rem 0.7rem;
      border-radius: 6px;
      border: 1px solid var(--color-success-border);
      margin: 0.45rem 0;
      display: block;
    }

    /* ==========================================================================
       8. 第六週 SOP 自檢表與終極對照
       ========================================================================== */
    .sop-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .sop-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      margin-bottom: 0.6rem;
      cursor: pointer;
      background: var(--color-surface);
      transition: all 0.16s;
    }

    .sop-item:hover {
      border-color: var(--color-primary-border);
      background: var(--color-primary-soft);
    }

    .sop-item.checked {
      background: var(--color-success-bg);
      border-color: var(--color-success-border);
    }

    .sop-checkbox {
      width: 22px;
      height: 22px;
      margin-top: 0.15rem;
      accent-color: var(--color-primary);
      cursor: pointer;
      flex-shrink: 0;
    }

    .sop-text strong {
      display: block;
      color: var(--color-text);
      margin-bottom: 0.15rem;
    }

    .sop-item.checked .sop-text strong {
      color: var(--color-success);
    }

    .sop-text span {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
    }

    /* 底部上下週導覽 */
    .pager-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--color-border);
    }

    /* 客製化重設確認對話框（不使用瀏覽器原生 confirm/alert） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 200;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
    }

    .modal-dialog h3 {
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }

    .modal-dialog p {
      font-size: 0.92rem;
      color: var(--color-text-secondary);
      margin-bottom: 1.25rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

    /* ==========================================================================
       狀態管理與 LocalStorage 持久化（含完整錯誤處理，避免沙盒環境報錯）
       ========================================================================== */
    const STORAGE_KEY = 'chinglish_rescue_workbook_v1';

    const DEFAULT_STATE = {
      activeTab: 'diagnosis',
      fontSize: 'md',          // 'sm' | 'md' | 'lg'
      reviewedSentences: [],   // 已點開檢視的句號陣列 [1, 2, ...]
      completedExercises: [],  // 已完成的練習題 ID 陣列
      sopChecked: [],          // 第六週已勾選的自檢表 ID
      collocationMask: false,  // 第五週遮罩模式
      showFullCompare: false,  // 原文診斷室是否展開對照高分版
      showFinalBossCompare: false
    };

    let appState = loadState();

    function loadState() {
      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return { ...DEFAULT_STATE };
        const parsed = JSON.parse(raw);
        return {
          ...DEFAULT_STATE,
          ...parsed,
          reviewedSentences: Array.isArray(parsed.reviewedSentences) ? parsed.reviewedSentences : [],
          completedExercises: Array.isArray(parsed.completedExercises) ? parsed.completedExercises : [],
          sopChecked: Array.isArray(parsed.sopChecked) ? parsed.sopChecked : []
        };
      } catch (err) {
        return { ...DEFAULT_STATE };
      }
    }

    function saveState() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (err) {
        // 若瀏覽器停用 localStorage，靜默降級為記憶體狀態
      }
    }

    /* ==========================================================================
       工具函式：文字正規化比對、字級切換、總進度計算
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 寬容比對使用者輸入的英文句子（忽略大小寫、多餘空白、句尾標點、彎引號與可選逗號差異）
    function normalizeText(str, ignoreCommas = false) {
      let s = String(str || '')
        .replace(/[’‘]/g, "'")
        .replace(/[“”]/g, '"')
        .trim()
        .replace(/\s+/g, ' ')
        .replace(/\s+([.,!?;:])/g, '$1')
        .replace(/[.!?]+$/, '')
        .toLowerCase();
      if (ignoreCommas) {
        s = s.replace(/,/g, '');
      }
      return s;
    }

    function isAnswerMatch(userInput, acceptedList) {
      const normStrict = normalizeText(userInput, false);
      const normLoose = normalizeText(userInput, true);
      if (!normStrict) return false;
      return acceptedList.some((ans) => {
        return normalizeText(ans, false) === normStrict || normalizeText(ans, true) === normLoose;
      });
    }

    function getAllExerciseIds() {
      const ids = [];
      COURSE_DATA.weeks.forEach((w) => {
        w.exercises.forEach((ex) => ids.push(ex.id));
      });
      return ids;
    }

    function markExerciseDone(exId) {
      if (!appState.completedExercises.includes(exId)) {
        appState.completedExercises.push(exId);
        saveState();
        updateProgressUI();
        renderTabNav();
      }
    }

    function applyFontSize(sizeKey) {
      const map = { sm: '14.5px', md: '16px', lg: '18.5px' };
      const px = map[sizeKey] || '16px';
      document.documentElement.style.setProperty('--font-size-base', px);
      appState.fontSize = sizeKey;
      saveState();

      document.querySelectorAll('.font-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.size === sizeKey);
      });
    }

    function updateProgressUI() {
      const allIds = getAllExerciseIds();
      const total = allIds.length;
      const doneCount = allIds.filter((id) => appState.completedExercises.includes(id)).length;
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;

      const textEl = document.getElementById('progressText');
      const barEl = document.getElementById('progressBar');
      const pctEl = document.getElementById('progressPercent');
      if (textEl) textEl.textContent = `已完成練習 ${doneCount} / ${total} 題`;
      if (barEl) barEl.style.width = `${pct}%`;
      if (pctEl) pctEl.textContent = `${pct}%`;
    }

    /* ==========================================================================
       導覽列渲染
       ========================================================================== */
    function getTabsMeta() {
      const tabs = [
        {
          id: 'diagnosis',
          label: COURSE_DATA.diagnosis.tabLabel,
          done: appState.reviewedSentences.length,
          total: COURSE_DATA.diagnosis.sentences.length,
          isComplete: appState.reviewedSentences.length >= COURSE_DATA.diagnosis.sentences.length
        }
      ];
      COURSE_DATA.weeks.forEach((w) => {
        const done = w.exercises.filter((ex) => appState.completedExercises.includes(ex.id)).length;
        const total = w.exercises.length;
        tabs.push({
          id: w.id,
          label: w.tabLabel,
          done,
          total,
          isComplete: done === total && total > 0
        });
      });
      return tabs;
    }

    function renderTabNav() {
      const nav = document.getElementById('tabNav');
      const tabs = getTabsMeta();
      nav.innerHTML = tabs.map((t) => `
        <button
          type="button"
          class="tab-pill ${appState.activeTab === t.id ? 'active' : ''} ${t.isComplete ? 'completed' : ''}"
          data-tab="${t.id}"
          aria-current="${appState.activeTab === t.id ? 'page' : 'false'}"
        >
          <span>${t.label}</span>
          <span class="tab-badge">${t.isComplete ? '✓' : `${t.done}/${t.total}`}</span>
        </button>
      `).join('');

      nav.querySelectorAll('.tab-pill').forEach((btn) => {
        btn.addEventListener('click', () => switchTab(btn.dataset.tab));
      });
    }

    function switchTab(tabId) {
      appState.activeTab = tabId;
      saveState();
      renderTabNav();
      renderMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ==========================================================================
       主視圖路由渲染
       ========================================================================== */
    function renderMain() {
      const container = document.getElementById('mainContent');
      if (appState.activeTab === 'diagnosis') {
        renderDiagnosisView(container);
      } else {
        const weekData = COURSE_DATA.weeks.find((w) => w.id === appState.activeTab) || COURSE_DATA.weeks[0];
        renderWeekView(container, weekData);
      }
    }

      // 綁定原文對照切換
      document.getElementById('btnToggleFullCompare').addEventListener('click', () => {

      container.querySelectorAll('.btn-toggle-diag').forEach((btn) => {

      const isReviewed = appState.reviewedSentences.includes(s.id);
      return `
        <article class="diag-card ${isReviewed ? 'is-reviewed' : ''}" data-id="${s.id}">

          </div>
          <section class="card">
            <p style="font-size:0.92rem;color:var(--color-text-secondary);margin-bottom:0.9rem;">
              寫完英文作文後，請切換成「雷達掃描模式」，逐項點選確認以下 6 大項目：
            </p>
            <ul class="sop-list" id="sopList">
              ${week.sopChecklist.map((item) => {
                const isChecked = appState.sopChecked.includes(item.id);
                return `
                  <li class="sop-item ${isChecked ? 'checked' : ''}" data-sop="${item.id}">
                    <input type="checkbox" class="sop-checkbox" ${isChecked ? 'checked' : ''} aria-label="${item.title}">
                    <div class="sop-text">
                      <strong>${item.title}</strong>
                      <span>${item.desc}</span>
                    </div>
                  </li>
                `;
              }).join('')}
            </ul>
          </section>

          <div class="section-header">
            <h3 class="section-title">終極綜合大考驗：12 處重度中式英文大改造</h3>
            <button type="button" class="btn btn-outline btn-sm" id="btnToggleFinalBoss">
              ${appState.showFinalBossCompare ? '隱藏完整前後對照' : '查看完整 12 處地雷與高分對照'}
            </button>
          </div>
          <section class="card">
            <span class="essay-label label-orig">挑戰原文（內藏 12 處前五週學過的經典錯誤）</span>
            <div class="essay-box" style="margin-bottom:${appState.showFinalBossCompare ? '1rem' : '0'};">
              <p>${appState.showFinalBossCompare ? week.finalChallengeAnnotatedHtml : escapeHtml(week.finalChallengeRaw)}</p>
            </div>
            ${appState.showFinalBossCompare ? `
              <span class="essay-label label-good">高分完整改造版（綠底標示為升級亮點）</span>
              <div class="essay-box">
                <p>${week.finalChallengeRewrittenHtml}</p>
              </div>
            ` : ''}
          </section>
        `;
      }

      // 互動實戰練習題區（所有週次共用渲染引擎）
      contentHtml += `
        <div class="section-header">
          <h3 class="section-title">${week.weekNum === 6 ? '逐句實戰改造（共 6 句，即時對答案）' : `第 ${week.weekNum} 週互動實戰練習（即時對答案＋解析）`}</h3>
        </div>
        <div id="exerciseList">
          ${week.exercises.map((ex, idx) => renderExerciseCardHtml(ex, idx)).join('')}
        </div>

        <!-- 上下頁導覽 -->
        <nav class="pager-nav" aria-label="上下單元導覽">
          <button type="button" class="btn btn-outline" id="btnPrevTab">${prevTab.label}</button>
          ${nextTab
            ? `<button type="button" class="btn btn-primary" id="btnNextTab">${nextTab.label}</button>`
            : `<button type="button" class="btn btn-primary" id="btnBackHome">🎉 完成六週計畫！回原文診斷室複習</button>`
          }
        </nav>
      `;

      container.innerHTML = contentHtml;

      // 綁定第 5 週遮罩模式
      const maskBtn = document.getElementById('btnToggleCollocationMask');
      if (maskBtn) {
        maskBtn.addEventListener('click', () => {
          appState.collocationMask = !appState.collocationMask;
          saveState();
          renderWeekView(container, week);
        });
        container.querySelectorAll('.td-right-mask').forEach((cell) => {
          cell.addEventListener('click', () => {
            if (appState.collocationMask) {
              cell.classList.toggle('revealed');
            }
          });
        });
      }

      // 綁定第 6 週 SOP 清單與終極對照切換
      const sopList = document.getElementById('sopList');
      if (sopList) {
        sopList.querySelectorAll('.sop-item').forEach((li) => {
          li.addEventListener('click', (e) => {
            const cb = li.querySelector('.sop-checkbox');
            if (e.target !== cb) cb.checked = !cb.checked;
            const id = li.dataset.sop;
            li.classList.toggle('checked', cb.checked);
            if (cb.checked) {
              if (!appState.sopChecked.includes(id)) appState.sopChecked.push(id);
            } else {
              appState.sopChecked = appState.sopChecked.filter((x) => x !== id);
            }
            saveState();
            const c = week.sopChecklist.filter((i) => appState.sopChecked.includes(i.id)).length;
            const counter = document.getElementById('sopCounter');
            if (counter) {
              counter.textContent = `已演練 ${c} / ${week.sopChecklist.length} 項`;
              counter.classList.toggle('done', c === week.sopChecklist.length);
            }
          });
        });
      }

      const finalBossBtn = document.getElementById('btnToggleFinalBoss');
      if (finalBossBtn) {
        finalBossBtn.addEventListener('click', () => {
          appState.showFinalBossCompare = !appState.showFinalBossCompare;
          saveState();
          renderWeekView(container, week);
        });
      }

      // 綁定所有互動題事件
      bindExerciseEvents(container, week.exercises);

      // 綁定上下頁按鈕
      document.getElementById('btnPrevTab').addEventListener('click', () => switchTab(prevTab.id));
      const nextBtn = document.getElementById('btnNextTab');
      if (nextBtn) nextBtn.addEventListener('click', () => switchTab(nextTab.id));
      const homeBtn = document.getElementById('btnBackHome');
      if (homeBtn) homeBtn.addEventListener('click', () => switchTab('diagnosis'));
    }

    /* ==========================================================================
       互動練習題渲染引擎（支援 5 種題型）
       ========================================================================== */
    function renderExerciseCardHtml(ex, idx) {
      const isDone = appState.completedExercises.includes(ex.id);
      let bodyHtml = '';

      if (ex.type === 'rewrite') {
        bodyHtml = `
          <div class="ex-prompt">
            ${escapeHtml(ex.instruction)}
            ${ex.original ? `<span class="orig-pill">${escapeHtml(ex.original)}</span>` : ''}
          </div>
          <input type="text" class="ex-input" placeholder="在此輸入你修改或翻譯後的完整英文句子…" autocomplete="off" spellcheck="false" aria-label="作答輸入框">
          <div class="ex-actions">
            <button type="button" class="btn btn-primary btn-sm btn-check">檢查答案</button>
            ${ex.hint ? `<button type="button" class="btn btn-outline btn-sm btn-hint">給點提示</button>` : ''}
            <button type="button" class="btn btn-ghost btn-sm btn-reveal">看參考解答與解析</button>
          </div>
        `;
      } else if (ex.type === 'choice') {
        bodyHtml = `
          <div class="ex-prompt">
            ${escapeHtml(ex.instruction)}
            <span class="orig-pill" style="background:var(--color-bg);border-color:var(--color-border-strong);color:var(--color-text);">${escapeHtml(ex.original)}</span>
          </div>
          <div class="choice-group">
            ${ex.options.map((opt) => `<button type="button" class="choice-btn" data-opt="${escapeHtml(opt)}">${escapeHtml(opt)}</button>`).join('')}
          </div>
        `;
      } else if (ex.type === 'unscramble') {
        bodyHtml = `
          <div class="ex-prompt">${escapeHtml(ex.instruction)}</div>
          <div class="tile-dropzone empty" aria-label="你的句型排列區"></div>
          <div class="tile-pool" aria-label="可點選詞塊區">
            ${ex.tiles.map((t, tIdx) => `<button type="button" class="word-tile" data-tidx="${tIdx}" data-word="${escapeHtml(t)}">${escapeHtml(t)}</button>`).join('')}
          </div>
          <div class="ex-actions">
            <button type="button" class="btn btn-primary btn-sm btn-check">檢查排列</button>
            <button type="button" class="btn btn-outline btn-sm btn-clear-tiles">重新排列</button>
            <button type="button" class="btn btn-ghost btn-sm btn-reveal">看參考解答與解析</button>
          </div>
        `;
      } else if (ex.type === 'dual-select') {
        let sentenceHtml = '';
        ex.parts.forEach((part, pIdx) => {
          sentenceHtml += escapeHtml(part);
          if (pIdx < ex.selects.length) {
            const sel = ex.selects[pIdx];
            sentenceHtml += `
              <select class="inline-select" data-sidx="${pIdx}" aria-label="第 ${pIdx + 1} 格選單">
                <option value="">-- 請選擇 --</option>
                ${sel.options.map((o) => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('')}
              </select>
            `;
          }
        });
        bodyHtml = `
          <div class="ex-prompt">${escapeHtml(ex.instruction)}</div>
          <div class="inline-sentence">${sentenceHtml}</div>
          <div class="ex-actions">
            <button type="button" class="btn btn-primary btn-sm btn-check">檢查答案</button>
            <button type="button" class="btn btn-ghost btn-sm btn-reveal">看參考解答與解析</button>
          </div>
        `;
      } else if (ex.type === 'fill-blanks') {
        let sentenceHtml = '';
        ex.parts.forEach((part, pIdx) => {
          sentenceHtml += escapeHtml(part);
          if (pIdx < ex.blanks.length) {
            const b = ex.blanks[pIdx];
            sentenceHtml += `<input type="text" class="inline-blank" data-bidx="${pIdx}" placeholder="${escapeHtml(b.cue)}" autocomplete="off" spellcheck="false" aria-label="${escapeHtml(b.cue)}"><span class="zh-cue">(${escapeHtml(b.cue)})</span>`;
          }
        });
        bodyHtml = `
          <div class="ex-prompt">${escapeHtml(ex.instruction)}</div>
          <div class="inline-sentence">${sentenceHtml}</div>
          <div class="ex-actions">
            <button type="button" class="btn btn-primary btn-sm btn-check">檢查答案</button>
            <button type="button" class="btn btn-ghost btn-sm btn-reveal">看參考解答與解析</button>
          </div>
        `;
      }

      return `
        <article class="exercise-card ${isDone ? 'state-correct' : ''}" data-exid="${ex.id}">
          <div class="ex-header">
            <span class="ex-num">練習 ${idx + 1}</span>
            <span class="ex-status ${isDone ? 'done' : ''}">${isDone ? '✓ 已完成' : ''}</span>
          </div>
          ${bodyHtml}
          <div class="feedback-box" role="status" aria-live="polite"></div>
        </article>
      `;
    }

    /* ==========================================================================
       互動練習題事件綁定與批改邏輯
       ========================================================================== */
    function bindExerciseEvents(container, exercises) {
      const exMap = {};
      exercises.forEach((ex) => { exMap[ex.id] = ex; });

      container.querySelectorAll('.exercise-card').forEach((card) => {
        const ex = exMap[card.dataset.exid];
        if (!ex) return;
        const feedback = card.querySelector('.feedback-box');
        const statusBadge = card.querySelector('.ex-status');

        function setCardDoneUI() {
          card.classList.remove('state-wrong');
          card.classList.add('state-correct');
          if (statusBadge) {
            statusBadge.textContent = '✓ 已完成';
            statusBadge.classList.add('done');
          }
          markExerciseDone(ex.id);
        }

        function showFeedback(kind, title, htmlBody) {
          feedback.className = `feedback-box show is-${kind}`;
          feedback.innerHTML = `<span class="feedback-title">${title}</span>${htmlBody}`;
        }

        // ---- 題型 1：文字改寫／翻譯題 ----
        if (ex.type === 'rewrite') {
          const input = card.querySelector('.ex-input');
          const checkBtn = card.querySelector('.btn-check');
          const hintBtn = card.querySelector('.btn-hint');
          const revealBtn = card.querySelector('.btn-reveal');

          function runCheck() {
            const val = input.value.trim();
            if (!val) {
              showFeedback('retry', '尚未輸入答案', '請先試著在輸入框寫出你的改寫句子，再點選檢查喔！');
              input.focus();
              return;
            }
            if (isAnswerMatch(val, ex.acceptedAnswers)) {
              setCardDoneUI();
              showFeedback(
                'correct',
                '🎉 完全正確！寫得非常自然！',
                `<span class="model-answer">參考範句：${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`
              );
            } else {
              card.classList.add('state-wrong');
              showFeedback(
                'retry',
                '💡 再微調一下，或核對參考解答',
                `<div>你的句子與預設範本略有不同（若為語意相通的自由改寫，也可點選「看參考解答與解析」核對關鍵結構）。</div>`
              );
            }
          }

          checkBtn.addEventListener('click', runCheck);
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') runCheck();
          });

          if (hintBtn) {
            hintBtn.addEventListener('click', () => {
              showFeedback('reveal', '💡 破題提示', `<div>${escapeHtml(ex.hint)}</div>`);
            });
          }

          revealBtn.addEventListener('click', () => {
            showFeedback(
              'reveal',
              '📖 參考解答與文法解析',
              `<span class="model-answer">${escapeHtml(ex.modelAnswer)}</span>
               <div style="margin-bottom:0.65rem;"><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>
               <button type="button" class="btn btn-outline btn-sm btn-self-mark">我已核對並理解，標記這題完成 ✓</button>`
            );
            const selfMark = feedback.querySelector('.btn-self-mark');
            if (selfMark) {
              selfMark.addEventListener('click', () => {
                setCardDoneUI();
                selfMark.remove();
              });
            }
          });
        }

        // ---- 題型 2：即時選擇題 ----
        if (ex.type === 'choice') {
          const buttons = card.querySelectorAll('.choice-btn');
          buttons.forEach((btn) => {
            btn.addEventListener('click', () => {
              buttons.forEach((b) => b.classList.remove('selected-correct', 'selected-wrong'));
              const chosen = btn.dataset.opt;
              if (chosen === ex.answer) {
                btn.classList.add('selected-correct');
                setCardDoneUI();
                showFeedback('correct', `🎉 答對了！答案是 ${escapeHtml(ex.answer)}`, `<div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
              } else {
                btn.classList.add('selected-wrong');
                card.classList.add('state-wrong');
                showFeedback('retry', '❌ 再想一下喔！', '觀察一下空格後面是「完整句子（主詞＋動詞）」還是「名詞片語」呢？');
              }
            });
          });
        }

        // ---- 題型 3：詞塊點擊重組題 ----
        if (ex.type === 'unscramble') {
          const dropzone = card.querySelector('.tile-dropzone');
          const poolBtns = card.querySelectorAll('.tile-pool .word-tile');
          const checkBtn = card.querySelector('.btn-check');
          const clearBtn = card.querySelector('.btn-clear-tiles');
          const revealBtn = card.querySelector('.btn-reveal');
          let selectedTiles = []; // [{ tidx, word }]

          function renderDropzone() {
            dropzone.innerHTML = '';
            dropzone.classList.toggle('empty', selectedTiles.length === 0);
            selectedTiles.forEach((item, orderIdx) => {
              const chip = document.createElement('button');
              chip.type = 'button';
              chip.className = 'word-tile in-answer';
              chip.textContent = item.word;
              chip.title = '點擊移回詞塊區';
              chip.addEventListener('click', () => {
                selectedTiles.splice(orderIdx, 1);
                const poolBtn = card.querySelector(`.tile-pool .word-tile[data-tidx="${item.tidx}"]`);
                if (poolBtn) poolBtn.classList.remove('used');
                renderDropzone();
              });
              dropzone.appendChild(chip);
            });
          }

          poolBtns.forEach((pBtn) => {
            pBtn.addEventListener('click', () => {
              const tidx = pBtn.dataset.tidx;
              const word = pBtn.dataset.word;
              pBtn.classList.add('used');
              selectedTiles.push({ tidx, word });
              renderDropzone();
            });
          });

          clearBtn.addEventListener('click', () => {
            selectedTiles = [];
            poolBtns.forEach((b) => b.classList.remove('used'));
            renderDropzone();
            feedback.className = 'feedback-box';
          });

          checkBtn.addEventListener('click', () => {
            if (selectedTiles.length < ex.tiles.length) {
              showFeedback('retry', '詞塊還沒排完喔！', '請把下方所有詞塊都點選進來，組成完整句子再檢查。');
              return;
            }
            const joined = selectedTiles.map((x) => x.word).join(' ');
            if (isAnswerMatch(joined, ex.acceptedAnswers)) {
              setCardDoneUI();
              showFeedback('correct', '🎉 語序完全正確！', `<span class="model-answer">${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
            } else {
              card.classList.add('state-wrong');
              showFeedback('retry', '❌ 順序還差一點點！', '記得英文口訣：「主詞＋動詞＋受詞」放前面，「地點＋時間」擺句尾喔！點擊上方的詞塊可以移回重排。');
            }
          });

          revealBtn.addEventListener('click', () => {
            showFeedback('reveal', '📖 參考解答與解析', `<span class="model-answer">${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
          });
        }

        // ---- 題型 4：句中雙下拉選單 ----
        if (ex.type === 'dual-select') {
          const selects = card.querySelectorAll('.inline-select');
          const checkBtn = card.querySelector('.btn-check');
          const revealBtn = card.querySelector('.btn-reveal');

          checkBtn.addEventListener('click', () => {
            let allFilled = true;
            let allCorrect = true;
            selects.forEach((sel, idx) => {
              if (!sel.value) allFilled = false;
              if (sel.value !== ex.selects[idx].answer) allCorrect = false;
            });

            if (!allFilled) {
              showFeedback('retry', '請完成所有選單', '請先幫每一個空格選出答案再檢查喔！');
              return;
            }
            if (allCorrect) {
              setCardDoneUI();
              showFeedback('correct', '🎉 兩格全對！', `<span class="model-answer">${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
            } else {
              card.classList.add('state-wrong');
              showFeedback('retry', '❌ 有一格選反囉！', '記得：主詞是「人（感到……）」用 -ed，主詞是「事物（令人……）」用 -ing。');
            }
          });

          revealBtn.addEventListener('click', () => {
            showFeedback('reveal', '📖 參考解答與解析', `<span class="model-answer">${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
          });
        }

        // ---- 題型 5：句中多格填空題 ----
        if (ex.type === 'fill-blanks') {
          const blanks = card.querySelectorAll('.inline-blank');
          const checkBtn = card.querySelector('.btn-check');
          const revealBtn = card.querySelector('.btn-reveal');

          function runBlankCheck() {
            let allFilled = true;
            let allCorrect = true;
            blanks.forEach((inp, idx) => {
              const val = inp.value.trim();
              if (!val) allFilled = false;
              const accepted = ex.blanks[idx].accepted;
              if (!isAnswerMatch(val, accepted)) allCorrect = false;
            });

            if (!allFilled) {
              showFeedback('retry', '還有空格沒填喔！', '請填完句子裡的所有空格再點選檢查。');
              return;
            }
            if (allCorrect) {
              setCardDoneUI();
              showFeedback('correct', '🎉 搭配詞完全正確！', `<span class="model-answer">參考答案：${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
            } else {
              card.classList.add('state-wrong');
              showFeedback('retry', '💡 再檢查一下搭配詞拼字！', '可以往上翻閱 20 大搭配詞對照表，或點選「看參考解答與解析」。');
            }
          }

          checkBtn.addEventListener('click', runBlankCheck);
          blanks.forEach((inp) => {
            inp.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') runBlankCheck();
            });
          });

          revealBtn.addEventListener('click', () => {
            showFeedback('reveal', '📖 參考解答與解析', `<span class="model-answer">參考答案：${escapeHtml(ex.modelAnswer)}</span><div><strong>解析：</strong>${escapeHtml(ex.explanation)}</div>`);
          });
        }
      });
    }

    /* ==========================================================================
       初始化與全域控制事件（字級切換、重設確認彈窗）
       ========================================================================== */
    function initApp() {
      // 套用儲存的字體大小
      applyFontSize(appState.fontSize);

      // 綁定字體大小按鈕
      document.querySelectorAll('.font-btn').forEach((btn) => {
        btn.addEventListener('click', () => applyFontSize(btn.dataset.size));
      });

      // 綁定重設進度客製化彈窗
      const resetModal = document.getElementById('resetModal');
      document.getElementById('btnResetProgress').addEventListener('click', () => {
        resetModal.classList.add('open');
      });
      document.getElementById('btnCancelReset').addEventListener('click', () => {
        resetModal.classList.remove('open');
      });
      resetModal.addEventListener('click', (e) => {
        if (e.target === resetModal) resetModal.classList.remove('open');
      });
      document.getElementById('btnConfirmReset').addEventListener('click', () => {
        const keepFont = appState.fontSize;
        appState = { ...DEFAULT_STATE, fontSize: keepFont };
        saveState();
        resetModal.classList.remove('open');
        updateProgressUI();
        renderTabNav();
        renderMain();
      });

      // 首次渲染
      updateProgressUI();
      renderTabNav();
      renderMain();
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
