<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 外語家教 - 翻譯練習</title>
  <style>
    :root {
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --primary: #3b6ef6;
      --primary-hover: #2855d4;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #222222;
      --bubble-tutor: #fffdf5;
      --bubble-user: #eef4ff;
      --shadow-comic: 4px 4px 0px #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 6px 6px 0px var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 頂部列與 API 設定面板 */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #d1d5db;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 2px 2px 0px var(--border-color);
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #f3f4f6;
    }

    .api-panel {
      background: #f9fafb;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .api-panel.open {
      display: flex;
    }

    .api-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .api-input,
    .api-select {
      flex: 1;
      min-width: 180px;
      padding: 9px 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text-main);
    }

    .api-hint {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .status-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      min-height: 1.2em;
    }

    /* Tutor 角色與控制區 */
    .tutor-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .avatar-frame {
      width: 280px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      background: #e5e7eb;
      box-shadow: var(--shadow-comic);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .lang-select {
      padding: 9px 12px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      background: #fff;
      color: var(--text-main);
      box-shadow: 2px 2px 0px var(--border-color);
      cursor: pointer;
    }

    /* 漫畫風格 Speech Bubble（Tutor） */
    .speech-bubble {
      position: relative;
      width: 100%;
      background: var(--bubble-tutor);
      border: 2.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow-comic);
      min-height: 84px;
      font-size: 1.05rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .speech-bubble.tutor-bubble::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 12px solid var(--border-color);
    }

    .speech-bubble.tutor-bubble::after {
      content: "";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 10px solid var(--bubble-tutor);
    }

    /* 使用者輸入區塊：[Me/私/Yo/나/Io] + [Speech Bubble 輸入框（左側有尖角指向 Me）] + [送出] */
    .user-section {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .user-badge {
      min-width: 58px;
      height: 52px;
      padding: 0 12px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: #fef3c7;
      box-shadow: 3px 3px 0px var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      user-select: none;
      flex-shrink: 0;
    }

    .user-bubble-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }

    /* 指向左側 Me 的小尖角 */
    .user-bubble-wrapper::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 12px solid var(--border-color);
      z-index: 2;
      pointer-events: none;
    }

    .user-bubble-wrapper::after {
      content: "";
      position: absolute;
      left: -9px;
      top: 50%;
      transform: translateY(-50%);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 10px solid var(--bubble-user);
      z-index: 3;
      pointer-events: none;
    }

    .user-bubble-input {
      width: 100%;
      min-height: 68px;
      max-height: 160px;
      padding: 12px 14px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: var(--bubble-user);
      box-shadow: 3px 3px 0px var(--border-color);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      color: var(--text-main);
    }

    .user-bubble-input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    .send-btn {
      height: 52px;
      padding: 0 18px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      flex-shrink: 0;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .send-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 手機版響應式調整 */
    @media (max-width: 600px) {
      .app-container {
        padding: 14px;
        border-radius: 14px;
      }

      .user-section {
        flex-wrap: wrap;
        gap: 10px;
      }

      .user-badge {
        min-width: 50px;
        height: 44px;
        font-size: 1rem;
      }

      .user-bubble-wrapper {
        width: calc(100% - 64px);
        flex: none;
      }

      .send-btn {
        width: 100%;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部列 -->
    <header class="top-bar">
      <div class="app-title">
        <span>🌐 AI 外語家教</span>
      </div>
      <button id="toggleApiBtn" class="btn btn-secondary" type="button">⚙️ API 設定</button>
    </header>

    <!-- 本地 API 設定區（存在使用者本機 localStorage） -->
    <section id="apiPanel" class="api-panel" aria-label="API 設定">
      <div class="api-row">
        <input
          id="apiKeyInput"
          class="api-input"
          type="password"
          placeholder="貼上你的 Gemini API Key（僅保存在此裝置瀏覽器）"
          autocomplete="off"
        />
        <button id="saveApiBtn" class="btn btn-primary" type="button">儲存金鑰</button>
        <button id="clearApiBtn" class="btn btn-secondary" type="button">清除</button>
      </div>

      <div class="api-row">
        <input
          id="modelInput"
          class="api-input"
          type="text"
          placeholder="模型名稱（例如 gemini-3.8-flash）"
        />
        <select id="apiModeSelect" class="api-select" aria-label="API 呼叫模式">
          <option value="generateContent">GenerateContent API</option>
          <option value="interactions">Interactions API</option>
        </select>
        <button id="detectModelsBtn" class="btn btn-secondary" type="button">偵測可用模型</button>
      </div>

      <div id="detectedModelsRow" class="api-row" style="display: none;">
        <select id="detectedModelsSelect" class="api-select" aria-label="選擇偵測到的模型"></select>
        <button id="applyModelBtn" class="btn btn-secondary" type="button">套用此模型</button>
      </div>

      <p class="api-hint">
        金鑰與模型設定僅保存在你的瀏覽器本機（<code>localStorage</code>）。若未來模型更新，可直接修改上方模型名稱或按「偵測可用模型」取得最新模型清單。
      </p>
    </section>

    <!-- Tutor 形象、語言選擇、開始對話與 Speech Bubble -->
    <main class="tutor-section">
      <div class="avatar-frame">
        <!-- 圖檔空位：部署至 GitHub 時，請將兩張 GIF 放在與本 HTML 相同路徑 -->
        <img id="tutorAvatar" src="./female 1.1.gif" alt="Tutor 形象" />
      </div>

      <div class="controls-row">
        <button id="startChatBtn" class="btn btn-primary" type="button">開始對話</button>
        <select id="targetLangSelect" class="lang-select" aria-label="選擇目標語言">
          <!-- 選項由語言設定表動態產生，預設為英文 -->
        </select>
      </div>

      <div id="tutorBubble" class="speech-bubble tutor-bubble">
        點擊「開始對話」與家教打招呼，或在下方輸入中文句子進行翻譯練習吧！
      </div>

      <div id="statusText" class="status-text" role="status" aria-live="polite"></div>
    </main>

    <!-- 使用者 Speech Bubble 區塊 -->
    <section class="user-section" aria-label="輸入要翻譯的中文">
      <div id="userSelfLabel" class="user-badge">Me</div>
      <div class="user-bubble-wrapper">
        <textarea
          id="userInput"
          class="user-bubble-input"
          placeholder="請輸入想翻譯的繁體中文或中文句子..."
        ></textarea>
      </div>
      <button id="sendBtn" class="send-btn" type="button">送出</button>
    </section>
  </div>

  <script>
    /**
     * =========================================================================
     * 1. 可擴充設定區（未來新增角色、語言、功能模組皆可在此擴充）
     * =========================================================================
     */
    const APP_CONFIG = {
      defaultLanguage: "en",
      storageKeys: {
        apiKey: "ai_tutor_gemini_api_key_v1",
        model: "ai_tutor_gemini_model_v1",
        apiMode: "ai_tutor_gemini_api_mode_v1",
        language: "ai_tutor_target_lang_v1",
        characterId: "ai_tutor_character_id_v1"
      },
      gemini: {
        defaultModel: "gemini-3.8-flash",
        defaultMode: "generateContent",
        endpointBase: "https://generativelanguage.googleapis.com/v1beta"
      }
    };

    /**
     * 角色註冊表（Character Registry）
     * 未來要新增新角色時，只需在這裡新增一筆設定即可。
     */
    const CHARACTER_REGISTRY = {
      female_1: {
        id: "female_1",
        name: "Female 1",
        images: {
          idle: "./female 1.1.gif",     // 預設／待機圖檔空位
          speaking: "./female 1.2.gif"  // TTS 說話中圖檔空位
        },
        ttsConfig: {
          zhLang: "zh-TW",
          pitch: 1.05,
          rate: 1.0
        }
      }
    };

    /**
     * 語言註冊表（Language Registry）
     * 預設為英文（en），左側顯示對應字形：Me / 私 / Yo / 나 / Io
     */
    const LANGUAGE_REGISTRY = {
      en: {
        code: "en",
        label: "英文",
        selfWord: "Me",
        ttsLang: "en-US",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      ja: {
        code: "ja",
        label: "日文",
        selfWord: "私",
        ttsLang: "ja-JP",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      es: {
        code: "es",
        label: "西班牙文",
        selfWord: "Yo",
        ttsLang: "es-ES",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      ko: {
        code: "ko",
        label: "韓文",
        selfWord: "나",
        ttsLang: "ko-KR",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      it: {
        code: "it",
        label: "義大利文",
        selfWord: "Io",
        ttsLang: "it-IT",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      }
    };

    /**
     * =========================================================================
     * 2. 儲存與狀態管理（State & Storage Manager）
     * =========================================================================
     */
    const StorageManager = {
      getApiKey() {
        return (localStorage.getItem(APP_CONFIG.storageKeys.apiKey) || "").trim();
      },
      setApiKey(key) {
        localStorage.setItem(APP_CONFIG.storageKeys.apiKey, (key || "").trim());
      },
      clearApiKey() {
        localStorage.removeItem(APP_CONFIG.storageKeys.apiKey);
      },
      getModel() {
        const saved = (localStorage.getItem(APP_CONFIG.storageKeys.model) || "").trim();
        return saved || APP_CONFIG.gemini.defaultModel;
      },
      setModel(modelName) {
        const clean = (modelName || "").trim() || APP_CONFIG.gemini.defaultModel;
        localStorage.setItem(APP_CONFIG.storageKeys.model, clean);
      },
      getApiMode() {
        const saved = localStorage.getItem(APP_CONFIG.storageKeys.apiMode);
        return saved === "interactions" ? "interactions" : APP_CONFIG.gemini.defaultMode;
      },
      setApiMode(mode) {
        localStorage.setItem(
          APP_CONFIG.storageKeys.apiMode,
          mode === "interactions" ? "interactions" : "generateContent"
        );
      },
      getLanguage() {
        const saved = localStorage.getItem(APP_CONFIG.storageKeys.language);
        return LANGUAGE_REGISTRY[saved] ? saved : APP_CONFIG.defaultLanguage;
      },
      setLanguage(langCode) {
        if (LANGUAGE_REGISTRY[langCode]) {
          localStorage.setItem(APP_CONFIG.storageKeys.language, langCode);
        }
      },
      getCharacterId() {
        const saved = localStorage.getItem(APP_CONFIG.storageKeys.characterId);
        return CHARACTER_REGISTRY[saved] ? saved : "female_1";
      }
    };

    const AppState = {
      characterId: StorageManager.getCharacterId(),
      languageCode: StorageManager.getLanguage(),
      isSpeaking: false,
      isTranslating: false
    };

    /**
     * =========================================================================
     * 3. 角色與圖片控制器（Avatar Controller）
     * =========================================================================
     */
    const AvatarController = {
      getCurrentCharacter() {
        return CHARACTER_REGISTRY[AppState.characterId] || CHARACTER_REGISTRY.female_1;
      },
      preloadImages() {
        Object.values(CHARACTER_REGISTRY).forEach((charConfig) => {
          [charConfig.images.idle, charConfig.images.speaking].forEach((src) => {
            if (!src) return;
            const img = new Image();
            img.src = src;
          });
        });
      },
      setSpeakingState(speaking) {
        AppState.isSpeaking = Boolean(speaking);
        const charConfig = this.getCurrentCharacter();
        const imgEl = document.getElementById("tutorAvatar");
        if (!imgEl) return;

        const targetSrc = AppState.isSpeaking
          ? charConfig.images.speaking
          : charConfig.images.idle;

        if (imgEl.getAttribute("src") !== targetSrc) {
          imgEl.setAttribute("src", targetSrc);
        }
      }
    };

    /**
     * =========================================================================
     * 4. 文字轉語音模組（TTS Service）
     * =========================================================================
     */
    const TTSService = {
      speak(text, langCode = "zh-TW") {
        const cleanText = (text || "").trim();
        if (!cleanText) return Promise.resolve();

        if (!("speechSynthesis" in window)) {
          AvatarController.setSpeakingState(false);
          return Promise.resolve();
        }

        // 只在正在朗讀或排隊中才取消，避免部分瀏覽器 cancel() 後立即 speak() 失效
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
        }

        return new Promise((resolve) => {
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = langCode;

          const charConfig = AvatarController.getCurrentCharacter();
          utterance.pitch = charConfig.ttsConfig?.pitch ?? 1.05;
          utterance.rate = charConfig.ttsConfig?.rate ?? 1.0;

          const voices = window.speechSynthesis.getVoices();
          const matchedVoice =
            voices.find((v) => v.lang && v.lang.toLowerCase() === langCode.toLowerCase()) ||
            voices.find(
              (v) => v.lang && v.lang.toLowerCase().startsWith(langCode.split("-")[0].toLowerCase())
            );
          if (matchedVoice) {
            utterance.voice = matchedVoice;
          }

          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(safetyTimer);
            AvatarController.setSpeakingState(false);
            resolve();
          };

          utterance.onstart = () => {
            AvatarController.setSpeakingState(true);
          };

          utterance.onend = finish;
          utterance.onerror = finish;

          const estimatedMs = Math.max(2600, cleanText.length * 160 + 2000);
          const safetyTimer = setTimeout(finish, estimatedMs);

          // 立即切至說話狀態，確保視覺同步
          AvatarController.setSpeakingState(true);
          window.speechSynthesis.speak(utterance);
        });
      }
    };

    /**
     * =========================================================================
     * 5. AI 翻譯與動態模型查詢模組（Translation & Model Service）
     * =========================================================================
     */
    const TranslationService = {
      buildPrompt(sourceText, langInfo) {
        return [
          `你是一位親切的外語家教。請將以下輸入的中文句子翻譯成自然道地的${langInfo.label}。`,
          `規則：只輸出翻譯後的${langInfo.label}內容，不要加多餘解釋、引號或前綴。`,
          `原文：${sourceText}`
        ].join("\n");
      },

      async listAvailableModels(apiKey) {
        const cleanKey = (apiKey || "").trim();
        if (!cleanKey) {
          throw new Error("請先輸入 Gemini API Key 再偵測模型。");
        }

        const url = `${APP_CONFIG.gemini.endpointBase}/models?key=${encodeURIComponent(cleanKey)}`;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`無法取得模型清單（HTTP ${response.status}）`);
        }

        const data = await response.json();
        const models = (data.models || [])
          .map((m) => (m.name || "").replace(/^models\//, ""))
          .filter((name) => name.includes("gemini"));

        return models;
      },

      async translateChineseToTarget(sourceText, targetLangKey) {
        const apiKey = StorageManager.getApiKey();
        if (!apiKey) {
          throw new Error("尚未設定 Gemini API Key，請先點擊右上角「API 設定」輸入並儲存金鑰。");
        }

        const model = StorageManager.getModel();
        const mode = StorageManager.getApiMode();
        const langInfo = LANGUAGE_REGISTRY[targetLangKey] || LANGUAGE_REGISTRY.en;
        const prompt = this.buildPrompt(sourceText, langInfo);

        let url = "";
        let payload = null;

        if (mode === "interactions") {
          url = `${APP_CONFIG.gemini.endpointBase}/interactions?key=${encodeURIComponent(apiKey)}`;
          payload = {
            model,
            input: prompt
          };
        } else {
          url = `${APP_CONFIG.gemini.endpointBase}/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;
          payload = {
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ]
          };
        }

        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          let errMsg = `API 請求失敗（HTTP ${response.status}）`;
          try {
            const errData = await response.json();
            if (errData?.error?.message) {
              errMsg = `API 錯誤：${errData.error.message}`;
            }
          } catch (_) {
            // 忽略 JSON 解析失敗
          }
          throw new Error(errMsg);
        }

        const data = await response.json();

        // 同時相容 generateContent 與 interactions 常見輸出結構
        let resultText = "";
        if (Array.isArray(data?.candidates)) {
          resultText = data.candidates[0]?.content?.parts
            ?.map((part) => part.text || "")
            .join("")
            .trim() || "";
        }

        if (!resultText && Array.isArray(data?.outputs)) {
          resultText = data.outputs
            .map((item) => item?.text || item?.content || "")
            .join("")
            .trim();
        }

        if (!resultText && typeof data?.output === "string") {
          resultText = data.output.trim();
        }

        if (!resultText) {
          throw new Error("API 回傳內容為空，請再試一次。");
        }

        return resultText;
      }
    };

    /**
     * =========================================================================
     * 6. 介面渲染與事件綁定（UI Controller）
     * =========================================================================
     */
    const UIController = {
      initLanguageSelect() {
        const selectEl = document.getElementById("targetLangSelect");
        selectEl.innerHTML = "";

        Object.values(LANGUAGE_REGISTRY).forEach((lang) => {
          const option = document.createElement("option");
          option.value = lang.code;
          option.textContent = lang.label;
          selectEl.appendChild(option);
        });

        selectEl.value = AppState.languageCode;
      },

      syncLanguageUI() {
        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        const selfBadgeEl = document.getElementById("userSelfLabel");
        if (selfBadgeEl) {
          selfBadgeEl.textContent = langInfo.selfWord;
        }
      },

      setStatus(msg) {
        const statusEl = document.getElementById("statusText");
        if (statusEl) statusEl.textContent = msg || "";
      },

      setTutorBubble(text) {
        const bubbleEl = document.getElementById("tutorBubble");
        if (bubbleEl) bubbleEl.textContent = text;
      },

      setBusy(busy) {
        AppState.isTranslating = busy;
        document.getElementById("sendBtn").disabled = busy;
        document.getElementById("startChatBtn").disabled = busy;
        document.getElementById("targetLangSelect").disabled = busy;
      },

      closeApiPanel() {
        document.getElementById("apiPanel").classList.remove("open");
      },

      async handleStartChat() {
        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        const greetingText = langInfo.greeting(langInfo.label);

        this.setTutorBubble(greetingText);
        this.setStatus("家教正在說話...");

        const charConfig = AvatarController.getCurrentCharacter();
        await TTSService.speak(greetingText, charConfig.ttsConfig?.zhLang || "zh-TW");
        this.setStatus("");
      },

      async handleSendTranslation() {
        const inputEl = document.getElementById("userInput");
        const sourceText = inputEl.value.trim();

        if (!sourceText) {
          this.setStatus("請先輸入想要翻譯的中文句子。");
          inputEl.focus();
          return;
        }

        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        this.setBusy(true);
        this.setStatus(`正在翻譯成${langInfo.label}...`);

        try {
          const translatedText = await TranslationService.translateChineseToTarget(
            sourceText,
            AppState.languageCode
          );

          this.setTutorBubble(translatedText);
          this.setStatus(`已翻譯成${langInfo.label}，正在朗讀...`);

          await TTSService.speak(translatedText, langInfo.ttsLang);
          this.setStatus("");
        } catch (error) {
          this.setTutorBubble(`⚠️ ${error.message}`);
          this.setStatus("");
          AvatarController.setSpeakingState(false);
        } finally {
          this.setBusy(false);
        }
      },

      async handleDetectModels() {
        const apiKeyInput = document.getElementById("apiKeyInput");
        const modelInput = document.getElementById("modelInput");
        const currentKey = apiKeyInput.value.trim() || StorageManager.getApiKey();

        this.setStatus("正在查詢可用模型...");
        try {
          const models = await TranslationService.listAvailableModels(currentKey);
          const rowEl = document.getElementById("detectedModelsRow");
          const selectEl = document.getElementById("detectedModelsSelect");

          if (!models.length) {
            this.setStatus("未找到可用的 Gemini 模型。");
            return;
          }

          selectEl.innerHTML = "";
          models.forEach((m) => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            selectEl.appendChild(opt);
          });

          if (models.includes(modelInput.value.trim())) {
            selectEl.value = modelInput.value.trim();
          }

          rowEl.style.display = "flex";
          this.setStatus(`已偵測到 ${models.length} 個模型，可選擇後套用。`);
        } catch (err) {
          this.setStatus(`⚠️ ${err.message}`);
        }
      },

      bindEvents() {
        const apiKeyInput = document.getElementById("apiKeyInput");
        const modelInput = document.getElementById("modelInput");
        const apiModeSelect = document.getElementById("apiModeSelect");

        apiKeyInput.value = StorageManager.getApiKey();
        modelInput.value = StorageManager.getModel();
        apiModeSelect.value = StorageManager.getApiMode();

        document.getElementById("toggleApiBtn").addEventListener("click", () => {
          document.getElementById("apiPanel").classList.toggle("open");
        });

        // 儲存金鑰與模型設定後，自動收合面板
        document.getElementById("saveApiBtn").addEventListener("click", () => {
          StorageManager.setApiKey(apiKeyInput.value);
          StorageManager.setModel(modelInput.value);
          StorageManager.setApiMode(apiModeSelect.value);

          apiKeyInput.value = StorageManager.getApiKey();
          modelInput.value = StorageManager.getModel();
          this.closeApiPanel();
          this.setStatus("已儲存 API 設定並收合視窗。");
        });

        document.getElementById("clearApiBtn").addEventListener("click", () => {
          StorageManager.clearApiKey();
          apiKeyInput.value = "";
          this.setStatus("已清除本機儲存的 API Key。");
        });

        apiModeSelect.addEventListener("change", (e) => {
          StorageManager.setApiMode(e.target.value);
        });

        document.getElementById("detectModelsBtn").addEventListener("click", () => {
          this.handleDetectModels();
        });

        document.getElementById("applyModelBtn").addEventListener("click", () => {
          const selectedModel = document.getElementById("detectedModelsSelect").value;
          if (selectedModel) {
            modelInput.value = selectedModel;
            StorageManager.setModel(selectedModel);
            this.setStatus(`已套用模型：${selectedModel}`);
          }
        });

        document.getElementById("targetLangSelect").addEventListener("change", (e) => {
          AppState.languageCode = e.target.value;
          StorageManager.setLanguage(AppState.languageCode);
          this.syncLanguageUI();
        });

        document.getElementById("startChatBtn").addEventListener("click", () => {
          this.handleStartChat();
        });

        document.getElementById("sendBtn").addEventListener("click", () => {
          this.handleSendTranslation();
        });

        document.getElementById("userInput").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!AppState.isTranslating) {
              this.handleSendTranslation();
            }
          }
        });

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      },

      init() {
        AvatarController.preloadImages();
        this.initLanguageSelect();
        this.syncLanguageUI();
        AvatarController.setSpeakingState(false);
        this.bindEvents();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      UIController.init();
    });
  </script>
</body>
</html>
