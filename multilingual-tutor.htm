<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 外語家教 - 翻譯練習</title>
  <style>
    :root {
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --primary: #3b6ef6;
      --primary-hover: #2855d4;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #222222;
      --bubble-tutor: #fffdf5;
      --bubble-user: #eef4ff;
      --shadow-comic: 4px 4px 0px #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 18px;
      box-shadow: 6px 6px 0px var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 頂部列與 API 設定面板 */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 2px dashed #d1d5db;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      border: 2px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 2px 2px 0px var(--border-color);
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #f3f4f6;
    }

    .api-panel {
      background: #f9fafb;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .api-panel.open {
      display: flex;
    }

    .api-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .api-input {
      flex: 1;
      min-width: 190px;
      padding: 9px 12px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text-main);
    }

    .api-guide {
      background: #ffffff;
      border: 1.5px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.86rem;
      color: var(--text-main);
      line-height: 1.65;
    }

    .api-guide-title {
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--primary);
    }

    .api-guide ol {
      padding-left: 20px;
    }

    .api-guide li + li {
      margin-top: 4px;
    }

    .api-guide a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: underline;
    }

    .status-text {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--primary);
      min-height: 1.2em;
      text-align: center;
    }

    /* Tutor 角色與控制區 */
    .tutor-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .avatar-frame {
      width: 280px;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      background: #e5e7eb;
      box-shadow: var(--shadow-comic);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 漫畫風格 Speech Bubble（Tutor） */
    .speech-bubble {
      position: relative;
      width: 100%;
      background: var(--bubble-tutor);
      border: 2.5px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 18px;
      box-shadow: var(--shadow-comic);
      min-height: 92px;
      font-size: 1.06rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .speech-bubble.tutor-bubble::before {
      content: "";
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 12px solid var(--border-color);
    }

    .speech-bubble.tutor-bubble::after {
      content: "";
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 10px solid var(--bubble-tutor);
    }

    /* Speech Bubble 下方控制列：由左至右 [語言選單] [語速] [說話] */
    .bubble-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .lang-select {
      padding: 8px 12px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      background: #fff;
      color: var(--text-main);
      box-shadow: 2px 2px 0px var(--border-color);
      cursor: pointer;
    }

    /* 語速調整彈窗（Modal） */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .rate-modal {
      width: 100%;
      max-width: 320px;
      background: #ffffff;
      border: 2.5px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 6px 6px 0px var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      text-align: center;
    }

    .rate-modal-title {
      font-size: 1.08rem;
      font-weight: 800;
    }

    .rate-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .rate-step-btn {
      width: 44px;
      height: 44px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    .rate-step-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .rate-value {
      min-width: 72px;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }

    .rate-range-note {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 使用者輸入區塊：[Me/私/Yo/나/Io] + [Speech Bubble 輸入框（含右下角清除鍵與左側尖角）] + [送出] */
    .user-section {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      width: 100%;
    }

    .user-badge {
      min-width: 58px;
      height: 54px;
      margin-top: 12px;
      padding: 0 12px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: #fef3c7;
      box-shadow: 3px 3px 0px var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      font-weight: 800;
      user-select: none;
      flex-shrink: 0;
    }

    .user-bubble-wrapper {
      position: relative;
      flex: 1;
      display: flex;
    }

    /* 指向左側 Me 的小尖角 */
    .user-bubble-wrapper::before {
      content: "";
      position: absolute;
      left: -12px;
      top: 38px;
      transform: translateY(-50%);
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 12px solid var(--border-color);
      z-index: 2;
      pointer-events: none;
    }

    .user-bubble-wrapper::after {
      content: "";
      position: absolute;
      left: -9px;
      top: 38px;
      transform: translateY(-50%);
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 10px solid var(--bubble-user);
      z-index: 3;
      pointer-events: none;
    }

    .user-bubble-input {
      width: 100%;
      min-height: 96px;
      padding: 14px 40px 14px 16px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: var(--bubble-user);
      box-shadow: 3px 3px 0px var(--border-color);
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.55;
      resize: none;
      overflow-y: hidden;
      color: var(--text-main);
    }

    .user-bubble-input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    /* 放於 speech bubble 內部右下角的一鍵清除按鈕 */
    .clear-bubble-btn {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 26px;
      height: 26px;
      border: 1.5px solid #9ca3af;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.9);
      color: #4b5563;
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 4;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .clear-bubble-btn.visible {
      display: flex;
    }

    .clear-bubble-btn:hover {
      background: #e5e7eb;
      color: #111827;
    }

    .send-btn {
      height: 54px;
      margin-top: 12px;
      padding: 0 18px;
      border: 2.5px solid var(--border-color);
      border-radius: 14px;
      background: var(--primary);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 3px 3px 0px var(--border-color);
      flex-shrink: 0;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .send-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: none;
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 手機版響應式調整 */
    @media (max-width: 600px) {
      .app-container {
        padding: 14px;
        border-radius: 14px;
      }

      .user-section {
        flex-wrap: wrap;
        gap: 10px;
      }

      .user-badge {
        min-width: 50px;
        height: 44px;
        margin-top: 0;
        font-size: 1rem;
      }

      .user-bubble-wrapper {
        width: calc(100% - 64px);
        flex: none;
      }

      .user-bubble-wrapper::before,
      .user-bubble-wrapper::after {
        top: 22px;
      }

      .send-btn {
        width: 100%;
        height: 44px;
        margin-top: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 頂部列 -->
    <header class="top-bar">
      <div class="app-title">
        <span>🌐 AI 外語家教</span>
      </div>
      <button id="toggleApiBtn" class="btn btn-secondary" type="button">⚙️ API 設定</button>
    </header>

    <!-- 本地 API 設定區（存在使用者本機 localStorage） -->
    <section id="apiPanel" class="api-panel" aria-label="API 設定">
      <div class="api-row">
        <input
          id="apiKeyInput"
          class="api-input"
          type="password"
          placeholder="貼上你的 Gemini API Key（僅保存在此裝置瀏覽器）"
          autocomplete="off"
        />
        <button id="saveApiBtn" class="btn btn-primary" type="button">儲存金鑰</button>
        <button id="clearApiBtn" class="btn btn-secondary" type="button">清除</button>
      </div>

      <div class="api-row">
        <input
          id="modelInput"
          class="api-input"
          type="text"
          placeholder="模型名稱（預設 gemini-3.5-flash-lite）"
        />
      </div>

      <div class="api-guide">
        <div class="api-guide-title">💡 如何免費取得並設定 Gemini API Key？</div>
        <ol>
          <li>
            前往
            <a href="https://aistudio.google.com/" target="_blank" rel="noopener noreferrer">Google AI Studio</a>
            並使用你的 Google 帳號登入。
          </li>
          <li>
            在左側選單或首頁點擊 <strong>Get API key</strong>（取得 API 金鑰），建立一組新的 API Key。
          </li>
          <li>
            點擊該金鑰旁的 <strong>Copy（複製）</strong> 圖示。
          </li>
          <li>
            回到本頁上方輸入框，按滑鼠右鍵選擇 <strong>貼上</strong>（或使用快捷鍵 <code>Ctrl+V</code> / <code>Cmd+V</code>），再按 <strong>儲存金鑰</strong> 即可開始使用。
          </li>
        </ol>
      </div>
    </section>

    <!-- Tutor 形象、Speech Bubble 與下方控制列 -->
    <main class="tutor-section">
      <div class="avatar-frame">
        <!-- 圖檔空位：部署至 GitHub 時，請將兩張 GIF 放在與本 HTML 相同路徑 -->
        <img id="tutorAvatar" src="./female 1.1.gif" alt="Tutor 形象" />
      </div>

      <div id="tutorBubble" class="speech-bubble tutor-bubble">
        同學好，今天想學英文的哪句話呢？
      </div>

      <!-- 由左至右：[語言選單] [語速] [說話] -->
      <div class="bubble-actions">
        <select id="targetLangSelect" class="lang-select" aria-label="選擇目標語言"></select>
        <button id="speedBtn" class="btn btn-secondary" type="button">語速 (1x)</button>
        <button id="speakBtn" class="btn btn-primary" type="button">說話</button>
      </div>

      <div id="statusText" class="status-text" role="status" aria-live="polite"></div>
    </main>

    <!-- 使用者 Speech Bubble 區塊 -->
    <section class="user-section" aria-label="輸入要翻譯的中文">
      <div id="userSelfLabel" class="user-badge">Me</div>
      <div class="user-bubble-wrapper">
        <textarea
          id="userInput"
          class="user-bubble-input"
          placeholder="請輸入想翻譯的中文句子..."
        ></textarea>
        <button
          id="clearBubbleBtn"
          class="clear-bubble-btn"
          type="button"
          title="清除輸入內容"
          aria-label="清除輸入內容"
        >×</button>
      </div>
      <button id="sendBtn" class="send-btn" type="button">送出</button>
    </section>
  </div>

  <!-- 語速調整彈窗 -->
  <div id="speedModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="rateModalTitle">
    <div class="rate-modal">
      <div id="rateModalTitle" class="rate-modal-title">調整語速</div>
      <div class="rate-controls">
        <button id="rateMinusBtn" class="rate-step-btn" type="button" aria-label="減慢語速">-</button>
        <div id="rateDisplay" class="rate-value">1x</div>
        <button id="ratePlusBtn" class="rate-step-btn" type="button" aria-label="加快語速">+</button>
      </div>
      <div class="rate-range-note">每次調整 0.1x（範圍：0.5x ～ 1.5x）</div>
      <button id="closeRateModalBtn" class="btn btn-primary" type="button">完成</button>
    </div>
  </div>

  <script>
    /**
     * =========================================================================
     * 1. 可擴充設定區（未來新增角色、語言、功能模組皆可在此擴充）
     * =========================================================================
     */
    const APP_CONFIG = {
      defaultLanguage: "en",
      speechRate: {
        defaultRate: 1.0,
        min: 0.5,
        max: 1.5,
        step: 0.1
      },
      storageKeys: {
        apiKey: "ai_tutor_gemini_api_key_v1",
        model: "ai_tutor_gemini_model_v1",
        language: "ai_tutor_target_lang_v1",
        speechRate: "ai_tutor_speech_rate_v1",
        characterId: "ai_tutor_character_id_v1"
      },
      gemini: {
        defaultModel: "gemini-3.5-flash-lite",
        endpointBase: "https://generativelanguage.googleapis.com/v1beta/models"
      }
    };

    /**
     * 角色註冊表（Character Registry）
     * 未來要新增新角色時，只需在這裡新增一筆設定即可。
     */
    const CHARACTER_REGISTRY = {
      female_1: {
        id: "female_1",
        name: "Female 1",
        images: {
          idle: "./female 1.1.gif",     // 預設／待機圖檔空位
          speaking: "./female 1.2.gif"  // TTS 說話中圖檔空位
        },
        ttsConfig: {
          zhLang: "zh-TW",
          pitch: 1.05
        }
      }
    };

    /**
     * 語言註冊表（Language Registry）
     * 預設為英文（en），左側顯示對應字形：Me / 私 / Yo / 나 / Io
     */
    const LANGUAGE_REGISTRY = {
      en: {
        code: "en",
        label: "英文",
        selfWord: "Me",
        ttsLang: "en-US",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      ja: {
        code: "ja",
        label: "日文",
        selfWord: "私",
        ttsLang: "ja-JP",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      es: {
        code: "es",
        label: "西班牙文",
        selfWord: "Yo",
        ttsLang: "es-ES",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      ko: {
        code: "ko",
        label: "韓文",
        selfWord: "나",
        ttsLang: "ko-KR",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      },
      it: {
        code: "it",
        label: "義大利文",
        selfWord: "Io",
        ttsLang: "it-IT",
        greeting: (langLabel) => `同學好，今天想學${langLabel}的哪句話呢？`
      }
    };

    /**
     * =========================================================================
     * 2. 儲存與狀態管理（State & Storage Manager）
     * =========================================================================
     */
    const StorageManager = {
      getApiKey() {
        return (localStorage.getItem(APP_CONFIG.storageKeys.apiKey) || "").trim();
      },
      setApiKey(key) {
        localStorage.setItem(APP_CONFIG.storageKeys.apiKey, (key || "").trim());
      },
      clearApiKey() {
        localStorage.removeItem(APP_CONFIG.storageKeys.apiKey);
      },
      getModel() {
        const saved = (localStorage.getItem(APP_CONFIG.storageKeys.model) || "").trim();
        return saved || APP_CONFIG.gemini.defaultModel;
      },
      setModel(modelName) {
        const clean = (modelName || "").trim() || APP_CONFIG.gemini.defaultModel;
        localStorage.setItem(APP_CONFIG.storageKeys.model, clean);
      },
      getLanguage() {
        const saved = localStorage.getItem(APP_CONFIG.storageKeys.language);
        return LANGUAGE_REGISTRY[saved] ? saved : APP_CONFIG.defaultLanguage;
      },
      setLanguage(langCode) {
        if (LANGUAGE_REGISTRY[langCode]) {
          localStorage.setItem(APP_CONFIG.storageKeys.language, langCode);
        }
      },
      getSpeechRate() {
        const raw = parseFloat(localStorage.getItem(APP_CONFIG.storageKeys.speechRate));
        if (Number.isNaN(raw)) return APP_CONFIG.speechRate.defaultRate;
        const clamped = Math.min(APP_CONFIG.speechRate.max, Math.max(APP_CONFIG.speechRate.min, raw));
        return Math.round(clamped * 10) / 10;
      },
      setSpeechRate(rate) {
        const clamped = Math.min(APP_CONFIG.speechRate.max, Math.max(APP_CONFIG.speechRate.min, rate));
        const rounded = Math.round(clamped * 10) / 10;
        localStorage.setItem(APP_CONFIG.storageKeys.speechRate, String(rounded));
        return rounded;
      },
      getCharacterId() {
        const saved = localStorage.getItem(APP_CONFIG.storageKeys.characterId);
        return CHARACTER_REGISTRY[saved] ? saved : "female_1";
      }
    };

    const AppState = {
      characterId: StorageManager.getCharacterId(),
      languageCode: StorageManager.getLanguage(),
      speechRate: StorageManager.getSpeechRate(),
      // 目前 speech bubble 內容的朗讀語系：預設為繁體中文，翻譯完成後切為目標語言
      currentTtsLang: "zh-TW",
      isSpeaking: false,
      isTranslating: false
    };

    /**
     * =========================================================================
     * 3. 角色與圖片控制器（Avatar Controller）
     * =========================================================================
     */
    const AvatarController = {
      getCurrentCharacter() {
        return CHARACTER_REGISTRY[AppState.characterId] || CHARACTER_REGISTRY.female_1;
      },
      preloadImages() {
        Object.values(CHARACTER_REGISTRY).forEach((charConfig) => {
          [charConfig.images.idle, charConfig.images.speaking].forEach((src) => {
            if (!src) return;
            const img = new Image();
            img.src = src;
          });
        });
      },
      setSpeakingState(speaking) {
        AppState.isSpeaking = Boolean(speaking);
        const charConfig = this.getCurrentCharacter();
        const imgEl = document.getElementById("tutorAvatar");
        if (!imgEl) return;

        const targetSrc = AppState.isSpeaking
          ? charConfig.images.speaking
          : charConfig.images.idle;

        if (imgEl.getAttribute("src") !== targetSrc) {
          imgEl.setAttribute("src", targetSrc);
        }
      }
    };

    /**
     * =========================================================================
     * 4. 文字轉語音模組（TTS Service）
     * =========================================================================
     */
    const TTSService = {
      speak(text, langCode = "zh-TW") {
        const cleanText = (text || "").trim();
        if (!cleanText) return Promise.resolve();

        if (!("speechSynthesis" in window)) {
          AvatarController.setSpeakingState(false);
          return Promise.resolve();
        }

        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
          window.speechSynthesis.cancel();
        }

        return new Promise((resolve) => {
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = langCode;

          const charConfig = AvatarController.getCurrentCharacter();
          utterance.pitch = charConfig.ttsConfig?.pitch ?? 1.05;
          utterance.rate = AppState.speechRate;

          const voices = window.speechSynthesis.getVoices();
          const matchedVoice =
            voices.find((v) => v.lang && v.lang.toLowerCase() === langCode.toLowerCase()) ||
            voices.find(
              (v) => v.lang && v.lang.toLowerCase().startsWith(langCode.split("-")[0].toLowerCase())
            );
          if (matchedVoice) {
            utterance.voice = matchedVoice;
          }

          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            clearTimeout(safetyTimer);
            AvatarController.setSpeakingState(false);
            resolve();
          };

          utterance.onstart = () => {
            AvatarController.setSpeakingState(true);
          };

          utterance.onend = finish;
          utterance.onerror = finish;

          const estimatedMs = Math.max(2600, (cleanText.length * 160) / Math.max(0.5, AppState.speechRate) + 2000);
          const safetyTimer = setTimeout(finish, estimatedMs);

          AvatarController.setSpeakingState(true);
          window.speechSynthesis.speak(utterance);
        });
      }
    };

    /**
     * =========================================================================
     * 5. AI 翻譯模組（Translation Service）
     * =========================================================================
     */
    const TranslationService = {
      async translateChineseToTarget(sourceText, targetLangKey) {
        const apiKey = StorageManager.getApiKey();
        if (!apiKey) {
          throw new Error("尚未設定 Gemini API Key，請先點擊右上角「API 設定」輸入並儲存金鑰。");
        }

        const model = StorageManager.getModel();
        const langInfo = LANGUAGE_REGISTRY[targetLangKey] || LANGUAGE_REGISTRY.en;
        const url = `${APP_CONFIG.gemini.endpointBase}/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const prompt = [
          `你是一位親切的外語家教。請將以下輸入的中文句子翻譯成自然道地的${langInfo.label}。`,
          `規則：只輸出翻譯後的${langInfo.label}內容，不要加多餘解釋、引號或前綴。`,
          `原文：${sourceText}`
        ].join("\n");

        const response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            contents: [
              {
                parts: [{ text: prompt }]
              }
            ]
          })
        });

        if (!response.ok) {
          let errMsg = `API 請求失敗（HTTP ${response.status}）`;
          try {
            const errData = await response.json();
            if (errData?.error?.message) {
              errMsg = `API 錯誤：${errData.error.message}`;
            }
          } catch (_) {
            // 忽略 JSON 解析失敗
          }
          throw new Error(errMsg);
        }

        const data = await response.json();
        const resultText =
          data?.candidates?.[0]?.content?.parts
            ?.map((part) => part.text || "")
            .join("")
            .trim() || "";

        if (!resultText) {
          throw new Error("API 回傳內容為空，請再試一次。");
        }

        return resultText;
      }
    };

    /**
     * =========================================================================
     * 6. 介面渲染與事件綁定（UI Controller）
     * =========================================================================
     */
    const UIController = {
      formatRateLabel(rate) {
        const rounded = Math.round(rate * 10) / 10;
        return Number.isInteger(rounded) ? `${rounded}x` : `${rounded.toFixed(1)}x`;
      },

      initLanguageSelect() {
        const selectEl = document.getElementById("targetLangSelect");
        selectEl.innerHTML = "";

        Object.values(LANGUAGE_REGISTRY).forEach((lang) => {
          const option = document.createElement("option");
          option.value = lang.code;
          option.textContent = lang.label;
          selectEl.appendChild(option);
        });

        selectEl.value = AppState.languageCode;
      },

      resetBubbleToGreeting() {
        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        const charConfig = AvatarController.getCurrentCharacter();
        AppState.currentTtsLang = charConfig.ttsConfig?.zhLang || "zh-TW";
        this.setTutorBubble(langInfo.greeting(langInfo.label));
      },

      syncLanguageUI() {
        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        const selfBadgeEl = document.getElementById("userSelfLabel");
        if (selfBadgeEl) {
          selfBadgeEl.textContent = langInfo.selfWord;
        }
      },

      syncRateUI() {
        const label = this.formatRateLabel(AppState.speechRate);
        document.getElementById("speedBtn").textContent = `語速 (${label})`;
        document.getElementById("rateDisplay").textContent = label;
      },

      autoResizeUserInput() {
        const textarea = document.getElementById("userInput");
        const clearBtn = document.getElementById("clearBubbleBtn");
        if (!textarea) return;

        textarea.style.height = "auto";
        const nextHeight = Math.max(96, textarea.scrollHeight);
        textarea.style.height = `${nextHeight}px`;

        if (clearBtn) {
          clearBtn.classList.toggle("visible", textarea.value.length > 0);
        }
      },

      setStatus(msg) {
        const statusEl = document.getElementById("statusText");
        if (statusEl) statusEl.textContent = msg || "";
      },

      setTutorBubble(text) {
        const bubbleEl = document.getElementById("tutorBubble");
        if (bubbleEl) bubbleEl.textContent = text;
      },

      setBusy(busy) {
        AppState.isTranslating = busy;
        document.getElementById("sendBtn").disabled = busy;
        document.getElementById("speakBtn").disabled = busy;
        document.getElementById("targetLangSelect").disabled = busy;
      },

      closeApiPanel() {
        document.getElementById("apiPanel").classList.remove("open");
      },

      openSpeedModal() {
        this.syncRateUI();
        document.getElementById("speedModalBackdrop").classList.add("open");
      },

      closeSpeedModal() {
        document.getElementById("speedModalBackdrop").classList.remove("open");
      },

      adjustSpeechRate(delta) {
        const nextRate = StorageManager.setSpeechRate(AppState.speechRate + delta);
        AppState.speechRate = nextRate;
        this.syncRateUI();
      },

      async handleSpeakCurrentBubble() {
        const bubbleText = (document.getElementById("tutorBubble")?.textContent || "").trim();
        if (!bubbleText) return;

        this.setBusy(true);
        this.setStatus("家教正在說話...");
        await TTSService.speak(bubbleText, AppState.currentTtsLang);
        this.setStatus("");
        this.setBusy(false);
      },

      async handleSendTranslation() {
        const inputEl = document.getElementById("userInput");
        const sourceText = inputEl.value.trim();

        if (!sourceText) {
          this.setStatus("請先輸入想要翻譯的中文句子。");
          inputEl.focus();
          return;
        }

        const langInfo = LANGUAGE_REGISTRY[AppState.languageCode] || LANGUAGE_REGISTRY.en;
        this.setBusy(true);
        this.setStatus(`正在翻譯成${langInfo.label}...`);

        try {
          const translatedText = await TranslationService.translateChineseToTarget(
            sourceText,
            AppState.languageCode
          );

          // 翻譯完成後，切為目標語言 TTS，之後按「說話」可反覆聽譯文
          AppState.currentTtsLang = langInfo.ttsLang;
          this.setTutorBubble(translatedText);
          this.setStatus(`已翻譯成${langInfo.label}，正在朗讀...`);

          await TTSService.speak(translatedText, AppState.currentTtsLang);
          this.setStatus("");
        } catch (error) {
          this.setTutorBubble(`⚠️ ${error.message}`);
          this.setStatus("");
          AvatarController.setSpeakingState(false);
        } finally {
          this.setBusy(false);
        }
      },

      bindEvents() {
        const apiKeyInput = document.getElementById("apiKeyInput");
        const modelInput = document.getElementById("modelInput");

        apiKeyInput.value = StorageManager.getApiKey();
        modelInput.value = StorageManager.getModel();

        // API 面板開關
        document.getElementById("toggleApiBtn").addEventListener("click", () => {
          document.getElementById("apiPanel").classList.toggle("open");
        });

        // 儲存後自動收合
        document.getElementById("saveApiBtn").addEventListener("click", () => {
          StorageManager.setApiKey(apiKeyInput.value);
          StorageManager.setModel(modelInput.value);

          apiKeyInput.value = StorageManager.getApiKey();
          modelInput.value = StorageManager.getModel();
          this.closeApiPanel();
          this.setStatus("已儲存 API 設定並收合視窗。");
        });

        document.getElementById("clearApiBtn").addEventListener("click", () => {
          StorageManager.clearApiKey();
          apiKeyInput.value = "";
          this.setStatus("已清除本機儲存的 API Key。");
        });

        // 切換目標語言：清空譯文、回復預設問候語，TTS 切回繁體中文
        document.getElementById("targetLangSelect").addEventListener("change", (e) => {
          AppState.languageCode = e.target.value;
          StorageManager.setLanguage(AppState.languageCode);
          this.syncLanguageUI();
          this.resetBubbleToGreeting();
          this.setStatus("");
        });

        // 語速調整視窗
        document.getElementById("speedBtn").addEventListener("click", () => {
          this.openSpeedModal();
        });

        document.getElementById("rateMinusBtn").addEventListener("click", () => {
          this.adjustSpeechRate(-APP_CONFIG.speechRate.step);
        });

        document.getElementById("ratePlusBtn").addEventListener("click", () => {
          this.adjustSpeechRate(APP_CONFIG.speechRate.step);
        });

        document.getElementById("closeRateModalBtn").addEventListener("click", () => {
          this.closeSpeedModal();
        });

        document.getElementById("speedModalBackdrop").addEventListener("click", (e) => {
          if (e.target === e.currentTarget) {
            this.closeSpeedModal();
          }
        });

        // 說話鍵：唸出目前 speech bubble 內容
        document.getElementById("speakBtn").addEventListener("click", () => {
          this.handleSpeakCurrentBubble();
        });

        // 使用者輸入框自動增高與一鍵清除
        const userInputEl = document.getElementById("userInput");
        userInputEl.addEventListener("input", () => {
          this.autoResizeUserInput();
        });

        document.getElementById("clearBubbleBtn").addEventListener("click", () => {
          userInputEl.value = "";
          this.autoResizeUserInput();
          userInputEl.focus();
        });

        // 送出翻譯
        document.getElementById("sendBtn").addEventListener("click", () => {
          this.handleSendTranslation();
        });

        userInputEl.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            if (!AppState.isTranslating) {
              this.handleSendTranslation();
            }
          }
        });

        if ("speechSynthesis" in window) {
          window.speechSynthesis.getVoices();
          window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
          };
        }
      },

      init() {
        AvatarController.preloadImages();
        this.initLanguageSelect();
        this.syncLanguageUI();
        this.syncRateUI();
        this.resetBubbleToGreeting();
        this.autoResizeUserInput();
        AvatarController.setSpeakingState(false);
        this.bindEvents();
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      UIController.init();
    });
  </script>
</body>
</html>
