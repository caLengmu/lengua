<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Multilingual Text Reader & Recorder</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f1f8fc;
      color: #444;
      margin: 0;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh; /* accounts for mobile browser chrome */
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #2a628f;
      margin-bottom: 10px;
      font-size: 1.5rem;
      line-height: 1.3;
    }

    .flags {
      margin-bottom: 20px;
    }

    .flags img {
      width: 40px;
      max-width: 18vw;
      margin: 0 5px;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
      border: 2px solid #c5dfee;
      border-radius: 10px;
      outline: none;
      margin: 10px 0;
      font-family: inherit;
    }

    textarea {
      height: 90px;
      resize: vertical;
      text-align: left;
    }

    textarea:disabled {
      background: #f4f9fc;
      color: #999;
    }

    .pane-label {
      text-align: left;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #7a95a8;
      margin: 14px 0 2px;
    }

    /* Reading view: wide, larger type, syncs with TTS playback */
    .reading-display {
      text-align: left;
      border: 2px solid #c5dfee;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 6px 0 10px;
      font-size: 19px;
      line-height: 2;
      min-height: 60px;
      max-height: 280px;
      overflow-y: auto;
      background: #fbfdff;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .reading-display:empty::before {
      content: "Text you type above will appear here, larger and easier to follow while you read.";
      color: #a9c2d3;
      font-style: italic;
    }

    .reading-display .word {
      border-radius: 4px;
      padding: 1px 2px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .reading-display .sentence.active-sentence {
      background: #eaf4fb;
      border-radius: 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .reading-display .word.active-word {
      background: #ffd166;
      color: #222;
    }

    .controls {
      margin: 15px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    select, button {
      font-size: 15px;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background-color: #0f4c81;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      flex: 1 1 auto;
      min-width: 90px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    select:hover, button:hover {
      background-color: #083a63;
    }

    button:active {
      background-color: #062c4c;
    }

    button:disabled {
      background-color: #c5dfee;
      cursor: not-allowed;
    }

    select {
      padding: 10px 12px;
    }

    /* Small phone screens */
    @media (max-width: 400px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 16px 12px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.25rem;
      }

      .flags img {
        width: 32px;
      }

      select, button {
        font-size: 14px;
        padding: 10px;
        min-width: 80px;
      }

      .reading-display {
        font-size: 17px;
        line-height: 1.8;
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Multilingual Text Reader & Recorder</h1>
    <div class="flags">
      <img src="https://flagcdn.com/w320/jp.png" alt="Japan Flag">
      <img src="https://flagcdn.com/w320/kr.png" alt="Korea Flag">
      <img src="https://flagcdn.com/w320/es.png" alt="Spain Flag">
      <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
    </div>

    <div class="pane-label">Type or paste text</div>
    <textarea id="text-input" placeholder="Enter your passage here..."></textarea>

    <div class="pane-label">Reading view — follows along as it's read aloud</div>
    <div id="reading-display" class="reading-display"></div>

    <input id="recognized-text" placeholder="Recognized speech will appear here..." disabled>
    <div class="controls">
      <select id="language-select">
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
        <option value="en-US">English</option>
      </select>
      <select id="speed-select">
        <option value="1">1x</option>
        <option value="0.85">0.85x</option>
        <option value="0.7">0.7x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
    <div class="controls">
      <button id="read-btn">Read Aloud</button>
      <button id="pause-btn" disabled>Pause</button>
      <button id="stop-btn" disabled>Stop</button>
      <button id="record-btn">Record</button>
      <button id="play-recording-btn" disabled>Play Recording</button>
    </div>
  </div>

  <script>
    const readBtn = document.getElementById('read-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const stopBtn = document.getElementById('stop-btn');
    const recordBtn = document.getElementById('record-btn');
    const playRecordingBtn = document.getElementById('play-recording-btn');
    const textInput = document.getElementById('text-input');
    const recognizedText = document.getElementById('recognized-text');
    const languageSelect = document.getElementById('language-select');
    const speedSelect = document.getElementById('speed-select');
    const readingDisplay = document.getElementById('reading-display');

    let synth = window.speechSynthesis;
    let utterance;
    let recognition;
    let recordedAudio = null;

    // ---------------------------------------------------------------
    // Reading pane: splits text into sentences, then words, and
    // renders each as its own <span> so we can highlight exactly
    // what's being spoken and scroll it into view as playback moves.
    // Intl.Segmenter gives locale-aware word boundaries, which matters
    // for Japanese/Korean where words aren't separated by spaces.
    // ---------------------------------------------------------------

    let sentences = [];        // array of sentence strings for the current text
    let currentSentenceIndex = 0;
    let currentOffsetInSentence = 0; // char offset within the current sentence to resume from
    let isReading = false;     // actively producing speech right now
    let isPaused = false;      // paused mid-playback (can resume)

    function segmentSentences(text, locale) {
      if (window.Intl && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter(locale, { granularity: 'sentence' });
          return Array.from(seg.segment(text), s => s.segment).filter(s => s.trim().length);
        } catch (e) { /* fall through to regex fallback */ }
      }
      return text.split(/(?<=[.!?。！？\n])\s*/).filter(s => s.trim().length);
    }

    function segmentWords(text, locale) {
      if (window.Intl && Intl.Segmenter) {
        try {
          const seg = new Intl.Segmenter(locale, { granularity: 'word' });
          let offset = 0;
          return Array.from(seg.segment(text), s => {
            const item = { text: s.segment, isWordLike: s.isWordLike, start: offset };
            offset += s.segment.length;
            return item;
          });
        } catch (e) { /* fall through */ }
      }
      let offset = 0;
      return text.split(/(\s+)/).filter(Boolean).map(s => {
        const item = { text: s, isWordLike: !/^\s+$/.test(s), start: offset };
        offset += s.length;
        return item;
      });
    }

    function renderReadingPane(text) {
      const locale = languageSelect.value;
      sentences = segmentSentences(text, locale);
      readingDisplay.innerHTML = '';

      sentences.forEach((sentenceText, sIdx) => {
        const sentenceSpan = document.createElement('span');
        sentenceSpan.className = 'sentence';
        sentenceSpan.dataset.idx = sIdx;

        segmentWords(sentenceText, locale).forEach(w => {
          if (w.isWordLike) {
            const wordSpan = document.createElement('span');
            wordSpan.className = 'word';
            wordSpan.dataset.start = w.start;
            wordSpan.textContent = w.text;
            sentenceSpan.appendChild(wordSpan);
          } else {
            sentenceSpan.appendChild(document.createTextNode(w.text));
          }
        });

        readingDisplay.appendChild(sentenceSpan);
        readingDisplay.appendChild(document.createTextNode(' '));
      });
    }

    function highlightSentence(sIdx) {
      readingDisplay.querySelectorAll('.sentence.active-sentence')
        .forEach(el => el.classList.remove('active-sentence'));
      const el = readingDisplay.querySelector(`.sentence[data-idx="${sIdx}"]`);
      if (el) el.classList.add('active-sentence');
    }

    function highlightWord(sIdx, charIndex) {
      const sentenceEl = readingDisplay.querySelector(`.sentence[data-idx="${sIdx}"]`);
      if (!sentenceEl) return;
      readingDisplay.querySelectorAll('.word.active-word')
        .forEach(el => el.classList.remove('active-word'));

      let target = null;
      sentenceEl.querySelectorAll('.word').forEach(w => {
        if (parseInt(w.dataset.start, 10) <= charIndex) target = w;
      });
      if (target) {
        target.classList.add('active-word');
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    function clearHighlights() {
      readingDisplay.querySelectorAll('.active-sentence')
        .forEach(el => el.classList.remove('active-sentence'));
      readingDisplay.querySelectorAll('.active-word')
        .forEach(el => el.classList.remove('active-word'));
    }

    // Live preview: keep the reading view in sync while typing/pasting,
    // as long as we're not mid-playback.
    textInput.addEventListener('input', () => {
      if (!isReading && !isPaused) renderReadingPane(textInput.value);
    });
    languageSelect.addEventListener('change', () => {
      if (!isReading && !isPaused) renderReadingPane(textInput.value);
    });

    // ---------------------------------------------------------------
    // Text-to-Speech: plays one sentence at a time as separate
    // utterances (a queue), rather than one long utterance. This is
    // what makes real pause/resume possible: native
    // synth.pause()/resume() is unreliable on mobile (Android Chrome
    // often just cancels; iOS Safari support is spotty). Instead,
    // "Pause" cancels the in-flight utterance but remembers exactly
    // which sentence and character offset we'd reached, and "Resume"
    // starts a new utterance right there — not from the beginning.
    // Within a sentence, onboundary events (where supported) refine
    // that resume point down to the word; where boundary events
    // aren't fired, it still resumes from the start of that sentence
    // rather than the start of the whole text.
    // ---------------------------------------------------------------

    function playFromSentence(sentenceIndex, charOffset = 0) {
      if (sentenceIndex >= sentences.length) {
        finishReading();
        return;
      }

      currentSentenceIndex = sentenceIndex;
      const sentenceText = sentences[sentenceIndex];
      const rawRemaining = sentenceText.slice(charOffset);
      const remaining = rawRemaining.trimStart();
      const baseOffset = charOffset + (rawRemaining.length - remaining.length);

      if (!remaining) {
        playFromSentence(sentenceIndex + 1, 0);
        return;
      }

      utterance = new SpeechSynthesisUtterance(remaining);
      utterance.lang = languageSelect.value;
      utterance.rate = parseFloat(speedSelect.value);

      utterance.onboundary = (event) => {
        if (event.charIndex === undefined) return;
        currentOffsetInSentence = baseOffset + event.charIndex;
        highlightWord(sentenceIndex, currentOffsetInSentence);
      };

      utterance.onend = () => {
        if (isReading) playFromSentence(sentenceIndex + 1, 0);
      };

      utterance.onerror = () => {
        if (isReading) finishReading();
      };

      highlightSentence(sentenceIndex);
      currentOffsetInSentence = baseOffset;
      isReading = true;
      synth.speak(utterance);
    }

    function finishReading() {
      isReading = false;
      isPaused = false;
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      readBtn.disabled = false;
      pauseBtn.disabled = true;
      pauseBtn.textContent = 'Pause';
      stopBtn.disabled = true;
      textInput.disabled = false;
      clearHighlights();
    }

    readBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (!text) return alert("Please enter some text!");

      renderReadingPane(text);
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      isPaused = false;

      textInput.disabled = true;
      readBtn.disabled = true;
      pauseBtn.disabled = false;
      pauseBtn.textContent = 'Pause';
      stopBtn.disabled = false;

      playFromSentence(0, 0);
    });

    pauseBtn.addEventListener('click', () => {
      if (isReading && !isPaused) {
        // Pause: stop speech now, but keep the exact sentence + offset
        isPaused = true;
        isReading = false; // so onend doesn't advance to the next sentence
        synth.cancel();
        pauseBtn.textContent = 'Resume';
      } else if (isPaused) {
        // Resume: pick up right where we left off, not from the start
        isPaused = false;
        playFromSentence(currentSentenceIndex, currentOffsetInSentence);
        pauseBtn.textContent = 'Pause';
      }
    });

    stopBtn.addEventListener('click', () => {
      isReading = false;
      synth.cancel();
      finishReading();
    });

    // Speech Recognition
    recordBtn.addEventListener('click', () => {
      if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
        alert("Speech recognition not supported in this browser.");
        return;
      }

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = languageSelect.value;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        recognizedText.value = transcript;
        recordedAudio = transcript;
        playRecordingBtn.disabled = false;
      };

      recognition.start();
    });

    // Play Recorded Audio
    playRecordingBtn.addEventListener('click', () => {
      if (recordedAudio) {
        const playbackUtterance = new SpeechSynthesisUtterance(recordedAudio);
        playbackUtterance.lang = languageSelect.value;
        synth.speak(playbackUtterance);
      }
    });
  </script>
</body>
</html>
