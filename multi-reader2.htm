<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Multilingual Text Reader & Recorder</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f1f8fc;
    color: #444;
    margin: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
    padding: 28px 24px;
    text-align: center;
    position: relative;
  }

  .view { display: none; }
  .view.active { display: block; }

  h1 { color: #2a628f; margin: 0 0 6px; font-size: 1.6rem; line-height: 1.3; }
  h2 { color: #2a628f; margin: 0 0 16px; font-size: 1.2rem; }

  .flags { margin-bottom: 18px; }
  .flags img { width: 34px; max-width: 16vw; margin: 0 4px; }

  textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    outline: none;
    font-family: inherit;
    text-align: left;
    resize: vertical;
    background: #fbfdff;
  }

  #home-textarea {
    height: 130px;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(15, 76, 129, 0.06);
  }
  #home-textarea:focus { border-color: #6fb3e0; }

  .btn-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn-row + .btn-row { margin-top: 12px; }

  select, button {
    font-size: 15px;
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    background-color: #0f4c81;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease;
    flex: 1 1 auto;
    min-width: 100px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  select:hover, button:hover { background-color: #083a63; }
  button:active { background-color: #062c4c; }
  button:disabled { background-color: #c5dfee; cursor: not-allowed; }

  button.secondary {
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  button.secondary:hover { background-color: #dcebf5; }

  select { padding: 11px 12px; }

  /* ---------- home screen: paired columns ---------- */
  .home-grid {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .home-col {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  #btn-start { background-color: #1c7a4d; }
  #btn-start:hover { background-color: #145f3b; }

  /* ---------- Now Reading header ---------- */
  .playback-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  #playback-speed { flex: 0 1 130px; min-width: 90px; }
  .sentence-counter {
    display: inline-block;
    background: #ff9f1c;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 4px rgba(255, 159, 28, 0.4);
  }
  .icon-btn {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    min-width: 42px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  .icon-btn:hover { background-color: #dcebf5; }

  /* ---------- playback screen ---------- */
  .playback-display {
    text-align: left;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    padding: 20px;
    margin: 4px 0 6px;
    min-height: 140px;
    background: #fbfdff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .playback-display .line { font-size: 21px; line-height: 1.8; word-break: break-word; }
  .playback-display .line.next-line { opacity: 0.4; font-size: 19px; }

  .playback-display .word {
    border-radius: 4px;
    padding: 1px 2px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .playback-display .word.active-word { background: #ffd166; color: #222; }

  .nav-row { display: none; margin-top: 12px; }
  .nav-row.visible { display: flex; }

  /* ---------- recording panel: visually boxed off ---------- */
  #record-panel {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border: 2px dashed #f3b23c;
    background: #fff8ec;
    border-radius: 14px;
  }
  #record-panel.visible { display: block; }

  .record-panel-title {
    font-size: 13px;
    font-weight: 700;
    color: #b3701a;
    text-align: left;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }

  .slot-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .slot-btn {
    background-color: #ffffff;
    color: #b3701a;
    border: 2px solid #f3b23c;
    flex: 1 1 auto;
    min-width: 90px;
    font-size: 14px;
    padding: 9px 10px;
  }
  .slot-btn:hover { background-color: #fff2da; }
  .slot-btn.active-slot {
    background-color: #f3b23c;
    color: #fff;
  }

  #btn-record-toggle.recording {
    background-color: #d64545;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(214, 69, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0); }
  }

  .record-status {
    font-size: 13px;
    color: #d64545;
    margin: 8px 0 0;
    min-height: 16px;
    font-weight: 600;
  }

  #volume-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    margin-top: 14px;
    text-align: left;
  }
  #volume-row label { font-size: 13px; color: #b3701a; font-weight: 600; }
  #volume-row input[type="range"] { width: 100%; accent-color: #f3b23c; padding: 0; background: transparent; }

  .hint { font-size: 12px; color: #9db6c6; margin-top: 10px; }

  @media (max-width: 400px) {
    body { padding: 8px; }
    .app { padding: 18px 14px; border-radius: 12px; }
    h1 { font-size: 1.3rem; }
    .flags img { width: 28px; }
    select, button { font-size: 14px; padding: 10px; min-width: 84px; }
    .playback-display .line { font-size: 18px; }
    .playback-display .line.next-line { font-size: 16px; }
    .home-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div id="home-view" class="view active">
    <h1>Multilingual Text Reader & Recorder</h1>
    <div class="flags">
      <img src="https://flagcdn.com/w320/jp.png" alt="Japan Flag">
      <img src="https://flagcdn.com/w320/kr.png" alt="Korea Flag">
      <img src="https://flagcdn.com/w320/es.png" alt="Spain Flag">
      <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
    </div>
    <textarea id="home-textarea" placeholder="Type or paste text here..."></textarea>

    <div class="home-grid">
      <div class="home-col">
        <button id="btn-paste" class="secondary">📋 Paste Text</button>
        <select id="home-language">
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
          <option value="es-ES">español</option>
          <option value="en-US">English</option>
        </select>
      </div>
      <div class="home-col">
        <button id="btn-clear" class="secondary">🗑️ Clear Text</button>
        <button id="btn-start">▶️ Start</button>
      </div>
    </div>

    <div class="btn-row">
      <button id="btn-activate-recorder">🎤 Activate Recorder</button>
    </div>
  </div>

  <!-- ============ PLAYBACK ("Now Reading") ============ -->
  <div id="playback-view" class="view">
    <div class="playback-header">
      <select id="playback-speed">
        <option value="1">1x</option>
        <option value="0.85">0.85x</option>
        <option value="0.7">0.7x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
      <h2 style="margin:0; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap;">
        📖 Now Reading <span id="sentence-counter" class="sentence-counter">1 of 1</span>
      </h2>
      <button id="btn-playback-close" class="icon-btn" title="Close">✕</button>
    </div>

    <div id="playback-display" class="playback-display"></div>

    <div class="btn-row">
      <button id="btn-pause-resume">⏸️ Pause</button>
      <button id="btn-stop" class="secondary">⏹️ Stop</button>
    </div>

    <div id="nav-row" class="btn-row nav-row">
      <button id="btn-prev" class="secondary">⏮️ Previous</button>
      <button id="btn-next" class="secondary">⏭️ Next</button>
    </div>

    <!-- Real audio recording (MediaRecorder), Anki-card style: record your
         own voice reading the current sentence, with 3 comparable takes. -->
    <div id="record-panel">
      <div class="record-panel-title">🎙️ PRACTICE RECORDING</div>

      <div class="slot-row">
        <button id="btn-rec-slot-1" class="slot-btn active-slot">🎤 Rec #1</button>
        <button id="btn-rec-slot-2" class="slot-btn">🎤 Rec #2</button>
        <button id="btn-rec-slot-3" class="slot-btn">🎤 Rec #3</button>
      </div>

      <div id="record-row" class="btn-row" style="margin-top:0;">
        <button id="btn-record-toggle">🎙️ Record</button>
        <button id="btn-play-pause" class="secondary" disabled>▶️ Play</button>
        <button id="btn-delete-recording" class="secondary" disabled>🗑️ Delete</button>
      </div>

      <div id="volume-row">
        <label for="playback-gain">🔊 Playback boost: <span id="gain-label">3.0x</span></label>
        <input type="range" id="playback-gain" min="1" max="20" step="0.5" value="3">
      </div>

      <div id="record-status" class="record-status"></div>
    </div>

    <div class="hint">Previous / Next / Recording appear while paused or stopped</div>
    <audio id="my-recording-audio" style="display:none"></audio>
  </div>

  <!-- ============ RECORDER (speech-to-text demo) ============ -->
  <div id="recorder-view" class="view">
    <h2>🎤 Recorder</h2>
    <div class="btn-row">
      <select id="recorder-language">
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <textarea id="recognized-text" placeholder="Recognized speech will appear here..." readonly style="height:80px;"></textarea>
    <div class="btn-row">
      <button id="btn-record">🎙️ Record</button>
      <button id="btn-play-recording" disabled>▶️ Play Recording</button>
    </div>
    <div class="btn-row">
      <button id="btn-recorder-close" class="secondary">✕ Close</button>
    </div>
  </div>

</div>

<script>
  // ---------------------------------------------------------------
  // View switching
  // ---------------------------------------------------------------
  function showView(id) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------------------------------------------------------------
  // Element references
  // ---------------------------------------------------------------
  const homeTextarea = document.getElementById('home-textarea');
  const homeLanguage = document.getElementById('home-language');
  const btnPaste = document.getElementById('btn-paste');
  const btnClear = document.getElementById('btn-clear');
  const btnStart = document.getElementById('btn-start');
  const btnActivateRecorder = document.getElementById('btn-activate-recorder');

  const playbackSpeed = document.getElementById('playback-speed');
  const btnPlaybackClose = document.getElementById('btn-playback-close');
  const playbackDisplay = document.getElementById('playback-display');
  const btnPauseResume = document.getElementById('btn-pause-resume');
  const btnStop = document.getElementById('btn-stop');
  const navRow = document.getElementById('nav-row');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');

  const recordPanel = document.getElementById('record-panel');
  const btnRecSlot1 = document.getElementById('btn-rec-slot-1');
  const btnRecSlot2 = document.getElementById('btn-rec-slot-2');
  const btnRecSlot3 = document.getElementById('btn-rec-slot-3');
  const btnRecordToggle = document.getElementById('btn-record-toggle');
  const btnPlayPause = document.getElementById('btn-play-pause');
  const btnDeleteRecording = document.getElementById('btn-delete-recording');
  const recordStatus = document.getElementById('record-status');
  const myRecordingAudio = document.getElementById('my-recording-audio');
  const gainSlider = document.getElementById('playback-gain');
  const gainLabel = document.getElementById('gain-label');

  const recorderLanguage = document.getElementById('recorder-language');
  const recognizedText = document.getElementById('recognized-text');
  const btnRecord = document.getElementById('btn-record');
  const btnPlayRecording = document.getElementById('btn-play-recording');
  const btnRecorderClose = document.getElementById('btn-recorder-close');

  const synth = window.speechSynthesis;
  let utterance;
  let recognition;
  let recordedAudio = null;

  gainSlider.addEventListener('input', () => {
    gainLabel.textContent = parseFloat(gainSlider.value).toFixed(1) + 'x';
  });

  // ---------------------------------------------------------------
  // Home screen: paste / clear / navigate
  // ---------------------------------------------------------------
  function insertAtCursor(textarea, text) {
    const start = textarea.selectionStart ?? textarea.value.length;
    const end = textarea.selectionEnd ?? textarea.value.length;
    textarea.value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
    const pos = start + text.length;
    textarea.selectionStart = textarea.selectionEnd = pos;
    textarea.focus();
  }

  btnPaste.addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) insertAtCursor(homeTextarea, text);
    } catch (err) {
      alert('Could not read the clipboard automatically. Please paste manually (Ctrl/Cmd+V), or long-press the text box and choose Paste.');
    }
  });

  btnClear.addEventListener('click', () => {
    homeTextarea.value = '';
    homeTextarea.focus();
  });

  btnActivateRecorder.addEventListener('click', () => {
    recognizedText.value = '';
    recordedAudio = null;
    btnPlayRecording.disabled = true;
    showView('recorder-view');
  });

  btnRecorderClose.addEventListener('click', () => showView('home-view'));

  // ---------------------------------------------------------------
  // Sentence / word segmentation (locale-aware; Intl.Segmenter
  // handles Japanese/Korean correctly, where words aren't
  // separated by spaces)
  // ---------------------------------------------------------------
  function segmentSentences(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'sentence' });
        return Array.from(seg.segment(text), s => s.segment).filter(s => s.trim().length);
      } catch (e) { /* fall through */ }
    }
    return text.split(/(?<=[.!?。！？\n])\s*/).filter(s => s.trim().length);
  }

  function segmentWords(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'word' });
        let offset = 0;
        return Array.from(seg.segment(text), s => {
          const item = { text: s.segment, isWordLike: s.isWordLike, start: offset };
          offset += s.segment.length;
          return item;
        });
      } catch (e) { /* fall through */ }
    }
    let offset = 0;
    return text.split(/(\s+)/).filter(Boolean).map(s => {
      const item = { text: s, isWordLike: !/^\s+$/.test(s), start: offset };
      offset += s.length;
      return item;
    });
  }

  // ---------------------------------------------------------------
  // Playback: one sentence at a time as a queue, so Pause remembers
  // exactly where we were and Read Aloud (resume) picks up right
  // there. The display window always shows the sentence currently
  // being spoken plus the next one coming up.
  // ---------------------------------------------------------------

  let sentences = [];
  let currentSentenceIndex = 0;
  let currentOffsetInSentence = 0;
  let isPlaying = false;
  let activeLanguage = 'en-US';

  function renderPlaybackWindow() {
    playbackDisplay.innerHTML = '';
    const idxs = [currentSentenceIndex];
    if (currentSentenceIndex + 1 < sentences.length) idxs.push(currentSentenceIndex + 1);

    idxs.forEach((idx, i) => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line ' + (i === 0 ? 'current-line' : 'next-line');

      const sentenceSpan = document.createElement('span');
      sentenceSpan.className = 'sentence';
      sentenceSpan.dataset.idx = idx;

      segmentWords(sentences[idx], activeLanguage).forEach(w => {
        if (w.isWordLike) {
          const wordSpan = document.createElement('span');
          wordSpan.className = 'word';
          wordSpan.dataset.start = w.start;
          wordSpan.textContent = w.text;
          sentenceSpan.appendChild(wordSpan);
        } else {
          sentenceSpan.appendChild(document.createTextNode(w.text));
        }
      });

      lineDiv.appendChild(sentenceSpan);
      playbackDisplay.appendChild(lineDiv);
    });

    updateSentenceCounter();
  }

  function updateSentenceCounter() {
    const el = document.getElementById('sentence-counter');
    if (el) el.textContent = `${currentSentenceIndex + 1} of ${sentences.length}`;
  }

  function highlightWord(sentenceIdx, charIndex) {
    const sentenceEl = playbackDisplay.querySelector(`.sentence[data-idx="${sentenceIdx}"]`);
    if (!sentenceEl) return;
    playbackDisplay.querySelectorAll('.word.active-word').forEach(el => el.classList.remove('active-word'));

    let target = null;
    sentenceEl.querySelectorAll('.word').forEach(w => {
      if (parseInt(w.dataset.start, 10) <= charIndex) target = w;
    });
    if (target) {
      target.classList.add('active-word');
      target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }

  function updatePlaybackButtons() {
    btnPauseResume.textContent = isPlaying ? '⏸️ Pause' : '▶️ Read Aloud';
    const paused = !isPlaying;
    navRow.classList.toggle('visible', paused);
    recordPanel.classList.toggle('visible', paused);
    btnPrev.disabled = currentSentenceIndex <= 0;
    btnNext.disabled = currentSentenceIndex >= sentences.length - 1;
    if (paused) {
      updateRecordButtons();
    } else {
      recordStatus.textContent = '';
    }
  }

  function playFromSentence(sentenceIndex, charOffset = 0) {
    if (sentenceIndex >= sentences.length) {
      isPlaying = false;
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      renderPlaybackWindow();
      updatePlaybackButtons();
      return;
    }

    currentSentenceIndex = sentenceIndex;
    renderPlaybackWindow();

    const sentenceText = sentences[sentenceIndex];
    const rawRemaining = sentenceText.slice(charOffset);
    const remaining = rawRemaining.trimStart();
    const baseOffset = charOffset + (rawRemaining.length - remaining.length);

    if (!remaining) {
      playFromSentence(sentenceIndex + 1, 0);
      return;
    }

    utterance = new SpeechSynthesisUtterance(remaining);
    utterance.lang = activeLanguage;
    utterance.rate = parseFloat(playbackSpeed.value);

    utterance.onboundary = (event) => {
      if (event.charIndex === undefined) return;
      currentOffsetInSentence = baseOffset + event.charIndex;
      highlightWord(sentenceIndex, currentOffsetInSentence);
    };

    utterance.onend = () => {
      if (isPlaying) playFromSentence(sentenceIndex + 1, 0);
    };

    utterance.onerror = () => {
      if (isPlaying) { isPlaying = false; updatePlaybackButtons(); }
    };

    currentOffsetInSentence = baseOffset;
    isPlaying = true;
    synth.speak(utterance);
    updatePlaybackButtons();
  }

  btnStart.addEventListener('click', () => {
    const text = homeTextarea.value.trim();
    if (!text) { alert('Please enter or paste some text first!'); return; }

    activeLanguage = homeLanguage.value;
    sentences = segmentSentences(text, activeLanguage);
    if (sentences.length === 0) { alert('No readable text found.'); return; }

    resetAllRecordings();
    currentRecSlot = 1;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    isPlaying = false;
    showView('playback-view');
    renderPlaybackWindow();   // show the first sentence, but don't speak yet
    updatePlaybackButtons();  // "Read Aloud" waits for the user to tap it
  });

  btnPauseResume.addEventListener('click', () => {
    if (isPlaying) {
      isPlaying = false;
      synth.cancel();
      updatePlaybackButtons();
    } else {
      if (isRecording) return; // don't resume mid-recording
      resetPlaybackState();
      playFromSentence(currentSentenceIndex, currentOffsetInSentence);
    }
  });

  btnStop.addEventListener('click', () => {
    if (isRecording) return;
    synth.cancel();
    isPlaying = false;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    resetPlaybackState();
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  btnPlaybackClose.addEventListener('click', () => {
    if (isRecording) return;
    synth.cancel();
    isPlaying = false;
    currentSentenceIndex = 0;
    currentOffsetInSentence = 0;
    resetPlaybackState();
    showView('home-view');
  });

  btnPrev.addEventListener('click', () => {
    if (isPlaying || isRecording) return;
    resetPlaybackState();
    currentSentenceIndex = Math.max(0, currentSentenceIndex - 1);
    currentOffsetInSentence = 0;
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  btnNext.addEventListener('click', () => {
    if (isPlaying || isRecording) return;
    resetPlaybackState();
    currentSentenceIndex = Math.min(sentences.length - 1, currentSentenceIndex + 1);
    currentOffsetInSentence = 0;
    renderPlaybackWindow();
    updatePlaybackButtons();
  });

  // ---------------------------------------------------------------
  // Real audio recording (MediaRecorder), Anki-card style.
  // Shows up under Previous/Next whenever playback is paused or
  // stopped. Each sentence keeps up to THREE separate takes
  // (Rec #1/#2/#3) so you can compare progress across attempts.
  // ---------------------------------------------------------------

  let mediaRecorder = null;
  let mediaStream = null;
  let isRecording = false;
  let recordingChunks = [];
  let recordStartTime = 0;
  let recordTimerInterval = null;
  let currentRecSlot = 1;
  const sentenceRecordings = {}; // sentenceIndex -> { 1: {blob,url}, 2: {...}, 3: {...} }

  // Playback of the user's own recording, with real pause/resume
  let audioCtx = null;
  let playbackAudioBuffer = null;
  let playbackKey = null; // "sentenceIdx:slot" the loaded buffer belongs to
  let playbackSource = null;
  let playbackOffset = 0; // seconds into the buffer to resume from
  let playbackStartCtxTime = 0;
  let isRecPlaying = false;

  function getCurrentSlotRecording() {
    const forSentence = sentenceRecordings[currentSentenceIndex];
    return forSentence ? forSentence[currentRecSlot] : undefined;
  }

  function resetAllRecordings() {
    Object.values(sentenceRecordings).forEach(slots => {
      Object.values(slots).forEach(r => URL.revokeObjectURL(r.url));
    });
    for (const k in sentenceRecordings) delete sentenceRecordings[k];
    resetPlaybackState();
  }

  function resetPlaybackState() {
    if (playbackSource) {
      playbackSource.onended = null;
      try { playbackSource.stop(); } catch (e) { /* already stopped */ }
      playbackSource = null;
    }
    isRecPlaying = false;
    playbackOffset = 0;
    playbackAudioBuffer = null;
    playbackKey = null;
    updatePlayPauseLabel();
  }

  function updatePlayPauseLabel() {
    btnPlayPause.textContent = isRecPlaying ? '⏸️ Pause' : '▶️ Play';
  }

  function refreshSlotButtons() {
    const forSentence = sentenceRecordings[currentSentenceIndex] || {};
    [btnRecSlot1, btnRecSlot2, btnRecSlot3].forEach((btn, i) => {
      const slot = i + 1;
      const has = !!forSentence[slot];
      btn.textContent = `${has ? '🎤' : '⚪'} Rec #${slot}`;
      btn.classList.toggle('active-slot', slot === currentRecSlot);
    });
  }

  function updateRecordButtons() {
    const hasRecording = !!getCurrentSlotRecording();
    btnRecordToggle.textContent = hasRecording ? '🎙️ Re-record' : '🎙️ Record';
    btnRecordToggle.classList.remove('recording');
    btnPlayPause.disabled = !hasRecording;
    btnDeleteRecording.disabled = !hasRecording;
    recordStatus.textContent = '';
    updatePlayPauseLabel();
    refreshSlotButtons();
  }

  function setControlsDisabledForRecording(disabled) {
    btnPauseResume.disabled = disabled;
    btnStop.disabled = disabled;
    btnPlaybackClose.disabled = disabled;
    btnPrev.disabled = disabled || currentSentenceIndex <= 0;
    btnNext.disabled = disabled || currentSentenceIndex >= sentences.length - 1;
    btnRecSlot1.disabled = disabled;
    btnRecSlot2.disabled = disabled;
    btnRecSlot3.disabled = disabled;
    btnPlayPause.disabled = disabled || !getCurrentSlotRecording();
    btnDeleteRecording.disabled = disabled || !getCurrentSlotRecording();
  }

  function selectRecSlot(slot) {
    if (isRecording) return;
    resetPlaybackState();
    currentRecSlot = slot;
    updateRecordButtons();
  }

  btnRecSlot1.addEventListener('click', () => selectRecSlot(1));
  btnRecSlot2.addEventListener('click', () => selectRecSlot(2));
  btnRecSlot3.addEventListener('click', () => selectRecSlot(3));

  async function startRecording() {
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
    } catch (err) {
      alert('Microphone access is needed to record. Please allow microphone permission and try again.');
      return;
    }

    resetPlaybackState();
    mediaStream = stream;
    recordingChunks = [];
    const recordedForSentence = currentSentenceIndex;
    const recordedForSlot = currentRecSlot;

    try {
      mediaRecorder = new MediaRecorder(mediaStream);
    } catch (err) {
      alert('Recording is not supported in this browser.');
      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordingChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);

      if (!sentenceRecordings[recordedForSentence]) sentenceRecordings[recordedForSentence] = {};
      if (sentenceRecordings[recordedForSentence][recordedForSlot]) {
        URL.revokeObjectURL(sentenceRecordings[recordedForSentence][recordedForSlot].url);
      }
      sentenceRecordings[recordedForSentence][recordedForSlot] = { blob, url };

      mediaStream.getTracks().forEach(t => t.stop());
      mediaStream = null;
      isRecording = false;
      clearInterval(recordTimerInterval);
      recordTimerInterval = null;
      setControlsDisabledForRecording(false);
      updateRecordButtons();
    };

    mediaRecorder.start();
    isRecording = true;
    recordStartTime = Date.now();
    setControlsDisabledForRecording(true);
    btnRecordToggle.disabled = false; // stays clickable so it can be stopped
    btnRecordToggle.textContent = '⏹️ Stop';
    btnRecordToggle.classList.add('recording');

    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordStartTime) / 1000);
      recordStatus.textContent = `● Recording… ${secs}s`;
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) mediaRecorder.stop();
  }

  btnRecordToggle.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  // A plain <audio> element can't play louder than the phone's normal
  // media volume, and mobile mic capture is usually much quieter to
  // begin with (auto-gain targets phone-call loudness, not full-scale).
  // So playback here: (1) auto-normalizes the recording's peak volume
  // to a consistent baseline, (2) applies the user's slider gain
  // (1x-20x) on top, and (3) runs it through a limiter so high gain
  // compresses peaks instead of clipping/distorting.
  function getPeakAmplitude(audioBuffer) {
    let peak = 0;
    for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
      const data = audioBuffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) {
        const abs = Math.abs(data[i]);
        if (abs > peak) peak = abs;
      }
    }
    return peak;
  }

  function buildPlaybackChain(buffer, offsetSeconds) {
    const userGain = parseFloat(gainSlider.value) || 1;
    const peak = getPeakAmplitude(buffer);
    const normalizeGain = peak > 0.0001 ? Math.min(0.95 / peak, 12) : 1;
    const totalGain = normalizeGain * userGain;

    const source = audioCtx.createBufferSource();
    source.buffer = buffer;

    const gainNode = audioCtx.createGain();
    gainNode.gain.value = totalGain;

    const limiter = audioCtx.createDynamicsCompressor();
    limiter.threshold.value = -6;
    limiter.knee.value = 0;
    limiter.ratio.value = 20;
    limiter.attack.value = 0.003;
    limiter.release.value = 0.25;

    source.connect(gainNode).connect(limiter).connect(audioCtx.destination);

    source.onended = () => {
      if (isRecPlaying) {
        isRecPlaying = false;
        playbackOffset = 0;
        updatePlayPauseLabel();
      }
    };

    playbackSource = source;
    playbackStartCtxTime = audioCtx.currentTime;
    isRecPlaying = true;
    source.start(0, offsetSeconds);
    updatePlayPauseLabel();
  }

  btnPlayPause.addEventListener('click', async () => {
    const rec = getCurrentSlotRecording();
    if (!rec) return;

    if (isRecPlaying) {
      // Pause: remember exactly how far we'd gotten
      const elapsed = audioCtx.currentTime - playbackStartCtxTime;
      playbackOffset += elapsed;
      if (playbackSource) {
        playbackSource.onended = null;
        try { playbackSource.stop(); } catch (e) { /* already stopped */ }
        playbackSource = null;
      }
      isRecPlaying = false;
      updatePlayPauseLabel();
      return;
    }

    const key = `${currentSentenceIndex}:${currentRecSlot}`;

    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (playbackKey !== key || !playbackAudioBuffer) {
        const arrayBuffer = await rec.blob.arrayBuffer();
        playbackAudioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        playbackKey = key;
        playbackOffset = 0;
      }
      if (playbackOffset >= playbackAudioBuffer.duration) playbackOffset = 0;

      buildPlaybackChain(playbackAudioBuffer, playbackOffset);
    } catch (err) {
      myRecordingAudio.src = URL.createObjectURL(rec.blob);
      myRecordingAudio.play();
    }
  });

  btnDeleteRecording.addEventListener('click', () => {
    const rec = getCurrentSlotRecording();
    if (!rec) return;
    URL.revokeObjectURL(rec.url);
    delete sentenceRecordings[currentSentenceIndex][currentRecSlot];
    resetPlaybackState();
    updateRecordButtons();
  });

  // ---------------------------------------------------------------
  // Recorder screen (separate: speech-to-text via Web Speech API)
  // ---------------------------------------------------------------
  btnRecord.addEventListener('click', () => {
    if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
      alert('Speech recognition not supported in this browser.');
      return;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = recorderLanguage.value;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      recognizedText.value = transcript;
      recordedAudio = transcript;
      btnPlayRecording.disabled = false;
    };

    recognition.start();
  });

  btnPlayRecording.addEventListener('click', () => {
    if (recordedAudio) {
      const playbackUtterance = new SpeechSynthesisUtterance(recordedAudio);
      playbackUtterance.lang = recorderLanguage.value;
      synth.speak(playbackUtterance);
    }
  });
</script>
</body>
</html>
