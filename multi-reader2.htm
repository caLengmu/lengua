<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Multilingual Text Reader & Recorder</title>
<style>
  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f1f8fc;
    color: #444;
    margin: 0;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .app {
    width: 100%;
    max-width: 720px;
    background: #ffffff;
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
    border-radius: 15px;
    padding: 28px 24px;
    text-align: center;
    position: relative;
  }

  .view { display: none; }
  .view.active { display: block; }

  h1 { color: #2a628f; margin: 0 0 6px; font-size: 1.6rem; line-height: 1.3; }
  h2 { color: #2a628f; margin: 0 0 16px; font-size: 1.2rem; }

  .flags { margin-bottom: 18px; }
  .flags img { width: 34px; max-width: 16vw; margin: 0 4px; }

  textarea {
    width: 100%;
    padding: 16px;
    font-size: 17px;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    outline: none;
    font-family: inherit;
    text-align: left;
    resize: vertical;
    background: #fbfdff;
  }

  #home-textarea {
    height: 130px;
    font-size: 18px;
    box-shadow: 0 2px 6px rgba(15, 76, 129, 0.06);
  }
  #home-textarea:focus { border-color: #6fb3e0; }

  .btn-row {
    margin-top: 18px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
  .btn-row + .btn-row { margin-top: 12px; }

  select, button {
    font-size: 15px;
    padding: 11px 16px;
    border: none;
    border-radius: 10px;
    background-color: #0f4c81;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
    flex: 1 1 auto;
    min-width: 100px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  #btn-pause-resume, #btn-stop, #btn-prev, #btn-next {
    flex: 1 1 0;
  }

  select:hover, button:hover:not(:disabled) { background-color: #083a63; }
  button:active:not(:disabled) { background-color: #062c4c; }
  button:disabled { background-color: #c5dfee; cursor: not-allowed; }

  button.secondary {
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  button.secondary:hover:not(:disabled) { background-color: #dcebf5; }

  select { padding: 11px 12px; }

    /* ---------- home screen: same layout on desktop and mobile ---------- */
  .home-stack {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .paste-clear-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  #btn-start {
    background-color: #1c7a4d;
    font-size: 1.2em;
    padding: 14px;
  }
  #btn-start:hover { background-color: #145f3b; }

  /* ---------- Now Reading header ---------- */
  .playback-header {
    display: grid;
    grid-template-columns: 42px 1fr 42px; /* 讓標題完美置中 */
    align-items: center;
    gap: 10px;
    margin-bottom: 0px;
  }
  .playback-header h2 { justify-self: center; text-align: center; white-space: nowrap; }
  .playback-header .icon-btn { justify-self: end; grid-column: 3; }
  
  .counter-row { 
    text-align: center; 
    margin-top: -4px; 
    margin-bottom: 14px; 
  }
  .sentence-counter {
    display: inline-block;
    background: #ff9f1c;
    color: #fff;
    font-size: 0.8rem;
    font-weight: 800;
    padding: 3px 12px;
    border-radius: 999px;
    letter-spacing: 0.02em;
    box-shadow: 0 2px 4px rgba(255, 159, 28, 0.4);
  }
  .icon-btn {
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    min-width: 42px;
    padding: 0;
    border-radius: 50%;
    font-size: 18px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
  }
  .icon-btn:hover { background-color: #dcebf5; }

  /* ---------- playback screen ---------- */
  .playback-display-wrapper { 
    display: flex; 
    align-items: stretch; 
    gap: 10px; 
  }

  .playback-display {
    flex: 1; /* 佔滿剩下的空間 */
    text-align: left;
    border: 2px solid #c5dfee;
    border-radius: 16px;
    padding: 20px;
    margin: 0;
    min-height: 140px;
    background: #fbfdff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
  }

  .playback-display .line { font-size: 21px; line-height: 1.5; word-break: break-word; }
  .playback-display .line.next-line { color: #6b6b6b; font-size: 19px; }

  .playback-display .word {
    border-radius: 4px;
    padding: 1px 2px;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .playback-display .word.active-word { background: #ffd166; color: #222; }

  /* 上下句按鈕 (移到右側) */
  .vertical-nav {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
  }
  .vertical-nav button {
    flex: 0 0 auto;
    width: 46px;
    height: 46px;
    min-width: 46px;
    padding: 0;
    font-size: 20px;
    border-radius: 12px;
  }

  .translation-panel {
    display: none;
    margin-top: 10px;
    padding: 12px 16px;
    background: #eef8f0;
    border: 2px dashed #7fbf9a;
    border-radius: 12px;
    font-size: 17px;
    line-height: 1.6;
    color: #2f6b47;
    text-align: left;
  }
  .translation-panel.visible { display: block; }
  .translation-panel.empty { color: #8fae9c; font-style: italic; }

  /* 語速與翻譯按鈕列 */
  .speed-translate-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    padding: 0 4px;
  }
  .speed-control-group {
    flex: 1;
    display: flex;
    align-items: center;
    text-align: left;
  }
  .speed-control-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .speed-title {
    font-size: 13px; color: #2a628f; font-weight: 700;
  }
  .speed-btn {
    width: 32px;
    height: 32px;
    min-width: 32px;
    padding: 0;
    border-radius: 8px;
    font-size: 18px;
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    cursor: pointer;
  }
  .speed-btn:hover:not(:disabled) { background-color: #dcebf5; }
  .speed-btn:active:not(:disabled) { background-color: #c5dfee; }
  .speed-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .translate-btn {
    width: 46px;
    height: 46px;
    min-width: 46px;
    padding: 0;
    border-radius: 12px;
    font-size: 20px;
    flex: none;
    background-color: #eef5fa;
    color: #2a628f;
    border: 2px solid #c5dfee;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .translate-btn:hover { background-color: #dcebf5; }
  .translate-btn.active { background-color: #2a628f; color: #fff; border-color: #2a628f; }

  /* 原本的 nav-row 已不需要 */
  .nav-row { display: none; }

  /* ---------- recording panel: visually boxed off ---------- */
    #record-panel {
    display: none;
    margin-top: 16px;
    padding: 16px 16px 8px;
    border: 2px dashed #f3b23c;
    background: #fff8ec;
    border-radius: 14px;
    transition: background-color 0.25s ease, border-color 0.25s ease;
  }
  #record-panel.visible { display: block; }

  .record-panel-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    color: #b3701a;
    text-align: left;
    margin-bottom: 10px;
    letter-spacing: 0.02em;
  }
  .record-panel-title-text { flex: 1 1 auto; }
  .save-btn {
    flex: 0 0 auto;
    min-width: auto;
    padding: 6px 12px;
    font-size: 13px;
    background-color: #fff;
    color: #b3701a;
    border: 2px solid #f3b23c;
  }
  .save-btn:hover { background-color: #fff2da; }

  /* Enable/disable switch */
  .toggle-switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
    flex: 0 0 auto;
  }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #cfcfcf;
    transition: background-color 0.2s ease;
    border-radius: 24px;
  }
  .toggle-slider::before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: #fff;
    transition: transform 0.2s ease;
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .toggle-switch input:checked + .toggle-slider { background-color: #1c7a4d; }
  .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

  #record-controls-wrapper {
    overflow: hidden;
    max-height: 220px;
    opacity: 1;
    margin-top: 12px;
    transition: max-height 0.25s ease, opacity 0.25s ease, margin-top 0.25s ease;
  }

  /* Dark/disabled state */
  #record-panel.panel-disabled {
    background: #383838;
    border-color: #5a5a5a;
  }
  #record-panel.panel-disabled .record-panel-title-text { color: #cfcfcf; }
  #record-panel.panel-disabled #record-controls-wrapper {
    max-height: 0;
    opacity: 0;
    margin-top: 0;
    pointer-events: none;
  }

  /* ---------- Load Text / Save-To views ---------- */
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: #2a628f;
    text-align: left;
    margin-top: 18px;
    margin-bottom: 8px;
  }
  .project-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
  }
  .project-row {
    display: flex;
    gap: 8px;
  }
  .project-btn { 
    flex: 1 1 auto; 
    text-align: left; 
    white-space: nowrap; 
    overflow: hidden; 
    text-overflow: ellipsis; /* 文字過長時顯示點點點 */
  }
  .delete-btn { flex: 0 0 auto; min-width: 50px; }

  .slot-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 10px; }
  .slot-btn {
    background-color: #ffffff;
    color: #b3701a;
    border: 2px solid #f3b23c;
    flex: 1 1 auto;
    min-width: 90px;
    font-size: 14px;
    padding: 9px 10px;
  }
  .slot-btn:hover { background-color: #fff2da; }
  .slot-btn.active-slot {
    background-color: #f3b23c;
    color: #fff;
  }

  /* 錄音按鈕閃爍 */
  #btn-record-toggle.recording {
    background-color: #d64545;
    animation: pulse 1.1s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(214, 69, 69, 0); }
    100% { box-shadow: 0 0 0 0 rgba(214, 69, 69, 0); }
  }

  /* 播放錄音按鈕閃爍 (保持原本的按鈕背景顏色，加入藍色光暈) */
  #btn-play-pause.pulsing-play {
    animation: pulse-blue 1.1s infinite;
  }
  @keyframes pulse-blue {
    0% { box-shadow: 0 0 0 0 rgba(42, 98, 143, 0.4); }
    70% { box-shadow: 0 0 0 10px rgba(42, 98, 143, 0); }
    100% { box-shadow: 0 0 0 0 rgba(42, 98, 143, 0); }
  }

  .record-status {
    font-size: 13px;
    color: #d64545;
    margin: 4px 0 0;
    min-height: 14px;
    font-weight: 600;
  }

  #volume-row {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    margin-top: 14px;
    margin-bottom: -14px;
    text-align: left;
    padding: 0 6px; /* 為滑桿爭取一點邊距，防止手機超出 */
  }
  #volume-row label { font-size: 13px; color: #b3701a; font-weight: 600; }
  
  #volume-row input[type="range"] { 
    width: 100%; 
    max-width: 100%;
    accent-color: #f3b23c; 
    padding: 0; 
    margin: 0;
    box-sizing: border-box; 
    background: transparent; 
  }
  .gain-feedback { font-size: 11.5px; color: #a98750; min-height: 14px; }

  .hint { font-size: 12px; color: #9db6c6; margin-top: 10px; }

  /* ---------- HINT MODAL (學習筆記) ---------- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: none; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.active { display: flex; }
  
  .modal-content {
    background: #fff; width: 100%; max-width: 600px;
    border-radius: 16px; max-height: 90vh; display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  
  .modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 2px solid #f1f8fc;
  }
  .modal-header h3 { margin: 0; color: #2a628f; font-size: 1.4rem; font-weight: 800;}
  
  .modal-body {
    padding: 20px; overflow-y: auto; text-align: left;
  }
  
  .hint-section { margin-bottom: 24px; }
  .hint-section:last-child { margin-bottom: 0; }
  .hint-section h4 { margin: 0 0 12px 0; color: #b3701a; border-bottom: 2px dashed #f3b23c; padding-bottom: 6px; font-size: 1.1rem;}
  
  /* 單字排版 */
  .vocab-grid { display: grid; gap: 8px; }
  .vocab-row { 
    display: flex; align-items: center; gap: 12px; 
    background: #fbfdff; padding: 12px; 
    border-radius: 10px; border: 1px solid #c5dfee; 
  }
  .vocab-btn { 
    flex: 0 0 auto; background: none; border: none; font-size: 1.4rem; 
    cursor: pointer; padding: 0; line-height: 1; color: #2a628f; transition: transform 0.1s;
    min-width: 32px;
  }
  .vocab-btn:hover { transform: scale(1.1); }
  .vocab-text-wrap { display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; flex: 1; align-items: baseline; }
  .vocab-en { font-weight: 700; color: #0f4c81; font-size: 16px; }
  .vocab-zh { color: #555; font-size: 15px; }

  /* 文法排版 */
  .grammar-content {
    background: #eef8f0; padding: 16px; 
    border-radius: 10px; border: 1px solid #7fbf9a;
    color: #2f6b47; line-height: 1.7; 
    white-space: pre-wrap; /* 重要：保留換行 */
    word-break: break-word; font-size: 16px;
  }

  @media (max-width: 400px) {
    body { padding: 8px; }
    .app { padding: 18px 14px; border-radius: 12px; }
    h1 { font-size: 1.3rem; }
    .flags img { width: 28px; }
    select, button { font-size: 14px; padding: 10px; min-width: 84px; }
    .playback-display .line { font-size: 18px; }
    .playback-display .line.next-line { font-size: 16px; }
    
    .vocab-text-wrap { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ HOME ============ -->
  <div id="home-view" class="view active">
    <h1>Multilingual Text Reader & Recorder</h1>
    <div class="flags">
      <img src="https://flagcdn.com/w320/jp.png" alt="Japan Flag">
      <img src="https://flagcdn.com/w320/kr.png" alt="Korea Flag">
      <img src="https://flagcdn.com/w320/es.png" alt="Spain Flag">
      <img src="https://flagcdn.com/w320/us.png" alt="USA Flag">
    </div>
    <textarea id="home-textarea" placeholder="Type or paste text here..."></textarea>

    <div class="home-stack">
      <div class="paste-clear-row">
        <button id="btn-paste" class="secondary">📋 Paste Text</button>
        <button id="btn-clear" class="secondary">🗑️ Clear Text</button>
      </div>
      <select id="home-language">
        <option value="en-US" selected>English</option>
        <option value="ja-JP">日本語</option>
        <option value="ko-KR">한국어</option>
        <option value="es-ES">español</option>
      </select>
      <button id="btn-start">▶️ Start</button>
      
      <!-- 將 Load Text 與新的 AI Support 按鈕包在同一個兩欄網格中 -->
      <div class="paste-clear-row">
        <button id="btn-load-text" class="secondary">📂 Load Text</button>
        <button id="btn-ai-support" class="secondary">✨ AI Support</button>
      </div>
      
    </div>
  </div>

  <!-- ============ PLAYBACK ("Now Reading") ============ -->
  <div id="playback-view" class="view">
    <div class="playback-header">
      <div></div> <!-- 空白佔位，用來把標題擠到正中間 -->
      <h2 style="margin:0; white-space:nowrap;">📖 Now Reading</h2>
      <button id="btn-playback-close" class="icon-btn" title="Close">✕</button>
    </div>
    
    <div class="counter-row">
      <span id="sentence-counter" class="sentence-counter">1 of 1</span>
    </div>

    <div class="playback-display-wrapper">
      <div id="playback-display" class="playback-display"></div>
      
      <!-- 上下句按鈕移到這裡 (右側) -->
      <div class="vertical-nav">
        <button id="btn-prev" class="secondary" title="Previous">⬆️</button>
        <button id="btn-next" class="secondary" title="Next">⬇️</button>
      </div>
    </div>
    
    <div id="translation-panel" class="translation-panel"></div>

    <!-- 語速按鈕 與 翻譯 / 提示按鈕 -->
    <div class="speed-translate-row">
      <div class="speed-control-group">
        <div class="speed-control-inner">
          <span class="speed-title">⏱️ Speed: <span id="speed-label">1.00x</span></span>
          <button id="btn-speed-down" class="speed-btn" title="Slower">−</button>
          <button id="btn-speed-up" class="speed-btn" title="Faster">+</button>
        </div>
      </div>
      <button id="btn-toggle-translation" class="translate-btn" title="Show/hide translation">🌐</button>
      <button id="btn-lightbulb" class="translate-btn" title="Hint / Idea">💡</button>
    </div>

    <div class="btn-row">
      <button id="btn-pause-resume">⏸️ Pause</button>
      <button id="btn-stop" class="secondary">🔄 Start Over</button>
    </div>

    <div id="record-panel">
      <div class="record-panel-title">
        <label class="toggle-switch" title="Enable practice recording">
          <input type="checkbox" id="record-enable-toggle">
          <span class="toggle-slider"></span>
        </label>
        <span class="record-panel-title-text">🎤 PRACTICE RECORDING</span>
        <button id="btn-save-recording" class="secondary save-btn">💾 Save</button>
      </div>

      <div id="record-controls-wrapper">
        <div class="slot-row">
          <button id="btn-rec-slot-1" class="slot-btn active-slot">🟢 Rec #1</button>
          <button id="btn-rec-slot-2" class="slot-btn">🟢 Rec #2</button>
          <button id="btn-rec-slot-3" class="slot-btn">🟢 Rec #3</button>
        </div>

        <div id="record-row" class="btn-row" style="margin-top:0;">
          <button id="btn-record-toggle">🎤 Record</button>
          <button id="btn-play-pause" class="secondary" disabled>▶️ Play</button>
          <button id="btn-delete-recording" class="secondary" disabled>🗑️ Delete</button>
        </div>

        <div id="volume-row">
          <label for="playback-gain">🔊 Extra Volume: <span id="gain-label">1.5x</span></label>
          <input type="range" id="playback-gain" min="1" max="5" step="0.5" value="1.5">
          <div id="gain-feedback" class="gain-feedback"></div>
        </div>

        <div id="record-status" class="record-status"></div>

      </div>
    </div>

    <audio id="my-recording-audio" style="display:none"></audio>
  </div>

  <!-- ============ HINT MODAL (學習筆記) ============ -->
  <div id="hint-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>💡 學習筆記</h3>
        <button id="btn-close-hint" class="icon-btn">✕</button>
      </div>
      <div class="modal-body">
        <div id="hint-empty" style="display:none; color: #888; text-align: center; padding: 30px 10px;">
          這句很簡單，沒有特別的單字或文法筆記喔！😊
        </div>
        
        <div id="vocab-section" class="hint-section">
          <h4>📚 單字 & 片語</h4>
          <div id="vocab-container" class="vocab-grid"></div>
        </div>
        
        <div id="grammar-section" class="hint-section">
          <h4>📐 文法 & 句型</h4>
          <div id="grammar-container" class="grammar-content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ LOAD TEXT ============ -->
  <div id="load-text-view" class="view">
    <div class="playback-header">

      const match = cachedVoices.find(v => v.lang === lang && v.name.includes(name));

  // ---------------------------------------------------------------
  // IndexedDB persistence
  // ---------------------------------------------------------------
  const DB_NAME = 'MultilingualReaderDB';
  const DB_VERSION = 1;
  const STORE_PROJECTS = 'projects';

  function openDB() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB not supported')); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_PROJECTS)) {
          db.createObjectStore(STORE_PROJECTS, { keyPath: 'id' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbGetProject(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readonly');
      const req = tx.objectStore(STORE_PROJECTS).get(id);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  async function dbPutProject(project) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readwrite');
      tx.objectStore(STORE_PROJECTS).put(project);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function dbDeleteProject(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_PROJECTS, 'readwrite');
      tx.objectStore(STORE_PROJECTS).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  // ---------------------------------------------------------------
  // Sentence / word segmentation & Multi-Annotations Parser
  // ---------------------------------------------------------------
  function segmentSentences(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'sentence' });
        return Array.from(seg.segment(text), s => s.segment).filter(s => s.trim().length);
      } catch (e) { /* fall through */ }
    }
    const parts = text.split(/([.!?。！？\n]+)/);
    const result = [];
    for (let i = 0; i < parts.length; i += 2) {
      const str = parts[i];
      const punc = parts[i + 1] || '';
      const combined = (str + punc).trim();
      if (combined.length > 0) result.push(combined);
    }
    return result;
  }

  // 【全新升級】：解析 <> 翻譯、[] 單字、{} 文法
  function parseTextWithAnnotations(text, locale) {
    const translationsByIndex = [];
    const vocabsByIndex = [];
    const grammarsByIndex = [];

    // 1. 優先處理 {} 文法，保護裡面的 HTML 標籤不被誤判
    let cleaned = text.replace(/\{([^}]+)\}/g, (m, inner) => {
      grammarsByIndex.push(inner.trim());
      return `\u0003${grammarsByIndex.length - 1}\u0003`;
    });

    // 2. 處理 [] 單字
    cleaned = cleaned.replace(/\[([^\]]+)\]/g, (m, inner) => {
      vocabsByIndex.push(inner.trim());
      return `\u0002${vocabsByIndex.length - 1}\u0002`;
    });

    // 3. 處理 <> 翻譯
    cleaned = cleaned.replace(/<([^>]+)>/g, (m, inner) => {
      translationsByIndex.push(inner.trim());
      return `\u0001${translationsByIndex.length - 1}\u0001`;
    });

    const rawSentences = segmentSentences(cleaned, locale);
    const sentencesOut = [];
    const translationsOut = [];
    const vocabsOut = [];
    const grammarsOut = [];

    rawSentences.forEach(s => {
      // 找出這段文字裡所有的特殊標記
      const regex = /([\u0001\u0002\u0003])(\d+)\1/g;
      let match;
      let markersInSegment = [];
      while ((match = regex.exec(s)) !== null) {
        markersInSegment.push({
          type: match[1],
          idx: parseInt(match[2], 10),
          indexInString: match.index
        });
      }

      // 剔除所有標記，取得純文字原文
      const cleanS = s.replace(/[\u0001\u0002\u0003]\d+[\u0001\u0002\u0003]/g, ' ').trim();

      if (cleanS.length > 0) {
        sentencesOut.push(cleanS);
        translationsOut.push('');
        vocabsOut.push('');
        grammarsOut.push('');
        
        markersInSegment.forEach(m => {
          const isAtStart = s.substring(0, m.indexInString).trim().length === 0;
          let targetIdx = sentencesOut.length - 1;
          // 如果標記在整段字首，表示它可能被斷句器擠到了下一句，所以要還給上一句
          if (isAtStart && targetIdx > 0) {
            targetIdx--; 
          }
          
          if (m.type === '\u0001') {
            translationsOut[targetIdx] = translationsOut[targetIdx] ? translationsOut[targetIdx] + ' ' + translationsByIndex[m.idx] : translationsByIndex[m.idx];
          } else if (m.type === '\u0002') {
            vocabsOut[targetIdx] = vocabsOut[targetIdx] ? vocabsOut[targetIdx] + '\n' + vocabsByIndex[m.idx] : vocabsByIndex[m.idx];
          } else if (m.type === '\u0003') {
            grammarsOut[targetIdx] = grammarsOut[targetIdx] ? grammarsOut[targetIdx] + '\n' + grammarsByIndex[m.idx] : grammarsByIndex[m.idx];
          }
        });
      } else {
        // 全是標記，沒有純文字原文的情況
        if (sentencesOut.length > 0) {
          const targetIdx = sentencesOut.length - 1;
          markersInSegment.forEach(m => {
            if (m.type === '\u0001') translationsOut[targetIdx] = translationsOut[targetIdx] ? translationsOut[targetIdx] + ' ' + translationsByIndex[m.idx] : translationsByIndex[m.idx];
            if (m.type === '\u0002') vocabsOut[targetIdx] = vocabsOut[targetIdx] ? vocabsOut[targetIdx] + '\n' + vocabsByIndex[m.idx] : vocabsByIndex[m.idx];
            if (m.type === '\u0003') grammarsOut[targetIdx] = grammarsOut[targetIdx] ? grammarsOut[targetIdx] + '\n' + grammarsByIndex[m.idx] : grammarsByIndex[m.idx];
          });
        } else if (markersInSegment.length > 0) {
          // 極端防呆：第一句就直接是標記
          sentencesOut.push('');
          translationsOut.push('');
          vocabsOut.push('');
          grammarsOut.push('');
          markersInSegment.forEach(m => {
            if (m.type === '\u0001') translationsOut[0] = translationsByIndex[m.idx];
            if (m.type === '\u0002') vocabsOut[0] = vocabsByIndex[m.idx];
            if (m.type === '\u0003') grammarsOut[0] = grammarsByIndex[m.idx];
          });
        }
      }
    });

    return { 
      sentences: sentencesOut, 
      translations: translationsOut,
      vocabs: vocabsOut,
      grammars: grammarsOut
    };
  }

  function segmentWords(text, locale) {
    if (window.Intl && Intl.Segmenter) {
      try {
        const seg = new Intl.Segmenter(locale, { granularity: 'word' });
        let offset = 0;
        return Array.from(seg.segment(text), s => {
          const item = { text: s.segment, isWordLike: s.isWordLike, start: offset };
          offset += s.segment.length;
          return item;
        });
      } catch (e) { /* fall through */ }
    }
    let offset = 0;
    return text.split(/(\s+)/).filter(Boolean).map(s => {
      const item = { text: s, isWordLike: !/^\s+$/.test(s), start: offset };
      offset += s.length;
      return item;
    });
  }

  function playFromSentence(sentenceIndex, charOffset = 0) {
    if (sentenceIndex >= sentences.length) {
      isPlaying = false;
      currentSentenceIndex = 0;
      currentOffsetInSentence = 0;
      renderPlaybackWindow();
      updatePlaybackButtons();
      return;
    }

    currentSentenceIndex = sentenceIndex;
    renderPlaybackWindow();

    const sentenceText = sentences[sentenceIndex];
    const rawRemaining = sentenceText.slice(charOffset);
    const remaining = rawRemaining.trimStart();
    const baseOffset = charOffset + (rawRemaining.length - remaining.length);

    if (!remaining) {
      playFromSentence(sentenceIndex + 1, 0);
      return;
    }

    utterance = new SpeechSynthesisUtterance(remaining);
    utterance.lang = activeLanguage;
    utterance.rate = SPEED_LEVELS[currentSpeedIndex]; 
    const preferredVoice = pickVoiceForLang(activeLanguage);
    if (preferredVoice) utterance.voice = preferredVoice;

    utterance.onboundary = (event) => {
      if (event.charIndex === undefined) return;
      currentOffsetInSentence = baseOffset + event.charIndex;
      highlightWord(sentenceIndex, currentOffsetInSentence);
    };

    utterance.onend = () => {
      stopIOSKeepAlive();
      if (!isPlaying) return;
      if (recordingModeEnabled) {
        isPlaying = false;
        updatePlaybackButtons();
      } else {
        playFromSentence(sentenceIndex + 1, 0);
      }
    };

    utterance.onerror = () => {
      stopIOSKeepAlive();
      if (isPlaying) { isPlaying = false; updatePlaybackButtons(); }
    };

    currentOffsetInSentence = baseOffset;
    isPlaying = true;
    requestWakeLock(); 
    synth.speak(utterance);
    startIOSKeepAlive();
    updatePlaybackButtons();
  }

    return true;
  }

  let mediaRecorder = null;
  let mediaStream = null;
  let isRecording = false;
  let recordingChunks = [];
  let recordStartTime = 0;
  let recordTimerInterval = null;
  let currentRecSlot = 1;

  function resetAllRecordings() {
    for (const sIdx in sentenceRecordings) {
      for (const slot in sentenceRecordings[sIdx]) {

      }

  function getCurrentSlotRecording() {
    if (!sentenceRecordings[currentSentenceIndex]) return null;
    return sentenceRecordings[currentSentenceIndex][currentRecSlot] || null;
  }

  let audioCtx = null;
  let mediaElementSource = null;
  let recordingGainNode = null;

  function ensureAudioGraph() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (!mediaElementSource) {
      mediaElementSource = audioCtx.createMediaElementSource(myRecordingAudio);
      recordingGainNode = audioCtx.createGain();
      recordingGainNode.gain.value = 1;

      const leveler = audioCtx.createDynamicsCompressor();
      leveler.threshold.value = -20;
      leveler.knee.value = 6;
      leveler.ratio.value = 3;
      leveler.attack.value = 0.01;
      leveler.release.value = 0.15;

      const safetyLimiter = audioCtx.createDynamicsCompressor();
      safetyLimiter.threshold.value = -1;
      safetyLimiter.knee.value = 0;
      safetyLimiter.ratio.value = 20;
      safetyLimiter.attack.value = 0.002;
      safetyLimiter.release.value = 0.1;

      mediaElementSource
        .connect(recordingGainNode)
        .connect(leveler)
        .connect(safetyLimiter)
        .connect(audioCtx.destination);
    }
  }

  const TARGET_RMS = 0.1; 

  function getRMSAmplitude(audioBuffer) {
    let sumSquares = 0;
    let count = 0;
    for (let ch = 0; ch < audioBuffer.numberOfChannels; ch++) {
      const data = audioBuffer.getChannelData(ch);
      for (let i = 0; i < data.length; i++) {
        sumSquares += data[i] * data[i];
        count++;
      }
    }
    return count > 0 ? Math.sqrt(sumSquares / count) : 0;
  }

  async function computeAndApplyGain(blob) {
    const userGain = parseFloat(gainSlider.value) || 1;
    let normalizeGain = 1;
    try {
      const arrayBuffer = await blob.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      const rms = getRMSAmplitude(decoded);
      normalizeGain = rms > 0.0001 ? Math.min(TARGET_RMS / rms, 20) : 1;
      gainFeedback.textContent = '';
    } catch (err) {
      gainFeedback.textContent = '⚠️ 此錄音無法自動正規化音量，僅套用手動倍率。';
    }
    const totalGain = normalizeGain * userGain;
    recordingGainNode.gain.value = totalGain;
    const totalGainDb = 20 * Math.log10(totalGain);
    if (!gainFeedback.textContent) {
      gainFeedback.textContent = `🎚️ Applied gain: +${totalGainDb.toFixed(1)} dB (normalize + boost)`;
    }
  }

  gainSlider.addEventListener('input', () => {
    gainLabel.textContent = parseFloat(gainSlider.value).toFixed(1) + 'x';
    if (recordingGainNode && !myRecordingAudio.paused) {
      const rec = getCurrentSlotRecording();
      if (rec) computeAndApplyGain(rec.blob);
    }
  });

  function pickSupportedMimeType() {
    const candidates = [
      'audio/mp4',               
      'audio/webm;codecs=opus',  
      'audio/webm',
      'audio/ogg;codecs=opus'
    ];
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
  }

  async function startRecording() {
    if (!recordingModeEnabled) return;
    let rawStream;
    try {
      rawStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: IS_IOS ? true : false,
          noiseSuppression: IS_IOS ? true : false,
          autoGainControl: IS_IOS ? false : true 
        }
      });
    } catch (err) {
      alert('需要麥克風權限才能錄音。請允許權限後重試。');
      return;
    }

    resetPlaybackState();
    recordingChunks = [];
    const recordedForSentence = currentSentenceIndex;
    const recordedForSlot = currentRecSlot;

    if (IS_IOS) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(rawStream);
        const gainNode = audioCtx.createGain();
        
        gainNode.gain.value = 3.0; 
        
        const destination = audioCtx.createMediaStreamDestination();
        source.connect(gainNode);
        gainNode.connect(destination);
        
        mediaStream = destination.stream;
        mediaStream.rawHardwareStream = rawStream; 
      } catch (err) {
        console.warn('iOS 音量放大失敗，退回預設', err);
        mediaStream = rawStream;
      }
    } else {
      mediaStream = rawStream;
    }

    try {
      const mimeType = pickSupportedMimeType();
      mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
    } catch (err) {
      alert('您的瀏覽器不支援錄音功能。');
      if (mediaStream && mediaStream.rawHardwareStream) {
        mediaStream.rawHardwareStream.getTracks().forEach(t => t.stop());
      }
      mediaStream = null;
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordingChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(recordingChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const url = URL.createObjectURL(blob);

      if (!sentenceRecordings[recordedForSentence]) sentenceRecordings[recordedForSentence] = {};
      if (sentenceRecordings[recordedForSentence][recordedForSlot]) {
        URL.revokeObjectURL(sentenceRecordings[recordedForSentence][recordedForSlot].url);
      }
      sentenceRecordings[recordedForSentence][recordedForSlot] = { blob, url };

      if (mediaStream && mediaStream.rawHardwareStream) {
        mediaStream.rawHardwareStream.getTracks().forEach(t => t.stop());
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
      }
      mediaStream = null;
      isRecording = false;
      clearInterval(recordTimerInterval);
      recordTimerInterval = null;
      setControlsDisabledForRecording(false);
      updateRecordButtons();
    };

    mediaRecorder.start();
    isRecording = true;
    recordStartTime = Date.now();
    setControlsDisabledForRecording(true);
    btnRecordToggle.disabled = false;
    btnRecordToggle.textContent = '⏹️ Stop';
    btnRecordToggle.classList.add('recording');

    recordTimerInterval = setInterval(() => {
      const secs = Math.floor((Date.now() - recordStartTime) / 1000);
      recordStatus.textContent = `● Recording… ${secs}s`;
    }, 250);
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) mediaRecorder.stop();
  }

  btnRecordToggle.addEventListener('click', () => {
    if (isRecording) stopRecording();
    else startRecording();
  });

  btnPlayPause.addEventListener('click', async () => {
    if (!recordingModeEnabled) return;
    const rec = getCurrentSlotRecording();
    if (!rec) return;

    if (!myRecordingAudio.paused) {
      myRecordingAudio.pause();
      return;
    }

    ensureAudioGraph();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    if (myRecordingAudio.src !== rec.url) {
      myRecordingAudio.src = rec.url;
      myRecordingAudio.load();
    }

    await computeAndApplyGain(rec.blob);

    myRecordingAudio.play().catch(err => {
      console.error('Playback failed:', err);
      alert('無法播放此錄音檔，請檢查瀏覽器設定。');
    });
  });

  btnDeleteRecording.addEventListener('click', () => {
    if (!recordingModeEnabled) return;
    const rec = getCurrentSlotRecording();
    if (!rec) return;
    
    URL.revokeObjectURL(rec.url);
    delete sentenceRecordings[currentSentenceIndex][currentRecSlot];
    
    if (myRecordingAudio.src === rec.url) {
      myRecordingAudio.removeAttribute('src');
      myRecordingAudio.load();
    }
    
    resetPlaybackState();
    updateRecordButtons();
  });
</script>
</body>
</html>
